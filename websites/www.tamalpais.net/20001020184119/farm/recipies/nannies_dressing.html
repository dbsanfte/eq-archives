<b>Mix together:</b>
<ul>
<li>1 cup oil
<li>1/3 cup sugar (or a little less)
<li>1 tsp. salt
<li>1 tsp. paprika
<li>a dash of cayenne pepper
</ul>
Slowly add while stirring:
<ul>
<li>1/2 cup vinegar (or a little more)
</ul>
Grate in 1 small onion (or cut it in chunks and strain it out when you use the dressing).
