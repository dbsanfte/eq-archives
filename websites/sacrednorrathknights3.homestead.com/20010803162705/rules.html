<TD><DIV align=center><U><B><FONT COLOR=#9933cc><FONT class="TimesRoman24" FACE="Times New Roman, adobe-times, Times" SIZE="5">Sacred Norrath Knights </FONT></FONT></B></U></DIV><DIV align=center><U><B><FONT COLOR=#9933cc><FONT class="TimesRoman24" FACE="Times New Roman, adobe-times, Times" SIZE="5">Rules &#038; Regulations:</FONT></FONT></B></U></DIV><DIV align=left><FONT COLOR=#ff0033><FONT class="TimesRoman24" FACE="Times New Roman, adobe-times, Times" SIZE="5"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ff0033><FONT class="TimesRoman24" FACE="Times New Roman, adobe-times, Times" SIZE="5"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ff0033><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">Rules and Regulations for </FONT></FONT><FONT COLOR=#99ff99><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">Regular Members</FONT></FONT><FONT COLOR=#ff0033><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">:</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ff0033><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">1. No Vulgar Swearing in Public. i.e. in the &#034;say&#034;, &#034;out of character&#034;, and &#034;shout&#034; mode.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">2. No Stealing ~ From ANYONE !</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">3. Be courteous about everything you do in EQ.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">4. If you have a problem, resolve it as kindly as possible,(you don't want to bring our guild name bad tidings)</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">5. When chatting with other Sacred Norrath Knights you may trash talk ~ as long as you keep it in a private &#034;tell&#034; message, and or the other member knows that you are J/K</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">6. No Spamming~ unless in &#034;group&#034; mode and are trying to teach your language to others( with their permission of course)</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">7. Guild chat Should be kept professional at all times, unless evryone in the guild (online) doesnt mind the comments.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">8. NON-COMPLIANCE of these rules may lead your character twords a withdrawl from the guild!</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">9. The Sacred Norrath Knights will not tolerate the breaking of the rules.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">10. FINALLY~ HAVE FUN!!!!!!!!</FONT></FONT></DIV><DIV align=left><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4"><BR></FONT></DIV><DIV align=left><FONT COLOR=#99ffff><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">Officers </FONT></FONT><FONT COLOR=#ff0033><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">Duties and Responsibilities:</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ff0033><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">1. Officers will have the privilage of recruiting new members to the guild.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">2. In order to invite new members you must do 1 of 2 things: get 1 other officers' approval, or the leaders' approval.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">3. ALL new members must be at least lvl 15 to join.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">4. When you recruit a new member, get thier Stats and Email and send it to me ~ via Email.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">5. Officers MUST show thier best behavior while role-playing in EQ.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">6. ANONYMOUS must be turned off while playing.~ unless noted by the Leader.&nbsp; So other members know when you are an for help.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">7. At all times you must show Leadership twords all members of the guild ~ Especially the lower lvl members.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">8. When a member needs your help, you </FONT></FONT><U><FONT COLOR=#ffffff><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">must</FONT></FONT></U><FONT COLOR=#ffffff><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4"> go out of your way to help them. (if you can)</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">9. Must report any incidents of any nature to the leader, and the disciplinary officer.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">10. Lastly, ALL RULES ABOVE APPLY TO YOU TOO!!!!</FONT></FONT></DIV></TD>
