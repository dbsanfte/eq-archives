<TR>
	<TD COLSPAN=7 BGCOLOR="#004000"><!--
	     <center><font size="+2" color="#FFFFFF"><B>Forthcoming Changes to Main Calendar:</B></font></center>
<font color="#FFFFFF">Per discussion on the <a href="http://pub6.ezboard.com/fluclin71335dragonsandtheplanes"><font color="#FFEFEE"><u>Luclin Dragons and Planes message board</u></font></a>, the main calendar will only be used for specific zones and areas.  This will disclude the reservation of dragons and other mobs generally considered special.  The current list of "reservable" areas is: Plane of Hate, Plane of Fear, Plane of Growth, Plane of Sky.  Please visit the Dragons and Planes message board to leave your opinion on what other zones or areas should be reservable.  Please do not re-open the discussion on reservation of dragons on the calendar as we are very well convinced that list style reservation is far more efficient than calendar style reservation for these situations.<br><br>-->
             <center><font size="+2" color="#FFFFFF"><B>Calendar Guidelines</b></font></center><font color="#FFFFFF">
     <ol>
        <li>Do not have more than 3 current reservations anywhere on the calendar starting from todays date.</li>
        <li>Do not have more than 1 current weekend (Friday, Saturday, Sunday) reservation.</li>
        <li>Do not exploit the reservation system by posting under different names or using a multi-guild reservation rotation which
 unfairly monopolizes zones/spawns.</li>
	<li>If you see a group grosely overusing the calendar, bring it to their attention and to the attention of the luclin.com community by posting about it on the Dragons and Planes message board.  If they refuse to forfeit any dates and are clearly over reserving, all current reservations except the first three will be removed.</li>
     </ol>
Please remember, you can always do unannounced pickup raids without using the calendar, and you can always contact a raid leader to
work things out if you are interested in a day they have reserved.
Issues, complaints, and notifications that rules are being broken should be placed in the General or Dragons and Planes forum of the
 Luclin.com message board.  If the calendar is clearly being abused, your reservations may be erased.  Please try to work together,
without cooperation these reservations are useless since they are unofficial and not recognized by Verant.</font>
<br><br><font color="#ffffff">
Addendum: Please visit <a href="http://everquest.station.sony.com/support/policies/conduct.jsp"><font color="#ffffff">http://everquest.station.sony.com/support/policies/conduct.jsp</font></a> for the current Rules of Conduct and Play Nice Policy for information.  It is <b>the players</b> responsibility to work together and get along, and this is a simple attempt to do so in an otherwise hectic high level game in dangerous zones.  I am in no way saying that we are required to use a calendar, but we are required to work things out less we wish to steal GM's time to resolve issues for us.  If the GM's are doing a good job in my opinion, nobody will like the outcome of a GM PnP resolution as it is a waste of their time to have to deal with issues that should be taken care of by the players.
</font>
<center><font size="+2" color="#FFFFFF"><br>Have Fun!</font></center><br>
