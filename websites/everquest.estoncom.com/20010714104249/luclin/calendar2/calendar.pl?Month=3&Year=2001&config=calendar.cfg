	<input type="hidden" name="ref" value="post">
	<input type="hidden" name="REQUIRED" value="name|description|heading">
	<TR>
		<TD BGCOLOR="#004000" ALIGN=CENTER COLSPAN=4><font color="white" size=+1><B>Add an Event</B></font></TD>
