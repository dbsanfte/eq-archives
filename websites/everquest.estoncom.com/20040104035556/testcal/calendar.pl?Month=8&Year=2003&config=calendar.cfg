<!-- Add An Entry Form -->
<table border="0" cellspacing="10" cellpadding="0" width="98%">
<tr><td align="right"><br><hr><font color="#FFFFDE" size="-1">Please state what the raid/event is and who it is for briefly in the heading.  Use the description field to expand on times, invitations, etc.</font><hr></td>
<td>
<TABLE BORDER=1 CELLSPACING=0 CELLPADDING=3> 
	<form action="/testcal/calendar.pl" method=post>
	<input type="hidden" name="ACTION" value="DO_ADD">
	<input type="hidden" name="config" value="calendar.cfg">
	<input type="hidden" name="ref" value="post">
	<input type="hidden" name="REQUIRED" value="name|description|heading">
	<TR>
		<TD BGCOLOR="#004000" ALIGN=CENTER COLSPAN=4><font color="white" size=+1><B>Add an Event</B></font></TD>
	</TR>
	<TR>
		<TH BGCOLOR="#CCCCCC">Name</TH>
		<TD BGCOLOR="#CCCCCC"><input type="text" name="name" size="15" maxlength="15"></TD>

		<TH BGCOLOR="#CCCCCC">E-Mail</TH>
		<TD BGCOLOR="#CCCCCC"><input type="text" name="email" size="25" maxlength="75"></TD>
	</TR>
	<TR>
		<TH BGCOLOR="#CCCCCC">Date</TH>
		<TD BGCOLOR="#CCCCCC">
			<input name="Month" size=2 maxlength=2 value="8"> / <input name="Date" size=2 maxlength=2 value=""> / <input name="Year" size=4 maxlength=4 value="2003"><br>
		

