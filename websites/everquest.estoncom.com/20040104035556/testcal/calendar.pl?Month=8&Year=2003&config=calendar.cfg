	<TD COLSPAN=7 BGCOLOR="#004000">
             <center><font size="+2" color="#FFFFFF"><B>Calendar Guidelines</b></font></center><font color="#FFFFFF">
     <ol>
 	<li>Do not have more than 3 current reservations.</li>
	<li>Do not have more than 1 current weekend (Friday, Saturday, Sunday) reservation.</li>
	<li>Do not exploit the reservation system by posting under different names or using a multi-guild reservation rotation which unfairly monopolizes zones/spawns.</li>
     </ol>
Please remember, you can always do unannounced pickup raids without using the calendar, and you can always contact a raid leader to work things out if you are interested in a day they have reserved.
Issues, complaints, and notifications that rules are being broken should be placed in the General or Dragons and Planes forum of the Luclin.com message board.  If the calendar is clearly being abused, your reservations may be erased.  Please try to work together, without cooperation these reservations are useless since they are unofficial and not recognized by Verant.</font></TD>
