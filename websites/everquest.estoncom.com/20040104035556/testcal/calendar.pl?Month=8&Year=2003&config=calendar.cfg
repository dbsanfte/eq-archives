		<TD COLSPAN=4 ALIGN=RIGHT BGCOLOR="#CCCCCC"><input type="reset" value="Cancel">&nbsp;&nbsp;&nbsp;<input type="submit" value="Save"></TD>
	</TR>
	</form>
