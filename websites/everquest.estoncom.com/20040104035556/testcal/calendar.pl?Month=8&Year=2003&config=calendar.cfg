	<input type="checkbox" name="annual" value="1" onClick="if(form.annual.checked == true){form.Year.value='0000'}else{form.Year.value='2003'}"> Every Year

end comment-->


		</TD>
		<TH BGCOLOR="#CCCCCC">Heading</TH>
		<TD BGCOLOR="#CCCCCC"><input name="heading" size="25" maxlength="30"></TD>
	</TR>
	<TR>
		<TH BGCOLOR="#CCCCCC">Description</TH>
		<TD BGCOLOR="#CCCCCC" COLSPAN=3><textarea name="description" cols=50 rows=3></textarea></TD>
	</TR>
