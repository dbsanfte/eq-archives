   function go () {
      document.FORM.action = "cgi-bin/list.pl";

      x = true;
      if (document.FORM.max[document.FORM.max.selectedIndex].text - document.FORM.min[document.FORM.min.selectedIndex].text > 20) {

      }

   function checkMIAs(on) {
      if (on && document.FORM.nomias.checked) {
         document.FORM.nomias.checked = 0;
      }
      if (on && document.FORM.noretired.checked) {
         document.FORM.noretired.checked = 0;
      }
      if (on && document.FORM.nopaused.checked) {
         document.FORM.nopaused.checked = 0;
      }
      if (on && document.FORM.onlyofficers.checked) {
          document.FORM.onlyofficers.checked = 0;
      }
      if (!on && document.FORM.onlymias.checked) {
         document.FORM.onlymias.checked = 0;
      }
      if (!on && document.FORM.onlyofficers.checked) {
          document.FORM.onlyofficers.checked = 0;
      }
   }
   function checkPaused(on) {
      if (on && document.FORM.onlymias.checked) {
         document.FORM.onlymias.checked = 0;
      }
   }
   function checkRetired(on) {
      if (on && document.FORM.onlymias.checked) {
         document.FORM.onlymias.checked = 0;
      }
   }
   function checkOfficers() {
      if (document.FORM.onlyofficers.checked && document.FORM.onlymias.checked) {
          document.FORM.onlymias.checked = 0;
      }
      if (document.FORM.onlyofficers.checked && document.FORM.nomias.checked) {
          document.FORM.nomias.checked = 0;
      }
   }
   //-->
