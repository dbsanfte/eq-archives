<html>
<head>
<title>Make Your Mark in My World</title>
<link rel="stylesheet" href="midnightstyle.css" style="text/css">
<script language="javascript">
function validateform(form)
{
	if (form.name.value != "" && form.message.value != "")
	{
		form.submit();
	}
	else
	{
		window.alert('All Fields Must Contain Data');
	}
}
</script>
</head>
<body class="content">
<h2>Thank you for your input on my site.</h2>
<p><small>All Fields Required</small></p>
<form method="post" action="signgb.php">
  <table width="48%" border="0" cellspacing="0" cellpadding="0">
    <tr valign="top" align="left"> 
      <td width="19%">Name: </td>
      <td width="81%"> 
        <input type="text" name="name" size="55" maxlength="50">
      </td>
    </tr>
    <tr> 
      <td width="19%" valign="top">Message:</td>
      <td width="81%"> 
        <textarea name="message" cols="50" rows="6"></textarea>
      </td>
    </tr>
  </table>
  <p>
    <input type="button" value="Submit Comments" onClick="validateform(this.form)">
    <input type="reset" value="Clear Form">
  </p>
  </form>
</html>
