<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=584><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=206><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">Raid in Kedge Keep</FONT></FONT></B></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="1">Sildaan [5/27/01]</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Raid in Kedge this monday.We are trying to help get some items for Traegen and another person to finish a quest. Time: 11am pst, 1pm cst, 2pm est.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Zone info is </FONT></FONT><A HREF=http://www.eqatlas.com/kedgekeep.html TARGET="_blank"><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">here</FONT></A></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Let me know in game if you plan to attend</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><A HREF=#TOP><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">TOP</FONT></A></DIV></TD></TR></DIV></TABLE>
</DIV>

<DIV style="margin-top: 2337px; margin-left: 153px">
<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=584><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=379><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">Raid Restults from Kedge Keep</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="1">Masakari Yakikorosu [5/29/01]</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="1"><BR></FONT></FONT></B></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Grats all, particularly Traegen, on a mostly successful mini-raid of kedge keep. The raid group, consisting of me (Masakari), Nekekami, Traegen, Farook, Jarmal and Sildaan (later Screed) went fairly deep into kedge to camp the golden-haired mermaid. Sildaan was the unlucky one, and died 3 times to various causes, as well as Traegen, who drowned while not paying attention (/bonk), but all got rezzes so was good at the end. The Mermaid popped after about 3 hours of camping and was readily dispatched, clearing the way for Trae to get his Raincaller (30/45 6 STR 6 DEX Effect: Firestryle (300pt dd).</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Afterwards, Neke, Jarmal, Sildaan, Traegen and I made the journey to the City of Mist, where we had a far easier time. Camping the bridge with one or two other people to make a full group, we got some VERY nice exp (I for one got over a bubble of XP even though I'm in hell at 45). Loot was not too shabby either, Neke and I both won a Runewood Great Staff (22/40 2 DEX 5 SVM), and Sildaan won a Wraith Bone Hammer for his shammy (8/26 5 STR 2 INT 2 WIS).</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Grats to all again, and good luck in the future.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Masakari Yakikorosu</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Bard of 45 Songs</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Fallen Gods </FONT></FONT></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="1"><BR></FONT></FONT></B></DIV><DIV align=left><A HREF=#TOP><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">TOP</FONT></A></DIV></TD></TR></DIV></TABLE>
</DIV>

<DIV style="margin-top: 487px; margin-left: 153px">
<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=584><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=1623><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Patch of the month... Will it be good? or bad ? </FONT></FONT></B><B><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">( and will it cause MT to go down tons as normal :/&nbsp; )</FONT></FONT></B></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="1">Kelmore [5/30/01]</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">*** Patch Message ***</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">** Zone Changes **</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Runnyeye has been changed. Something is up in Goblin land...</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">** Spell and Song Changes and Bug Fixes **</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- We've been fixing holes in the spell stacking code. For the most part the changes fix bugs that allowed tricks to get spells to stack that were never intended to stack.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Increased duration on Bard Charm songs to 18 seconds from 12 seconds.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Fixed the Spell Scroll for Imbue Amber so that Erudite Clerics of Cazic Thule can scribe it.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- The casting messages for Necromancer pet summoning spells have been changed to be more appropriate.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">** Features and Interface Changes **</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- The variable %t will now work with /assist. So you can use /assist %t if you wish. Though it should have exactly the same effect as /assist without the %t.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- %r returns &#034;corpse&#034; for corpses and &#034;NPC&#034; for targeted NPCs.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Sense traps failure message text color has been changed to user color 15 (same as other skill messages). The success message was already set to user color 15.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Ignore Lists now work the same way that the Friends List does. It has been expanded to 30 names per character per server. The new ignore list is stored in the same ini file as the friends list </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">(&#060;character name&#062;_&#060;#&#062;.ini). The first time a character is created or loaded after the patch their new ignore list will be a copy of the old ignore list, but will from then on be unique to the character.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- The Alt key now works in several new situations. It will now show item names when in the trade window. Because the trade items of the local player and the trading partner are so close together, the item names of the trading partner will always show up unless the player positions their mouse pointer over the local player part of the trade window, which will cause the game to only show the local player's trade item names.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- The Alt key will show item names for items in your bank.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- The Alt key will also pop up names for merchant items and corpse items when you hold it down in merchant mode or loot mode.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- The Alt key will even pop up names for items in open containers when held down and the mouse cursor is over the open container window (they don't show up otherwise).</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- The client will now automatically reject a /duel request from any player that is on your /ignore list. Some players were using this to annoy players that had ignored them.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- You also will no longer see /consent messages from people that are on your /ignore list (this was also something people were doing to annoy people that had ignored them).</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- /who GUILD (and the GUILD must be in caps) will now show you the members of your guild in your zone. You can also specify a guild name, such as /who &#034;Irontoe Brigade&#034;.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- /safelock command added. /safelock will lock the EverQuest interface (mostly just mouse clicks, keyboard commands/movement, and most slash commands) with the password that you supply to the command. You must use this command a second time, supplying the same password, to unlock the interface. Passwords are NOT case-sensitive. So to lock your interface, you would type /safelock password. You would do the same to unlock it. REMEMBER: If you forget what password you typed, you will need to reboot your machine.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">** Item Changes **</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- All the shields in the game that have the Ribcage graphic should now also have the ribcage icon when they are in your inventory.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Tinkered Watchman helm should show up now.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Ring of Pureblood is now equipable only on your fingers instead of&nbsp; your waist.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Grand Master's Leg Wraps and Fists of the Grand Master are now No-Drop. They were intended to be No-Drop when they were created. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Peacekeeper Staff and the Bug Collection box are no longer equipable. There are problems that can arise when containers can be equipped, so we had to disable that for these items.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Sewing Kits: No existing sewing kits are being changed with this patch. But from now on, kits sold on vendors will be somewhat different. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Large Sewing Kits will have 8 slots. Deluxe Sewing Kits will have 10 slots and weight slightly more than the Large Sewing Kit.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Changed the color of the Kael SK quest armor from a very pretty blue-green to a more appropriate reddish-gray.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">** Other Stuff **</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Changed the spelling of Troubador to Troubadour for the 55th level bard title. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- King Tormax's spawn rate has been adjusted to be more in line with that of his counterparts in Velious. This is not the sort of thing that we will usually announce, as spawn times and things of that </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">nature are part of the dynamic content of EverQuest. We're announcing this, however, to help avoid some confusion.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- The EverQuest Team</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><A HREF=#TOP><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> TOP</FONT></A></DIV></TD></TR></DIV></TABLE>
</DIV>

<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=584><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=1623><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Patch of the month... Will it be good? or bad ? </FONT></FONT></B><B><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">( and will it cause MT to go down tons as normal :/&nbsp; )</FONT></FONT></B></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="1">Kelmore [5/30/01]</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">*** Patch Message ***</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">** Zone Changes **</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Runnyeye has been changed. Something is up in Goblin land...</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">** Spell and Song Changes and Bug Fixes **</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- We've been fixing holes in the spell stacking code. For the most part the changes fix bugs that allowed tricks to get spells to stack that were never intended to stack.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Increased duration on Bard Charm songs to 18 seconds from 12 seconds.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Fixed the Spell Scroll for Imbue Amber so that Erudite Clerics of Cazic Thule can scribe it.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- The casting messages for Necromancer pet summoning spells have been changed to be more appropriate.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">** Features and Interface Changes **</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- The variable %t will now work with /assist. So you can use /assist %t if you wish. Though it should have exactly the same effect as /assist without the %t.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- %r returns &#034;corpse&#034; for corpses and &#034;NPC&#034; for targeted NPCs.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Sense traps failure message text color has been changed to user color 15 (same as other skill messages). The success message was already set to user color 15.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Ignore Lists now work the same way that the Friends List does. It has been expanded to 30 names per character per server. The new ignore list is stored in the same ini file as the friends list </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">(&#060;character name&#062;_&#060;#&#062;.ini). The first time a character is created or loaded after the patch their new ignore list will be a copy of the old ignore list, but will from then on be unique to the character.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- The Alt key now works in several new situations. It will now show item names when in the trade window. Because the trade items of the local player and the trading partner are so close together, the item names of the trading partner will always show up unless the player positions their mouse pointer over the local player part of the trade window, which will cause the game to only show the local player's trade item names.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- The Alt key will show item names for items in your bank.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- The Alt key will also pop up names for merchant items and corpse items when you hold it down in merchant mode or loot mode.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- The Alt key will even pop up names for items in open containers when held down and the mouse cursor is over the open container window (they don't show up otherwise).</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- The client will now automatically reject a /duel request from any player that is on your /ignore list. Some players were using this to annoy players that had ignored them.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- You also will no longer see /consent messages from people that are on your /ignore list (this was also something people were doing to annoy people that had ignored them).</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- /who GUILD (and the GUILD must be in caps) will now show you the members of your guild in your zone. You can also specify a guild name, such as /who &#034;Irontoe Brigade&#034;.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- /safelock command added. /safelock will lock the EverQuest interface (mostly just mouse clicks, keyboard commands/movement, and most slash commands) with the password that you supply to the command. You must use this command a second time, supplying the same password, to unlock the interface. Passwords are NOT case-sensitive. So to lock your interface, you would type /safelock password. You would do the same to unlock it. REMEMBER: If you forget what password you typed, you will need to reboot your machine.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">** Item Changes **</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- All the shields in the game that have the Ribcage graphic should now also have the ribcage icon when they are in your inventory.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Tinkered Watchman helm should show up now.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Ring of Pureblood is now equipable only on your fingers instead of&nbsp; your waist.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Grand Master's Leg Wraps and Fists of the Grand Master are now No-Drop. They were intended to be No-Drop when they were created. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Peacekeeper Staff and the Bug Collection box are no longer equipable. There are problems that can arise when containers can be equipped, so we had to disable that for these items.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Sewing Kits: No existing sewing kits are being changed with this patch. But from now on, kits sold on vendors will be somewhat different. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Large Sewing Kits will have 8 slots. Deluxe Sewing Kits will have 10 slots and weight slightly more than the Large Sewing Kit.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Changed the color of the Kael SK quest armor from a very pretty blue-green to a more appropriate reddish-gray.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">** Other Stuff **</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Changed the spelling of Troubador to Troubadour for the 55th level bard title. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- King Tormax's spawn rate has been adjusted to be more in line with that of his counterparts in Velious. This is not the sort of thing that we will usually announce, as spawn times and things of that </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">nature are part of the dynamic content of EverQuest. We're announcing this, however, to help avoid some confusion.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- The EverQuest Team</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><A HREF=#TOP><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> TOP</FONT></A></DIV></TD></TR></DIV></TABLE>
</DIV>

<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=584><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=379><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">Raid Restults from Kedge Keep</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="1">Masakari Yakikorosu [5/29/01]</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="1"><BR></FONT></FONT></B></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Grats all, particularly Traegen, on a mostly successful mini-raid of kedge keep. The raid group, consisting of me (Masakari), Nekekami, Traegen, Farook, Jarmal and Sildaan (later Screed) went fairly deep into kedge to camp the golden-haired mermaid. Sildaan was the unlucky one, and died 3 times to various causes, as well as Traegen, who drowned while not paying attention (/bonk), but all got rezzes so was good at the end. The Mermaid popped after about 3 hours of camping and was readily dispatched, clearing the way for Trae to get his Raincaller (30/45 6 STR 6 DEX Effect: Firestryle (300pt dd).</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Afterwards, Neke, Jarmal, Sildaan, Traegen and I made the journey to the City of Mist, where we had a far easier time. Camping the bridge with one or two other people to make a full group, we got some VERY nice exp (I for one got over a bubble of XP even though I'm in hell at 45). Loot was not too shabby either, Neke and I both won a Runewood Great Staff (22/40 2 DEX 5 SVM), and Sildaan won a Wraith Bone Hammer for his shammy (8/26 5 STR 2 INT 2 WIS).</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Grats to all again, and good luck in the future.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">- Masakari Yakikorosu</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Bard of 45 Songs</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Fallen Gods </FONT></FONT></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="1"><BR></FONT></FONT></B></DIV><DIV align=left><A HREF=#TOP><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">TOP</FONT></A></DIV></TD></TR></DIV></TABLE>
</DIV>

<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=584><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=206><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">Raid in Kedge Keep</FONT></FONT></B></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="1">Sildaan [5/27/01]</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Raid in Kedge this monday.We are trying to help get some items for Traegen and another person to finish a quest. Time: 11am pst, 1pm cst, 2pm est.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Zone info is </FONT></FONT><A HREF=http://www.eqatlas.com/kedgekeep.html TARGET="_blank"><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">here</FONT></A></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Let me know in game if you plan to attend</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><A HREF=#TOP><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">TOP</FONT></A></DIV></TD></TR></DIV></TABLE>
