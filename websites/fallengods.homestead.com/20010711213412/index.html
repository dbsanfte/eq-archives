<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=584><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=385><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">The Weekend in review</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="1">Kelmore [6/17/01]</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="1"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">Wasup all, Kelmore here.&nbsp; Well, i guess it was a good weekend.&nbsp; 1st of all, Hello to all the new members of the guild, and I hope you stay with us for the remainder of your time on Morrell-Thule. Please head to the </FONT></FONT><A HREF=http://pub58.ezboard.com/ffallengods8572frm1.showMessage?topicID=35.topic TARGET="_blank"><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">forum</FONT></A><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"> page and update us with your info for the members page.&nbsp; BTW, Nuggrok is making a new members page much nicer then mine was shaping up to be, so i think will let him do that.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">Other then that, The raid in ToFS.&nbsp; It was a flop IMHO. NO one showed up. Thank you all for those that did.&nbsp; Sildaan will be hosting another one this Monday at 11 am EST.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">I was rather hopeing for atleast 2 groups. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">Next order of things to say,&nbsp; Raid on Castle Mistmore.&nbsp; Sign up and info </FONT></FONT><A HREF=raids.html TARGET="_parent"><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">here</FONT></A><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">Last thing i have for this post, is ... That this will be the last post to this webpage. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">The new page is comming along nicely.&nbsp; And i think that it should be up in about 10 days. lets hope. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">CYA in game!</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">Kelmore</FONT></FONT></DIV></TD></TR></DIV></TABLE>
