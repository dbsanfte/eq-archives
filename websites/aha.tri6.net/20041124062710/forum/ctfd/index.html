<H1>CTF同好会</H1>
<P>
　ＣＴＦ同好会は、社会人草野球のソレのように、対戦を楽しむために皆で寄り集まって、遊ぼうって集まりです。<br>
　ＣＴＦをプレイする上でのマナーさえ守れれば、別に参加資格に腕は関係ないです。<br>
　当面は、国外のＣＴＦチームとのＣＴＦ戦なんかのための寄り合いだと考えてもらえればおっけーかな。<br>
　対外戦を通して、さらにディープなＣＴＦ戦略論とか、ここでディスカッションされてくとよいですな。<br>
