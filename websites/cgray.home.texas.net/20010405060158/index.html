  <TITLE>Chuck and May's Links</TITLE>
  <script>
      function jump_menu(form)
      {
          var index=form.selectedIndex;
          if (index > 0)
          {
              var new_url=form.options[index].value;
              window.status="Opening " + new_url;
              window.open(new_url);
              window.status="";
              form.selectedIndex=0;
          }
      }
      
      function new_menu(name, links)
      {
          document.writeln('<TD><FORM><SELECT onChange="jump_menu(this)">');
          document.writeln('<OPTION>', name);
          var i;
          var j;
          for (i=0, j=0; i<links.length/2; i++, j+=2)
              document.writeln('<OPTION VALUE="',links[j],'">',links[j+1]);
          document.writeln('</SELECT></FORM></TD>');
      }
      
  </script>
</HEAD>
