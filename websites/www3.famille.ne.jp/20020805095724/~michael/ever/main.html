<script language="JavaScript">
<!---
//
function GetDstStart(arg_year) {
        var dst_start = new Date(arg_year, 3, 1, 2, 0, 0); // 第2引数の3は、4月を表す。
        for (var i = 1; i <= 7; i++) {
                dst_start.setDate(i);
                if (0 == dst_start.getDay()) {
                        break;
                }
        }
        return dst_start.getTime();
}

//
function GetDstEnd(arg_year) {
        var dst_end = new Date(arg_year, 9, 31, 1, 0, 0);
        for (var i = 31; i > 24; i--) {
                dst_end.setDate(i);
                if (0 == dst_end.getDay()) {
                        break;
                }
        }
        return dst_end.getTime();
}


today = new Date();
year = today.getYear();
if (year < 100) {
        year += 1900;
}

var tz_offset = today.getTimezoneOffset();



pos_start = GetDstStart(year);
pos_end = GetDstEnd(year);

tz_jp = 9 * 60; // GMT+9
tz_pst = -8 * 60; // GMT-8
tz_est = -5 * 60; // GMT-5


function nowat(now_t, tz, st) {
        var mon, dat, week, hour, min, sec;
        var day = new Array("日","月","火","水","木","金","土");
        var pos_t = now_t + (tz_offset + tz) * 60 * 1000;

        if (0 != st) {
                // サマータイム処理
                if ((pos_start <= pos_t) && (pos_end > pos_t)) {
                        pos_t += 60 * 60 * 1000;
                }
        }                       
        var t = new Date();
        t.setTime(pos_t);
        mon = t.getMonth() + 1;
        dat = t.getDate();
        week =day[t.getDay()];
        hour = t.getHours();
        min = t.getMinutes();
        sec = t.getSeconds();
        if (mon < 10) {
                mon = " " + mon;
        }
        if (dat < 10) {
                dat = "0" + dat;
        }
        if (hour < 10) {
                hour = "0" + hour;
        }
        if (min < 10) {
                min = "0" + min;
        }
        if (sec < 10) {
                sec = "0" + sec;
        }
        return mon + "/" + dat + "[" + week + "]  " + hour + ":" + min + ":" + sec ; 
}

function update_watch() {
        now = new Date();
        n_t = now.getTime();
        jp = nowat(n_t, tz_jp, 0);
        pst = nowat(n_t, tz_pst, 1);
        est = nowat(n_t, tz_est, 2);

        document.forms[0].elements[0].value = jp;
        document.forms[0].elements[1].value = pst;
        document.forms[0].elements[2].value = est;

        setTimeout('update_watch()', 999); // 1000msec = 1sec
}

update_watch();
//---->
</script>
