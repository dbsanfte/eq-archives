<DIV style="margin-top: 58px; margin-left: 15px">
<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=782><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=50><DIV align=center><FONT COLOR=#ffffff><FONT class="Helvetica32" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="6">Guild Rules</FONT></FONT></DIV></TD></TR></DIV></TABLE>
</DIV>
<DIV style="margin-top: -2211px; margin-left: 0px"><IMG SRC=/tp.gif WIDTH=0 HEIGHT=0 BORDER=0></DIV>

<DIV style="margin-top: 163px; margin-left: 3px">
<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=789><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=33><DIV align=center><B><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">Guardians of the Sacred Altar</FONT></B></DIV></TD></TR></DIV></TABLE>
</DIV>
<DIV style="margin-top: -2211px; margin-left: 0px"><IMG SRC=/tp.gif WIDTH=0 HEIGHT=0 BORDER=0></DIV>

<DIV style="margin-top: 214px; margin-left: 3px">
<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=789><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=59><DIV align=center><I><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The name of the guild comes from a book i read that describes the moon as the altar </FONT></I></DIV><DIV align=center><I><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">of the gods. I thought it would be cool if the guild were known as the defenders of that moon.</FONT></I></DIV><DIV align=center><I><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">~Valorin Diamante~</FONT></I></DIV></TD></TR></DIV></TABLE>
</DIV>
<DIV style="margin-top: -2211px; margin-left: 0px"><IMG SRC=/tp.gif WIDTH=0 HEIGHT=0 BORDER=0></DIV>

<DIV style="margin-top: 313px; margin-left: 160px">
<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=484><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=899><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Guild rules:</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">1) There is a guild leader and selected officers who will be doing the &nbsp; &nbsp; &nbsp;&nbsp; recruiting. Too many officers can mean trouble for inviting new members who may not uphold the name or could become a problem in the guild. This does not mean there will not be recuitment of new officers, they will just be chosen selectively. (please don't ask)</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">2) You are required to uphold the name of the GOTSA.</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">This means no kill stealing, over priced auctions, defacing other players, defacing other guilds, or being a nuisance in general. Any problems which may occer from this will be discussed among officers and the guild leader. Being expelled from the guild is not the route we wish to take, but if it is the only decision that can be made as punishment, then so be it.</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">3) To be recruited into the guild, the canidate must first group with a guild member(s) at least 3 times and have 2 upstanding guild members recomendation to join. Recruits must be level 15 or above unless they are secondary characters. Secondary character will be allowed, as long as it is not for the purpose of being power leveled.</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">4) The guild chat is not to be used as a chat room, as it can easily become. We want to use guild chat for information purposes such as price checks, finding a group, asking for help, ect... Greetings, and congratulations are acceptable, but please use the /tell command to run your conversations, as it makes the game more enjoyable with that much less popping up on your screen.</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">5) Requesting a guild mate to power level you is unacceptable. If you need weapons or armor we will help in any way we can, but we have also worked for the things we have so please do not BEG. However... if a guild mate OFFERS to power level you, take the opportunity and have fun :-)</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">6) The guild will have functions. Someone will be in charge of guild events, they are not required because some people will be busy or unable to get their character to the location. Guild events will be scheduled a month in advance and RSVP will be requested so the event master can determine how groups will be broken up.</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">7) The guild has a website. Everyone will have access to it, so messages can be posted, items can be sold, and pictures can be seen of fellow guild members. It will be a general source of information on the goings on of the GOTSA. Anyone who has suggestions, or is willing to help upkeep he website is welcome. </FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">8) Once everyone is high enough, epic quest will be done by the guild so everyone can attain his or her epic quest. It will be determined which quest gets done first by the item or weapon that will most benefit in the guild. EG. clerics because of free ressurection.</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">9) There will be someone in charge of regular quest items, so the guild and those who want to participate can do those which can be attained.</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">10) There will be ABSOLUTELY NO foul language, or talk of illegal substances (drugs), or activites. The consequence of this action&nbsp; will be immediate termination from the guild.</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></B></DIV></TD></TR></DIV></TABLE>
</DIV>
