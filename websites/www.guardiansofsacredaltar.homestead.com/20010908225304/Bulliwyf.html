Oh by the way I'm at FULL manna so haha!!!!!!</FONT></FONT></B></I></DIV><DIV align=left><I><B><FONT COLOR=#ffffff><FONT class="Comic-Sans18" FACE="Comic Sans MS" SIZE="4">~Valorin~</FONT></FONT></B></I></DIV></TD></TR></DIV></TABLE>
