<TD><DIV align=left><I><B><FONT COLOR=#ffff00><FONT class="Comic-Sans16" FACE="Comic Sans MS" SIZE="3">True to his name and true to the Guardain's.&nbsp; Balta Ironheart.&nbsp; I have had the pleasure of grouping with Balta on a few occasions, and if there ever was a cleric you would want in your group, it would Balta.&nbsp; There are not that many good clerics in this land, and&nbsp; of the few that I know, Balta is definetly one of the best.&nbsp; Balta will sacrifice himself to make sure that his party is healed, and then placing himself into the melee of the action. Most cleric's I know, seem to have the lack of understanding exactly what their role in the party should be.&nbsp; Balta always knows what his role should be, and when he needs to step out of that role.&nbsp; Always putting himself in danger knowing that when he cast a heal, there is a chance that he will be attacked.&nbsp; Every good cleric knows that is going to happen, and only a few that I know of has no problem dealing with that situation, and Balta is one of them.&nbsp; Balta is a valued guild member and an outstanding officer.&nbsp; He is in charge of the guild raids, and after our first guild raid, I know we have the right person for the job.&nbsp; Balta's idea's to the development of the Guardian's have been outstanding.&nbsp; Along with my other officers, Balta helps keep the Guardians a well developed family, and a well developed guild.&nbsp; Balta has brought in many valuable members and his leadership skills are very strong.&nbsp; Thank you Balta in helping develop the Guardians, and keeping us a close family....Oh by the way, don't run off in Eastern Wastes again, because that was one heck of a fall.&nbsp; Nakkou was jealous she missed that cliff......</FONT></FONT></B></I></DIV></TD>
