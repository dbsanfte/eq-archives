<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=431><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=590><DIV align=left><I><B><FONT COLOR=#ff0033><FONT class="Comic-Sans16" FACE="Comic Sans MS" SIZE="3">During my time in Norrath, of all the friends I have met, none have matched that of this mighty wizard.&nbsp; I met Faldawen back in my 14th season when I was creating a group to hunt the Dervs in West Common.&nbsp; That group consisted of my dear friends Therris and Kilimynjaro.&nbsp; We acquired Helienthe the ranger, Faldawen the Wizard, and my dearest Zodi, who is now long gone from the game.&nbsp; Faldawen and I grouped a few times after that, but as usual he took in levels.&nbsp; I spent grouping and meeting other friends like Hinadur , Fahthere, Kymera and Bulliwyf.&nbsp; Around my 22nd season, Faldawen and I hooked back up and started hunting with Kora.&nbsp; We did a few quest that helped Kora and Faldawen accomplish the staff you see above.&nbsp; Since then, my life is spent huning with my buddy Fal.&nbsp; Fal and I know each other like the back of our hands.&nbsp; Fal knows what to do in situations without me even saying a thing.&nbsp; He has been there to watch my back on many occassions, and not only has been helpful, he has been a part of my success in this land.&nbsp; I know Faldawen is always there when I need him, and he has no problem going out of his way to help me or his guild members.&nbsp; Many of our friends has described us the Dynamic Duo, because of our victorius exploits.&nbsp; Although I have many friends that I know will watch my back in any situation, Faldawen ranks up there as being pretty darn good.&nbsp; Faldawen I thank you for everything you have done for me in this land,&nbsp; you are a great friend, and I know our journies together will continue to reek havok on this land.&nbsp; Oh by the way Valorin throws a snowball at Faldawen.</FONT></FONT></B></I></DIV><DIV align=left><I><B><FONT COLOR=#ff0033><FONT class="Comic-Sans16" FACE="Comic Sans MS" SIZE="3"><BR></FONT></FONT></B></I></DIV><DIV align=left><I><B><FONT COLOR=#ff0033><FONT class="Comic-Sans16" FACE="Comic Sans MS" SIZE="3">~Valorin Diamante~</FONT></FONT></B></I></DIV></TD></TR></DIV></TABLE>
