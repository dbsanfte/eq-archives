<!--
-- Each of the three member lists (Leader, Peer, Accepted, Initiate)
-- has the following format:
--
-- box("Rank Name"); rank = "Rank ID";
-- member_table();
--
-- member("name", "realname", "picture file", "race rank level", "location", "skills");
--   alt_member("name", "realname", "picture file", "race rank level", "location", "skills");
--   alt_member("name", "realname", "picture file", "race rank level", "location", "skills");
--
-- member("name", "realname", "picture file", "race rank level", "location", "skills");
--
-- ...and so on...
--
-- end_member_table();
--
-- The real-life names are no longer displayed, so you could leave them blank.
-- If there is no picture file, just use the "null" (without the quotes).
--
-- You can replace member() with retired() for players you assume left EQ
-- because you haven't heard from them in months. That way you can quickly
-- recover the data if they show back up (it's happened, trust me, hehe).
--
-- The race name and class name must currently be spelled exactly as follows
-- in order for statistics to collect correctly. These names are defined in
-- the common.js file:
-- var classes = new Array("Bard", "Cleric", "Druid", "Enchanter",
--                         "Magician", "Monk", "Necromancer", "Paladin",
--                         "Ranger", "Rogue", "Shadowknight", "Shaman",
--                         "Warrior", "Wizard");
-- var races = new Array("Barbarian", "Darkelf", "Dwarf", "Erudite",
--                       "Gnome", "Halfelf", "Halfling", "Highelf",
--                       "Human", "Iksar", "Ogre", "Troll", "Woodelf");
-->
