<head>
<title>Shadows of the Apocalypse</title>
<script>
fadecolor = "white"
function lineC() {
   document.lines.third.value = "this is a test"
   
}

function lineB() {
   document.lines.second.value = "this is a test"
   setTimeout(lineC,1000)
     document.text="black"
   
}

function lineA() {
   document.lines.first.value = "this is a test"
   setTimeout(lineB,1000)
 
}

function lightning() {
  document.bgColor="white"
  fadecolor = 0xFFFFFF
  document.bgColor=fadecolor
  setTimeout(fade, 50)
  setTimeout(lightning, 10000)
}

function fade() {
  fadecolor = fadecolor - 0x101010
  if ( fadecolor < 0) {
    fadecolor = 0
  }
  document.bgColor= fadecolor
  if( fadecolor > 0) {
     setTimeout(fade, 50)
  }
}


</script>
</head>
