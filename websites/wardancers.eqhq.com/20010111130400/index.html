<meta name="description" content="High elves and wood elves have always been portrayed as weak loving freaks of nature. Elves are at ease wherever there is wood to dance and animals to hunt. Nature, their natural habitat, is very diversified. A thundering storm and a beautiful flower is what nature is all about. So why should elves be portrayed in only one aspect of nature? Could violent and passionate elves exist? The answer to this question is yes.	Nature can be twofold. It can be serene, calm and wonderful. You can hunt deer in the forest and be surrounded by beautiful trees and flowers. But nature can also be unpredictable and violent as the hell of Cazic-Thule. So why bother with only one aspect of it when we can mix the two? If we can mingle the two of them in one great guild, we will be the best! We will have things that will interest both kinds of players. We will be heavily oriented on role-playing but at the same time, we will be very warlike. As the guildmaster of the guild, I will put all my 16 years of experience to create a background to everything we do in the guild. For example, if we decide we are bored to death hunting orcs, why don't we go for dark elf hunting? But with the help of my officers, we will try to mingle a story, a background to justify this war party against our enemies. I have already contacted an antagonist guild of dark elves that will surely play on a racewar server, so all will be so cool if everybody puts a little of himself in it!  We also need people that want to participate in the elaboration of the guild. So that's why there are many places in the guild to be filled. Remember that I am not proposing a guild of powergamers that only want to kill everything on sight. We will surely be at war with others guilds, kill people and loot them, but first we are a roleplaying guild. This guild will be very aggressive, but at same time open for others things than war."
</head>
