<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=494><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=213><DIV align=left><I><B><FONT COLOR=#ff0033><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">Call for Lower Council Members...</FONT></FONT></B></I></DIV><DIV align=left><B><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The Lower Council requires 5 members. Two of the members will be made officers of the Second Age guild with all the additional responsibilities expected of an officer. The 5 members will be expected to provide some of their time to help keep the guild running efficiently and to ensure that the needs and the requests of the lower level members of the guild are being represented. To become a member of the Lower Council, you have to be level 38 or below, there is no minimum level requirement. Please read the information on what the two councils will be attempting to perform, and make sure that you are willing to provide the time and effort to help achieve the goals that will be set. If you are interested in one of these positions, please send email to either </FONT><A HREF=mailto:Fayadanest@netscape.com TARGET="_parent"><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Fayadane</FONT></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> or </FONT><A HREF=mailto:esama@msn.com TARGET="_parent"><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Moonhawk</FONT></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">.</FONT></DIV></TD></TR></DIV></TABLE>

<DIV style="margin-top: 226px; margin-left: 224px">
<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=344><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=90><DIV align=left><I><B><FONT COLOR=#999999><FONT class="TimesRoman48" FACE="Times New Roman, adobe-times, Times" SIZE="7">Guild Councils</FONT></FONT></B></I></DIV><DIV align=left><I><B><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">Upper and Lower Councils</FONT></B></I></DIV></TD></TR></DIV></TABLE>
</DIV>
<DIV style="margin-top: -3837px; margin-left: 0px"><IMG SRC=/tp.gif WIDTH=0 HEIGHT=0 BORDER=0></DIV>

<DIV style="margin-top: 345px; margin-left: 224px">
<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=474><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=1597><DIV align=left><I><FONT COLOR=#999999><FONT class="TimesRoman24" FACE="Times New Roman, adobe-times, Times" SIZE="5">Second Age has grown quite large in a relatively short span of time. We now have 86 unique members, so getting more people involved in helping manage and organize has become essential. We are forming two separate Councils, an Upper and Lower Council, each tasked with the management of guild activities and organization...</FONT></FONT></I></DIV><DIV align=left><B><FONT COLOR=#999999><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#999999><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#999999><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">UPPER COUNCIL</FONT></FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">This Council will be charged with the overall running and management of the Second Age Guild. Each member will have duties that will help run one part of the guild's activities. Management covers taking care of guild problems, organizing hunts, events, managing the guild treasury, and many other duties. The Upper Council will also be tasked with the introduction of new rules for looting and other areas of guild organization. This will be done in conjunction with all members of the guild when it comes to major decisions.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The Upper Council is made up of 11 members. Each member will have a specific area of responsibilty, but will be expected to provide assistance in other areas also. Each member will work directly with the Leader and 2nd in Command, of the guild in all areas of responsibility. Using this method, hunt organization especially, will run much smoother. Also, catering to the needs of members will be best served when they know who they can approach for particular assistance.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Meetings of the Upper Council and also meetings of the whole guild, will be called by the Leader and 2nd in Command. For decisions to count at a meeting, it must be attended by at least 5 Upper Council members, including either the Leader or the 2nd in Command. Issues to be brought up in the meetings should be addressed and refined previously (if possible) using the Forums or any other means of communications, to reduce the actual time needed at these meetings. Meetings will be chaired by the Leader of the guild, or in some cases designated members, when covering issues that address their area of responsibility. Upper Council meetings will also be attended by two Lower Council members, so that their concerns from the Lower Council can be heard. The Lower Council Liaison to the Upper Council, will designate which two members will attend, this may be different for each meeting and at the discretion of the Liaison.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Because of the size of the guild, and the types of activities we are and will be undertaking, it has become necessary for the guild to have it's own store of funds and items. Therefore, the guild will have its own Treasury and a Head Treasurer to organize and control it. There will also be an Armsmaster and Castermaster, each in charge of allocating and collecting guild equipement. To gain funds for hunts, especially expensive hunts like Sky, Hate, Chardok, etc, and events, Raffles, we will institute a voluntary Tax system. It will be based on level and will end up costing members that are level 40+ about 200pp a month, and members 20+ about 100pp a month. Like we have indicated, it will be voluntary, as no one should be forced to pay this. But any help with greater donations of funds and/or equipement, will be greatly appreciated.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><B><FONT COLOR=#999999><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">LOWER COUNCIL</FONT></FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The Lower Council will be charged with the overall running and management of the lower level members of the Second Age Guild. There have been many concerns that lower level characters are not deemed as important to theguild as those of higher level, and that events are mostly geared towards higher level players. We want to solve this problem with the creation of this Lower Council. Each member will have duties that will help run one part of the guild's activities, especially with respect to lower level characters. Not only will this Lower COuncil be tasked with the job of organizing events and hunts, but will be tasked with working directly with the Upper Council to organize joint events and to bring any issues from the Lower Council to the notice of the Upper Council. The happiness of all members of the guild is very important, whether they are level 60 or level 1.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The Lower Council is made up of 5 members, each member will be below level 38, and will leave the Lower Council when they level past this point. Each member will have a specific area of responsibilty, but will be expected to provide assistance in other areas also. Each member will work directly with the Leader, 2nd in Command, and the two inter-council Liaisons. </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Meetings of the Lower Council will be called by the Liaison to the Upper Council, who will also be the Chairperson of the Lower Council. Meetings of the Lower Council can be held at any time, but important issues that need to be heard in the Upper Council should be covered by the Lower Council in an earlier meeting. Two members of the Lower Council will be present at Upper Council meetings, these two will be designated by the Chairperson. For decisions to count at a Lower Council meeting, it must be attended by at least 3 Lower Council members, including either officers in that council. Issues to be brought up in the meetings should be addressed and refined previously (if possible) using the Forums or any other means of communications, to reduce the actual time needed at these meetings. Meetings will be chaired by the Chairperson of the Lower Council, or in some cases designated members, when covering issues that address their area of responsibility.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Each member of the Lower Council should work directly with the Upper Council's Liaison to the Lower Council to work on any issues that don't require full meetings, and to ensure that the needs of low level guild members are being met.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><I><B><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">We hope these measures will help create harmony and wellbeing within our great guild. ~ Fayadane &#038; Moonhawk</FONT></B></I></DIV></TD></TR></DIV></TABLE>
</DIV>
