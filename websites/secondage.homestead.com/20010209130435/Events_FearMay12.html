 Thorny Vine Bracer (Ranger)</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"></FONT><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Ookh</FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> - Carmine Leggings (Wizard) &#060;poor wizards...&#062;</FONT></DIV><DIV align=left><B><FONT COLOR=#339966><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Layli</FONT></FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> - Flayed Turmoilskin Belt (Shaman) &#060;consolation prize&#062;</FONT></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Banur</FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> - Valorium Bracer (Paladin) </FONT></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Logaine</FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> - Girdle of the Diligent (Cleric)</FONT></DIV><DIV align=left><FONT COLOR=#339966><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"></FONT></FONT><B><FONT COLOR=#339966><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Aragon</FONT></FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> - Vermiculated Bracer (Druid) &#060;stickboy gets a bone&#062;</FONT></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Buliwyk</FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> - Umbral Chestplate (Shadowknight)</FONT></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Buliwyk</FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> - Umbral Greaves (Shadowknight)</FONT></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Tagmog</FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> - Rune Etched Boots (Shaman)</FONT></DIV><DIV align=left><B><FONT COLOR=#339966><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Elthorn</FONT></FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> - Imbrued Bracer (Bard)</FONT></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Straka</FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> - Umbral Chestplate (Shadowknight)</FONT></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Banur</FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> - Valorium Bracer (Paladin) &#060;that one stung a little&#062;</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><B><FONT COLOR=#339966><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Names in green are members of Second Age.</FONT></FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Overall, we got 43 significant items. There were a few others I didn't count, like the crap cryosilk veil. Also, a cryosilk cloak, a set of Umbral boots, and several eyerazzia daggers poofed.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">SA got 17 out of 43 total drops. Notice, however, that there were load of drops that SA couldn't use. All the Shadownight and Shaman stuff automatically went outside the guild. We got 17 out of 30 drops that we could actually use for those people present. We also got 3 out of 7 Breastplates... we could only use 5 of those though.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Overall, 59 different people attended the hunt. 24 of those were SA members. However, we had the largest guild presense at any given time, usually by a large margin. I think SA could have held the plane with just SA members and specific invitees (not guild invites).</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Special congratulations go to Storlok, who finished the hunt with the most points. He was there for all 24 playing hours with no loot at all, without complaint. Beleive me, I heard all the complaints. =)</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">I'd like to thank Moon for leading, Links for pulling, Aragon for helping with the loot system, and the clerics for hanging in there in spite of a terrible lack of drops.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">That's it from me. I'll post about loot policy revisions later, but I think the basic system is good. If you want any more details about the trip, I probably have them on a notepad here somewhere, feel free to ask.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Was a great hunt, guys, in spite of some bumpy moments. We went, we got it done, and really very few people died. I even leveled up there... twice. Ok so I died once. It's a toll you have to pay to hunt there.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Anyway, it was great, and it was fun. that's what counts.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Cenadil &#034;Ol Yeller&#034; Avatara</FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV></TD></TR></DIV></TABLE>
</DIV>
