<DIV style="margin-top: 698px; margin-left: 185px">
<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=564><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=339><DIV align=left><I><B><FONT class="TimesRoman48" FACE="Times New Roman, adobe-times, Times" SIZE="7">Up to the Sky we go...</FONT></B></I></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">On Saturday the 28th of October, Second Age and some friends will be attempting to conquor the Plane of Sky. It should be a great event for everyone. Not only is it one of the most beautiful zones of the game, it is also one of the most unique. There are very interesting creatures and loot drops in the Plane of SKy, but most of all, it is a great place to have a lot of fun and adventure in a completely different environment. Lets make this one really work. Please, I would like to ask the following from each and every one of you (including myself). If you have stated that you can definately make it, please be in the West Commons at the Wizard Portal at 9 am EST on Saturday morning. Secondly, we will have a lot of guests coming, let us not swear out loud to the zone, argue about loot drops, or complain about groupings. Although there will be loot, this trip will not be about that, it will be about getting together as a guild, growing as a guild, and entrenching our friendships and camraderie. All the invitees will be allowed to loot as well on this trip, if this is a problem for any guildmember, please let me know ahead of time. None of this is an accusation, I just want us to rebuild SA into a close nit community of friends. Here are some important links that you should check out before the trip:</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><A HREF=http://everquest.allakhazam.com/zones/Planes/Air.htm TARGET="_blank"><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Zone Info Allakhazam</FONT></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, </FONT><A HREF=http://www.eqmaps.com/infosheet.php3?tag=airplane TARGET="_parent"><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Loot and Mobs - EQMaps</FONT></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, </FONT><A HREF=http://everquest.allakhazam.com/zones/Planes/Sky_Guide_Cassie_1.html TARGET="_parent"><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Zone Guide - Allakhazam</FONT></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, </FONT><A HREF=http://www.eqmaps.com/zone.php3?tag=airplane TARGET="_parent"><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Zone Info - EQMaps</FONT></A></DIV><DIV align=left><A HREF=http://www.everlore.com/bestiary/default.asp?mode=14&land=15584 TARGET="_parent"><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Bestiary - Everlore</FONT></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, </FONT><A HREF=http://everquest.allakhazam.com/zones/Planes/PofA_Quest_Items.html TARGET="_parent"><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Quest Items (Very Important, Pint this out)</FONT></A></DIV></TD></TR></DIV></TABLE>
</DIV>
<DIV style="margin-top: -4261px; margin-left: 0px"><IMG SRC=/tp.gif WIDTH=0 HEIGHT=0 BORDER=0></DIV>

<DIV style="margin-top: 1087px; margin-left: 183px">
<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=574><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=176><DIV align=left><I><B><FONT class="TimesRoman32" FACE="Times New Roman, adobe-times, Times" SIZE="6">The Upper and Lower Councils are born...</FONT></B></I></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">As promised, here are the details of the new Second Age Upper and Lower Guild Councils. This has been implemented to smooth out the operation and management of the guild, as well as get more people involved in that activity. The Lower Council has been specifically been created to address the concerns of the lower level players. No one in the Lower Council will be higher than level 38. Fayadane and Moonhawk have spent a lot of time thinking this through, and feel that with these two councils working close together, we will be able to cater to all members of Second Age. </FONT><A HREF=GuildCouncil.html TARGET="_parent"><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR>Here are the Details.</FONT></A></DIV></TD></TR></DIV></TABLE>
</DIV>
<DIV style="margin-top: -4261px; margin-left: 0px"><IMG SRC=/tp.gif WIDTH=0 HEIGHT=0 BORDER=0></DIV>

<DIV style="margin-top: 2281px; margin-left: 386px">
<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=354><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=239><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">QUEST EVENT: Quest for the Chronicles of Veeshan</FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">I feel that the lower level characters in the guild are sometimes neglected when we arrange events and hunting trips. I would like to further remedy this situation by organizing a large, player-run, quest event. I have been working on a script for the quest, and will need several volunteers who are willing to act out the parts. I would like the main beneficiaries of the quest to be lower level characters. There will be multiple tasks and side trips that will have to be completed to solve the quest, everyone will need to work together. It would be great if everyone that participates could stay in character throughout the event, if possible. I'm trying to put a little roleplaying and questing back into the game. A thread covering this can be </FONT><A HREF=http://pub7.ezboard.com/fsecondagemembersonly.showMessage?topicID=124.topic TARGET="_parent"><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">found here in the Forum</FONT></B></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">~ Moonhawk...</FONT></DIV></TD></TR></DIV></TABLE>
</DIV>
<DIV style="margin-top: -4261px; margin-left: 0px"><IMG SRC=/tp.gif WIDTH=0 HEIGHT=0 BORDER=0></DIV>

<DIV style="margin-top: 2218px; margin-left: 182px">
<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=112><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=254><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Guild Duels</FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> will be taking place on Thursday the 18th of May, at 6 pm est, at the Arena in Lake Ratheter. Bellowes has put up some more information about the event and it can be found at </FONT><A HREF=http://pub7.ezboard.com/fsecondageeventinformation.showMessage?topicID=28.topic TARGET="_parent"><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR>this location on the Forum</FONT></B></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, please try to reply there if you are interested in participating.</FONT></DIV></TD></TR></DIV></TABLE>
</DIV>

<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=216><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=80><DIV align=left><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Loot Rules</FONT><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, can now be found on the </FONT><A HREF=Events.html TARGET="_parent"><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Events page</FONT></B></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">. There will be modifications made to the system in lieu of what we learnt at the last hunt.</FONT></DIV></TD></TR></DIV></TABLE>

<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=306><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=224><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Second Age went to Fear in fear, but came back very proud of itself. We did incredibly well. Of all the Fear trips I have ever been on, this one had the least number of deaths I've ever seen. We had no major CRs, and fought our way from mob to mob, including clearing the Temple. In all, we cleared the zone 3 times over a period of 2 days. A very good achievement for a guild hosting it's very first Planar Event. The loot that was dropped was quite impressive as well, in all I think about 6 Breastplates dropped, as well as other items of course. The </FONT><A HREF=Events.html TARGET="_parent"><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR>Events Page</FONT></B></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> has been updated with more complete information on this hunt. ~ Moonhawk...</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV></TD></TR></DIV></TABLE>

<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=354><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=239><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">QUEST EVENT: Quest for the Chronicles of Veeshan</FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">I feel that the lower level characters in the guild are sometimes neglected when we arrange events and hunting trips. I would like to further remedy this situation by organizing a large, player-run, quest event. I have been working on a script for the quest, and will need several volunteers who are willing to act out the parts. I would like the main beneficiaries of the quest to be lower level characters. There will be multiple tasks and side trips that will have to be completed to solve the quest, everyone will need to work together. It would be great if everyone that participates could stay in character throughout the event, if possible. I'm trying to put a little roleplaying and questing back into the game. A thread covering this can be </FONT><A HREF=http://pub7.ezboard.com/fsecondagemembersonly.showMessage?topicID=124.topic TARGET="_parent"><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">found here in the Forum</FONT></B></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">~ Moonhawk...</FONT></DIV></TD></TR></DIV></TABLE>

<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=550><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=179><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">On Friday, the 26th of May, Nagafen was slain by the Second Age / Veeshan's Forgotten Alliance. The alliance was accompanied by several friends and invited members of the 5-Guild Alliance that had their Dragon taken from them. This was the first assault on a dragone ever undertaken by SA and VF. But lack of experience did not deter us, Nagafen fell after the first try. Everyone fought bravely and followed the plan of battle to the successful completion of the hunt. Close to the corpse of the slain Dragon, a bounty of treasure was found. The treasure consisted of a Druid-only Hierophant's Crook, Gauntlets of Fiery Might, three Words of Healing (contain 5 charges of AE Group Heal), a Paladin book for the Fiery Avenger quest, and a Rune. The loot was randomed off to all the participants of the hunt, whether they wore the alliance guild tags or whehter they were just there as guests of the alliance. Images of the hunt will soon be added. ~ Moonhawk...</FONT></DIV></TD></TR></DIV></TABLE>

<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=574><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=176><DIV align=left><I><B><FONT class="TimesRoman32" FACE="Times New Roman, adobe-times, Times" SIZE="6">The Upper and Lower Councils are born...</FONT></B></I></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">As promised, here are the details of the new Second Age Upper and Lower Guild Councils. This has been implemented to smooth out the operation and management of the guild, as well as get more people involved in that activity. The Lower Council has been specifically been created to address the concerns of the lower level players. No one in the Lower Council will be higher than level 38. Fayadane and Moonhawk have spent a lot of time thinking this through, and feel that with these two councils working close together, we will be able to cater to all members of Second Age. </FONT><A HREF=GuildCouncil.html TARGET="_parent"><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR>Here are the Details.</FONT></A></DIV></TD></TR></DIV></TABLE>

<DIV style="margin-top: 699px; margin-left: 185px">
<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=564><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=339><DIV align=left><I><B><FONT class="TimesRoman48" FACE="Times New Roman, adobe-times, Times" SIZE="7">Up to the Sky we go...</FONT></B></I></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">On Saturday the 28th of October, Second Age and some friends will be attempting to conquor the Plane of Sky. It should be a great event for everyone. Not only is it one of the most beautiful zones of the game, it is also one of the most unique. There are very interesting creatures and loot drops in the Plane of SKy, but most of all, it is a great place to have a lot of fun and adventure in a completely different environment. Lets make this one really work. Please, I would like to ask the following from each and every one of you (including myself). If you have stated that you can definately make it, please be in the West Commons at the Wizard Portal at 9 am EST on Saturday morning. Secondly, we will have a lot of guests coming, let us not swear out loud to the zone, argue about loot drops, or complain about groupings. Although there will be loot, this trip will not be about that, it will be about getting together as a guild, growing as a guild, and entrenching our friendships and camraderie. All the invitees will be allowed to loot as well on this trip, if this is a problem for any guildmember, please let me know ahead of time. None of this is an accusation, I just want us to rebuild SA into a close nit community of friends. Here are some important links that you should check out before the trip:</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><A HREF=http://everquest.allakhazam.com/zones/Planes/Air.htm TARGET="_blank"><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Zone Info Allakhazam</FONT></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, </FONT><A HREF=http://www.eqmaps.com/infosheet.php3?tag=airplane TARGET="_parent"><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Loot and Mobs - EQMaps</FONT></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, </FONT><A HREF=http://everquest.allakhazam.com/zones/Planes/Sky_Guide_Cassie_1.html TARGET="_parent"><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Zone Guide - Allakhazam</FONT></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, </FONT><A HREF=http://www.eqmaps.com/zone.php3?tag=airplane TARGET="_parent"><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Zone Info - EQMaps</FONT></A></DIV><DIV align=left><A HREF=http://www.everlore.com/bestiary/default.asp?mode=14&land=15584 TARGET="_parent"><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Bestiary - Everlore</FONT></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, </FONT><A HREF=http://everquest.allakhazam.com/zones/Planes/PofA_Quest_Items.html TARGET="_parent"><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Quest Items (Very Important, Pint this out)</FONT></A></DIV></TD></TR></DIV></TABLE>
</DIV>
