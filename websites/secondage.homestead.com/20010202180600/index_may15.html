<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=550><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=273><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Wednesday, May 10, 2000</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></B></DIV><DIV align=left><I><B><FONT class="Helvetica32" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="6">Second Age heads for Fear</FONT></B></I><I><B><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">, </FONT></B></I></DIV><DIV align=left><I><B><FONT COLOR=#330099><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5"><FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT> </FONT></FONT></B></I><I><B><FONT COLOR=#ff6600><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">New </FONT></FONT></B></I><A HREF=loot_rules.html TARGET="_parent"><I><B><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">Looting Rules</FONT></B></I></A><I><B><FONT COLOR=#ff6600><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5"> Posted...</FONT></FONT></B></I></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Well, the time has finally come, Second Age will be hosting their first Planar Hunting Trip. To be perfectly honest, this scares me silly &#060;G&#062;. There are so many things that can go wrong, so many ways that we could end up with multiple deaths and even outright failure. But I have great confidence in our guild, and I think we can not only do this, but do it well. Each one of us can do a few things that will ensure this success. We have to be patient with each other, we have to realize that we will most likely all get negative experience, we have to realize we may not get that item of Planes Armor we have always wanted. Please help me make this a successful trip for everyone. Read the new </FONT><A HREF=loot_rules.html TARGET="_parent"><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Looting Rules</FONT></B></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, so that there are no surprises when we get there. Tell anyone who has been invited to Fear, to the same page so that they are familiar with them. Thanks, and good luck to all of us, we start on </FONT><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Friday 9am EST</FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">.~ Moonhawk...</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV></TD></TR></DIV></TABLE>
</DIV>

<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=550><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=237><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Sunday, April 30, 2000</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"></FONT><I><B><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">Boddyto &#038; Moonhawk Discover New Items...</FONT></B></I></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">After a very scary night of being stuck in the Dungeon of Kaesora, Boddyto and Moonhawk (the only brave souls, or maybe dumb souls &#060;G&#062;, in that zone) discovered two brand new items never before seen in the land of Norrath. We ventured deep into Kaesora, Paladin and Ranger, but within a short while we found ourselves at the bottom of a pit with no way out. With no way to climb back up, we decided we should go deeper and find a way out. We fought against dangerous new creatures, including Spiders that cast Root, Smite, Force Struck, and Heal! After several hours, we finally managed to escape, but not before Boddyto valiantly sacrificed his own life to protect mine with Lay of Hands. The items we found were a new weight reducing bag, a </FONT><A HREF=files/Dusty_Pack.jpg TARGET="_parent"><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Dusty Ransacker's Pack</FONT></B></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, 8-slots, Medium Items, 33% reduction. Also </FONT><A HREF=files/Truesilver_Boots.jpg TARGET="_parent"><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Truesilver Mail Boots</FONT></B></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, AC 11, very nice. ~ Moonhawk...</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV></TD></TR></DIV></TABLE>
</DIV>

<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=550><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=661><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Saturday, April 29, 2000</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><I><B><FONT class="Helvetica32" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="6">Second Age in ...</FONT></B></I></DIV><DIV align=left><I><B><FONT COLOR=#ff0033><FONT class="Helvetica48" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="7">...</FONT></FONT></B></I><I><B><FONT class="Helvetica48" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="7"> </FONT></B></I><I><B><FONT COLOR=#ff0033><FONT class="Helvetica48" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="7">KUNARK!!</FONT></FONT></B></I></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Second Agers have now spent quite a few days exploring the new continent</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">of Kunark. The new zones are both impressive and enjoyable to adventure</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">and explore in. Most of us have not seen more than the Dreadlands,</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Burning Woods, Frontier Mountains, and Firiona Vie itself. Over the coming</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">weeks we will be organizing several excusions into the depths of Kunark.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">I think we should try to explore the City of Mist, a CT type dungeon with</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">what appear to be incredible items. The city is in the Emerald Jungle zone, another area</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">we have not yet seen. Karnor's Castle in the Dreadlands is another area I would like to return</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">to. Our last hunt there resulted in quite a few loot items. ~ Moonhawk...</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Here are some of the new interesting items available on Kunark:</FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><A HREF=http://www.gameznet.com/eq/equipment/runedblade.html TARGET="_parent"><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Runed Blade</FONT></B></A><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> </FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">(want it &#060;G&#062;),</FONT><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> </FONT></B><A HREF=http://www.gameznet.com/eq/equipment/golemtearearring.html TARGET="_parent"><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Golem Tear Ring</FONT></B></A><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, </FONT></B><A HREF=http://www.gameznet.com/eq/equipment/thronebladeofykesha.html TARGET="_parent"><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Throneblade of the Ykesha</FONT></B></A><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, </FONT></B><A HREF=http://www.gameznet.com/eq/equipment/sarnakhidmask.html TARGET="_parent"><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Sarnak-Hide Mask</FONT></B></A><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, </FONT></B><A HREF=http://www.gameznet.com/eq/equipment/swordbreaker.html TARGET="_parent"><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Sword Breaker</FONT></B></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> (want it a lot!)</FONT><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, </FONT></B><A HREF=http://www.gameznet.com/eq/equipment/deepwaterboots.html TARGET="_parent"><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Deepwater Boots</FONT></B></A><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, </FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">and many more.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">There is also a great </FONT><A HREF=http://www.eqatlas.com/kunark/kunarkzones.html TARGET="_parent"><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Zone Connection Guide</FONT></B></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">REMINDER</FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">: Loot Rules Chat is on for 7pm est on Saturday the 29th of April.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV></TD></TR></DIV></TABLE>

<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=556><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=179><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Tuesaday, April 11, 2000</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Message Forum &#038; Mailing List...</FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The Message Forum is online and working real well. Several people have already registered and made use of it. I would like to get all the members over there as soon as possible, there are several important discussions taking place. A Second Age mailing list has also been created. Many of you will have received the invite for it. Those of you that haven't, please send me your email address and character name to </FONT><A HREF=mailto:esama@msn.com TARGET="_parent"><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">esama@msn.com</FONT></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> and I will set you up right away. The message board should be used for most discussions, the mailing list will mostly be used to make important announcements or to find each other in a hurry. ~ Moonhawk...</FONT></DIV></TD></TR></DIV></TABLE>

<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=556><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=221><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Wednesday, April 13, 2000</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><I><B><FONT class="Helvetica32" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="6">Hearty Welcome to our new members from Arctic Lords...</FONT></B></I></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">On April 12th, the Arctic Lords Guild merged with Second Age to expand our guild to a respectable and powerful size. We wish you all a hearty welcome to Second Age and hope you will find it a very comfortable home to be in. An extra reason for celebrating is the fact that Second Age now has more than 22 level 46+ members, and can therefore book solo events in the planes... Long Live Second Age. ~ Moonhawk...</FONT></DIV></TD></TR></DIV></TABLE>

<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=340><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=125><DIV align=left><B><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">It's not just about the higher level players..</FONT></B><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">.</FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Second Age is home to players of all levels. We want to make sure that players of all levels are appreciated and catered for. Here is what some of the lower level members have been up to recently. Nice going </FONT><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Gebe, Thaumasite, Toronaga, </FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">and</FONT><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> Tashax</FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">.</FONT></DIV></TD></TR></DIV></TABLE>

<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=550><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=546><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Saturday, April 15, 2000</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><I><B><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">The Start of an Alliance</FONT></B></I></DIV><DIV align=left><I><B><FONT class="Helvetica48" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="7">Phinigel Falls to</FONT></B></I></DIV><DIV align=left><I><B><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">Second Age &#038; Veeshan's Forgotten</FONT></B></I></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The combined forces of Second Age and Veeshan's Forgotten &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; descended through the murky depths of Dagnor's Culdron and into the realm of &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; Kedge Keep. Many of it's evil denizens quickly fell to the might of this newly formed Alliance. Shark after shark fell, including Cauldronbubble. The evil green-skinned meremaids were no match either. The alliance had very few losses and survived a rocky start to the evening, Pirahna's bite very hard, four of them accompanied by a shark and Impalers bit even harder, but the Alliance persevered. Deeper and deeper we went, through numerous tunnels and Seahorse inhabited rooms. Finally we came upon the grand hall that is home to the Lord of Kedge Keep itself, Phinigel Atropos. Swirlspine after Swirlspine Guardian fell to the Alliance. With very few losses even the great evil lord himself fell. The most danger was from his ability to dispell everyone very rapidly. The only reason Moonhawk did not drown himself was because he was wearing a Fishbone Earring. It is worth every penny and Moonie kisses it before bed every night.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV></TD></TR></DIV></TABLE>
</DIV>

<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=530><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=149><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">It was a pleasure to work with the members of Veeshan's Forgotten and we hope for a long &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp; fruitful alliance. May numerous Dragons and evil Gods fall to the might of this new &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp; bond between us. It was also wonderful to see how all the members of Second &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp; Age, both old and new, worked very well and happily together. A special thanks &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; to Galaxina, our Combat Cleric, who went beyond the call of duty many times &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp; and swam into the midst of great danger to come to the aid of myself and the &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp; other pullers. Also to Sindaan, the young Enchanter from VF, &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp; who kept us all going with a swift breeze through our mind. &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; ~ Moonhawk...</FONT></DIV></TD></TR></DIV></TABLE>

<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=550><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=661><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Saturday, April 29, 2000</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><I><B><FONT class="Helvetica32" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="6">Second Age in ...</FONT></B></I></DIV><DIV align=left><I><B><FONT COLOR=#ff0033><FONT class="Helvetica48" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="7">...</FONT></FONT></B></I><I><B><FONT class="Helvetica48" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="7"> </FONT></B></I><I><B><FONT COLOR=#ff0033><FONT class="Helvetica48" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="7">KUNARK!!</FONT></FONT></B></I></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Second Agers have now spent quite a few days exploring the new continent</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">of Kunark. The new zones are both impressive and enjoyable to adventure</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">and explore in. Most of us have not seen more than the Dreadlands,</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Burning Woods, Frontier Mountains, and Firiona Vie itself. Over the coming</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">weeks we will be organizing several excusions into the depths of Kunark.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">I think we should try to explore the City of Mist, a CT type dungeon with</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">what appear to be incredible items. The city is in the Emerald Jungle zone, another area</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">we have not yet seen. Karnor's Castle in the Dreadlands is another area I would like to return</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">to. Our last hunt there resulted in quite a few loot items. ~ Moonhawk...</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helveti <TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=550><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=237><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Sunday, April 30, 2000</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"></FONT><I><B><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">Boddyto &#038; Moonhawk Discover New Items...</FONT></B></I></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">After a very scary night of being stuck in the Dungeon of Kaesora, Boddyto and Moonhawk (the only brave souls, or maybe dumb souls &#060;G&#062;, in that zone) discovered two brand new items never before seen in the land of Norrath. We ventured deep into Kaesora, Paladin and Ranger, but within a short while we found ourselves at the bottom of a pit with no way out. With no way to climb back up, we decided we should go deeper and find a way out. We fought against dangerous new creatures, including Spiders that cast Root, Smite, Force Struck, and Heal! After several hours, we finally managed to escape, but not before Boddyto valiantly sacrificed his own life to protect mine with Lay of Hands. The items we found were a new weight reducing bag, a </FONT><A HREF=files/Dusty_Pack.jpg TARGET="_parent"><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Dusty Ransacker's Pack</FONT></B></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, 8-slots, Medium Items, 33% reduction. Also </FONT><A HREF=files/Truesilver_Boots.jpg TARGET="_parent"><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Truesilver Mail Boots</FONT></B></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, AC 11, very nice. ~ Moonhawk...</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV></TD></TR></DIV></TABLE>

<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=550><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=273><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Wednesday, May 10, 2000</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></B></DIV><DIV align=left><I><B><FONT class="Helvetica32" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="6">Second Age heads for Fear</FONT></B></I><I><B><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">, </FONT></B></I></DIV><DIV align=left><I><B><FONT COLOR=#330099><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5"><FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT> </FONT></FONT></B></I><I><B><FONT COLOR=#ff6600><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">New </FONT></FONT></B></I><A HREF=loot_rules.html TARGET="_parent"><I><B><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">Looting Rules</FONT></B></I></A><I><B><FONT COLOR=#ff6600><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5"> Posted...</FONT></FONT></B></I></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Well, the time has finally come, Second Age will be hosting their first Planar Hunting Trip. To be perfectly honest, this scares me silly &#060;G&#062;. There are so many things that can go wrong, so many ways that we could end up with multiple deaths and even outright failure. But I have great confidence in our guild, and I think we can not only do this, but do it well. Each one of us can do a few things that will ensure this success. We have to be patient with each other, we have to realize that we will most likely all get negative experience, we have to realize we may not get that item of Planes Armor we have always wanted. Please help me make this a successful trip for everyone. Read the new </FONT><A HREF=loot_rules.html TARGET="_parent"><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Looting Rules</FONT></B></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, so that there are no surprises when we get there. Tell anyone who has been invited to Fear, to the same page so that they are familiar with them. Thanks, and good luck to all of us, we start on </FONT><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Friday 9am EST</FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">.~ Moonhawk...</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV></TD></TR></DIV></TABLE>
