<DIV style="margin-top: 1px; margin-left: 1px">

<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=550><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=990><DIV align=left><I><B><FONT COLOR=#ffffff><FONT class="Helvetica32" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="6">Second Age Looting Rules...</FONT></FONT></B></I><I><B><FONT COLOR=#ffffff><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5"> </FONT></FONT></B></I></DIV><DIV align=left><I><B><FONT COLOR=#ff9900><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5"><BR></FONT></FONT></B></I></DIV><DIV align=left><B><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">Planes</FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><I><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">NODROP Class Armor and Weapons</FONT></B></I><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">:</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">In the Planes, loot will be done via a participation points system. For every hour you spend at the hunt (and this carries over all the hunting days of that particular trip) you accrue a participation point. An alphabetic list of participants is generated for each class present at the hunt. This list includes both members of SA and invitees. When a loot item drops and you would like to roll for it (and can use it of course), you will send your name to the assigned loot distributor who will generate an alphabetic list. The sum of the list member's participation points is the single random number that will be rolled. So if 3 druids each have 5 participation points (because they each spent 5 hours in the zone), a random number from 1 to 15 would be rolled. The winner is the person (on the alphabetic list) whose sequence of numbers the rolled number falls upon.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">This system will give everyone a chance at loot, but will also award those who spend more time participating, and will make it harder for those who just zone in for their own class drops.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">After you have won a loot item, your participation points are reset to 0. Each hour after that, you again accrue another point, and will therefore have a chance again at loot.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">If loot drops that only you can use, you will be allowed to loot automatically, but your participation points will be reset to 0.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><I><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Tradeable Items:</FONT></B></I></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">These will be handled separately. Participation points will also be used if the classes that can use the items are present. If they are not, it may be at the discretion of the hunt or guild leader as to how they will be distributed.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><I><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">God Loot</FONT></B></I><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">:</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">This will be dependant on the number of drops, who can use, whether it is NODROP, and what guilds participated. The current rule is that if 4 or more items drop, then SA will choose one item for the guild and will random off the rest to the hunt participants. If less than 4 items drop, all may be randomed off.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><B><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">Dragon Runs</FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Similar system to God Loot will be used. If 4 or more items drop, then one item will be chosen by SA and the rest randomed to everyone present. There may be some differences depending on the participation of the Allies of the guild. This will be determined before the hunt depending on planed participation.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><B><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">Kunark and other hunts</FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">A single number will be rolled by the hunt leader or loot distributor. An alphabetically sorted list of eligible names will be used to determine the winner.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><I><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Exceptions</FONT></B></I><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">:</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">There will be times when a hunt may be arranged to get a specific item for one or several of our members. This will be predetermined and made clear before the hunt commences. Yet no one should expect that this will be done every time, or that it can be demanded.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">If anyone has any comments or suggestions for and about this system,</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">send mail to </FONT></B><A HREF=mailto:esama@msn.com TARGET="_parent"><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Moonhawk</FONT></B></A><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">.</FONT></B></DIV></TD></TR></DIV></TABLE>

<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=550><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=990><DIV align=left><I><B><FONT COLOR=#ffffff><FONT class="Helvetica32" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="6">Second Age Looting Rules...</FONT></FONT></B></I><I><B><FONT COLOR=#ffffff><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5"> </FONT></FONT></B></I></DIV><DIV align=left><I><B><FONT COLOR=#ff9900><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5"><BR></FONT></FONT></B></I></DIV><DIV align=left><B><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">Planes</FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><I><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">NODROP Class Armor and Weapons</FONT></B></I><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">:</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">In the Planes, loot will be done via a participation points system. For every hour you spend at the hunt (and this carries over all the hunting days of that particular trip) you accrue a participation point. An alphabetic list of participants is generated for each class present at the hunt. This list includes both members of SA and invitees. When a loot item drops and you would like to roll for it (and can use it of course), you will send your name to the assigned loot distributor who will generate an alphabetic list. The sum of the list member's participation points is the single random number that will be rolled. So if 3 druids each have 5 participation points (because they each spent 5 hours in the zone), a random number from 1 to 15 would be rolled. The winner is the person (on the alphabetic list) whose sequence of numbers the rolled number falls upon.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">This system will give everyone a chance at loot, but will also award those who spend more time participating, and will make it harder for those who just zone in for their own class drops.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">After you have won a loot item, your participation points are reset to 0. Each hour after that, you again accrue another point, and will therefore have a chance again at loot.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">If loot drops that only you can use, you will be allowed to loot automatically, but your participation points will be reset to 0.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><I><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Tradeable Items:</FONT></B></I></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">These will be handled separately. Participation points will also be used if the classes that can use the items are present. If they are not, it may be at the discretion of the hunt or guild leader as to how they will be distributed.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><I><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">God Loot</FONT></B></I><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">:</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">This will be dependant on the number of drops, who can use, whether it is NODROP, and what guilds participated. The current rule is that if 4 or more items drop, then SA will choose one item for the guild and will random off the rest to the hunt participants. If less than 4 items drop, all may be randomed off.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><B><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">Dragon Runs</FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Similar system to God Loot will be used. If 4 or more items drop, then one item will be chosen by SA and the rest randomed to everyone present. There may be some differences depending on the participation of the Allies of the guild. This will be determined before the hunt depending on planed participation.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><B><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">Kunark and other hunts</FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">A single number will be rolled by the hunt leader or loot distributor. An alphabetically sorted list of eligible names will be used to determine the winner.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><I><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Exceptions</FONT></B></I><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">:</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">There will be times when a hunt may be arranged to get a specific item for one or several of our members. This will be predetermined and made clear before the hunt commences. Yet no one should expect that this will be done every time, or that it can be demanded.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">If anyone has any comments or suggestions for and about this system,</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">send mail to </FONT></B><A HREF=mailto:esama@msn.com TARGET="_parent"><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Moonhawk</FONT></B></A><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">.</FONT></B></DIV></TD></TR></DIV></TABLE>
</DIV>
