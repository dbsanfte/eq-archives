<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=344><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=90><DIV align=left><I><B><FONT COLOR=#999999><FONT class="TimesRoman48" FACE="Times New Roman, adobe-times, Times" SIZE="7">Plane of Fear</FONT></FONT></B></I></DIV><DIV align=left><I><B><FONT class="TimesRoman18" FACE="Times New Roman, adobe-times, Times" SIZE="4">May 12th to 13th</FONT></B></I></DIV></TD></TR></DIV></TABLE>
</DIV>
<DIV style="margin-top: -2502px; margin-left: 0px"><IMG SRC=/tp.gif WIDTH=0 HEIGHT=0 BORDER=0></DIV>

<DIV style="margin-top: 345px; margin-left: 224px">
<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=474><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=1158><DIV align=left><B><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">Hunt Report</FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">I'd like to congratulate everyone on the awesome job you all did in the Plane of Fear. I'm truly proud of what we achieved. We came from small humble beginings, just a few low level characters that dreamt of adventure and discovery in the most dangerous places of Norrath. Well, Second Age has truly come of age, we conquered the Plane of Fear.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Two days were spent in the plane, with a total of 3 clearings. It was our first large hunt that we hosted and ran on our own. And how did we do? We did incredibly well! During the whole trip we only had one medium sized CR, the rest of the time we marched through our clearings in a rapid and efficient manner. I'm real proud of what we've done.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">We have a few things that we need to work on, but if we can find a way to be cohesive and respect each other, I think we can resolve all issues that face us as a guild. Each and every one of us, including myself, should try to make an effort towards this. We have come far and achieved many things others never believed we would. If we can stick together and communicate our wants and needs, as well as cater to those of our guildmates, there is nothing that will stand in our collective way.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The way we handled Fear showed what we are capable of. We have a loot system that is unique and fairer than those used by other guilds. We all know that it needs some work, but that is why we tried it, it was the only way to find out what did and what did not work. It will only get better from here on out. And as far as fighting is concerned, the monsters in that plane will remember our name with fear and trepidation&nbsp; . I'm not surprised Cazik never showed.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">I'm amazed at the great job </FONT><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Aragon</FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> and </FONT><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Cenadil</FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> did with the loot distribution, I know the math of it so I don't envy what they had to do one bit. But the system worked, no waiting for everyone to roll or for loot to be arbitrarily handed out. Kudos to them.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Links</FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> did an incredible job pulling the mobs as well as helping people who had to do a death run in. Your skill as a puller and Monk is incredibly impressive, never doubt that this is what I think. </FONT><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Gizbangg,</FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> </FONT><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Hedstone,</FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> and </FONT><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Sheng</FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> were also a great help in the pulling, we appreciate the time you all spent.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Elthorn</FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, the group-shifting songster, thanks for spreading that mana song around, I'm real sorry I had to keep moving you around, but without you we would have had some grumbling healers on our hands&nbsp; </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Anye</FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, the Fairheart, your new nickname for so selflessly having passed on an item of Vermiculated armor to another guild druid. And this in spite of the fact that you won it fair and square. I can't tell you enough how happy I am to be able to call you a guildmate.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Bellowes</FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, the Braveheart. I have to mention this. After almost loosing Bellowes from EverQuest altogether, I actually ended up with tears in my eyes when he received his new BP, I was so happy, the moment just hit me in a strange way. I'm glad you stayed James, and I'm glad you were up there with us.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Fayadane</FONT></B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, thank God you were up there to help me handle all the political inter-guild wrangling, I know how hard you worked to get Fayadane up there, and I'm sure she will be the next time we do a trip like this, but I was glad you were up there in one form or another, though I just couldn't get myself to hug you wearing that man's body&nbsp; </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">I was amazed how all the SA members that had come to Fear for the first time were so calm and willing to help in any way they were asked. Kudos to all of you.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The Druids, you all did an incredible job, you managed to keep your groups alive during times when I just didn't have enough Clerics to spread around.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Not one person complained about being moved from one group to another. Thanks for the help you gave me in that respect. It was difficult at times to keep the groups balanced, but all the group leaders always informed me when someone was leaving or a replacement was needed. We worked as a team, and the results showed that we worked well.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Thanks to everyone, and thanks for letting me be a part of the Second Age, let's keep the Age going.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Moonhawk...</FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV></TD></TR></DIV></TABLE>
</DIV>
