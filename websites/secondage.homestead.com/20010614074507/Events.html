<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=516><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=1250><DIV align=left><I><B><FONT class="TimesRoman48" FACE="Times New Roman, adobe-times, Times" SIZE="7">May 2k1 Raid Schedule</FONT></B></I></DIV><DIV align=left><I><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Please sign up for the hunts on the forum...</FONT></B></I></DIV><DIV align=left><I><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></B></I></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><B><FONT COLOR=#cc9966><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">May 1st, Tuesday 6pm est, Veneril Sathir / Ixiblat / Juggs</FONT></FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">We will try for a regular VS spawn on that day, so please try and be parked in Karnor the night before, and if you are able try and get to VSs room before 7 to camp and claim it. VS does not take long, so after we finish we will head for BW to fight Ixiblat for all clerics at that point of the quest. Proceeding that, we will finish off at the Juggs in Seb.</FONT></DIV><DIV align=left><I><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Attending:</FONT></B></I></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">---</FONT></B></DIV><DIV align=left><B><FONT COLOR=#cc9966><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#cc9966><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">May 4th, Friday 7pm est, Plane of Fear</FONT></FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Single evening trip to Plane of Fear to get the golems mainly.</FONT></DIV><DIV align=left><I><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Attending:</FONT></B></I></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">---</FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><B><FONT COLOR=#cc9966><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">May 6th, Sunday 9am est, Kael</FONT></FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Day hunt to primarily up everyone's ClawsOfVeeshan faction in preparation for hunting in the Temple of Veeshan Halls of Testing. For those that don't know, the dragons in the Halls of Testing can be killed without receiving any negative faction whatsoever.</FONT></DIV><DIV align=left><I><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Attending</FONT></B></I><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">:</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">---</FONT></B></DIV><DIV align=left><B><FONT COLOR=#cc9966><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#cc9966><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">May 8th, Tuesday 7pm est, The Hole / City of Mist</FONT></FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Epic run for Shamen, SKs and any other classes that need it.</FONT></DIV><DIV align=left><I><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Attending:</FONT></B></I></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">---</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></B></DIV><DIV align=left><B><FONT COLOR=#cc9966><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">May 18-20, Fri-Sun 7pm est, Plane of Hate</FONT></FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The big hunt for the month. Hopefully this time we will have more luck with Warrior and Shaman drops, as well as with the MiniBosses.</FONT></DIV><DIV align=left><I><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Attending:</FONT></B></I></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">---</FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><B><FONT COLOR=#cc9966><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">May 22nd, Tuesday 7pm est, Kael</FONT></FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Day hunt to primarily up everyone's ClawsOfVeeshan faction in preparation for hunting in the Temple of Veeshan Halls of Testing. For those that don't know, the dragons in the Halls of Testing can be killed without receiving any negative faction whatsoever.</FONT></DIV><DIV align=left><I><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Attending:</FONT></B></I></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">---</FONT></B></DIV><DIV align=left><B><FONT COLOR=#cc9966><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#cc9966><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">May 25-26, Fri-Sat 7pm est, Temple Of Veeshan</FONT></FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Our first forray into uncharted territory, this will be a very tough hunt but highly rewarding if we succeed. Please make every effort to attend this.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Tentatively the Level limit will be the following:</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">RNG/PAL/SK/ROG/BRD/WAR - 55+</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">MNK - 52+ (this is tentative)</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">CLR - 52+</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">DRD/SHM - 55+</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">MAG/WIZ/NEC - 55+</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">ENC - 52+ (but low levels may only be used for buffing)</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><I><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Attending:</FONT></B></I></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">---</FONT></B></DIV><DIV align=left><B><FONT COLOR=#cc9966><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#cc9966><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">May 29th, Tuesday 7pm est, Velketor's Labrynth</FONT></FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Our first return to this dungeon, we never really tried it past the Kobolds.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><I><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></I></DIV><DIV align=left><B><FONT COLOR=#ff0033><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">** Dragons &#038; Ragefires **</FONT></FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">If at any point we get the opportunity to catch a dragon and/or ragefire spawn, we will immediately mobilize to attempt to down the creature. It is hard to schedule for these as the spawns are dependent on patches and previous killings.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Hope this sounds like a fun schedule for everyone. Inbetween these hunts I suggest people spend the time in single exp groups gaining the exp everyone needs to work on.&nbsp; </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><B><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Moonhawk...</FONT></B></DIV><DIV align=left><I><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">GL Second Age, CT Server...</FONT></I></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV></TD></TR></DIV></TABLE>
</DIV>
