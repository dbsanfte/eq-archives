<html>
<script language=javascript>
var version = window.navigator.appVersion;
var pos = version.search(/MSIE/i) + 5;
var subversion = version.substr(pos+2,1)
version = version.substr(pos,1);
var Page
var expire = new Date()
expire.setYear(expire.getYear() + 1)
var n = (document.layers) ? 1:0;
var realversion = version + "." + subversion
if (version == 5 && subversion < 5) version = 4

if (version < 5) {
   Page = "index-old.html"
} else {
   Page = "index55.html"
}

if ( version < 4) Page = "index-old.html"

if (n == 1) {
   window.location="index-old.html";
} else { 
   onload = init
}

function init() {
   document.all.idFrame.src=Page
   if (version == 4) {
      var all = document.cookie
	  if (all == '' || all.indexOf('v=') == -1) {
	     alert("This website will function with Internet Explorer " + realversion + " but not optimally.  It is recommended you contact the help desk to have version 5.5 installed")
		 document.cookie = 'v=4; expires=' + expire.toGMTString() + ';'
	  }
   }
}
</script>
<head>
<title>Something For Everyone - All Skill No Fill</title>
</head>
<link rel="stylesheet" type="text/css" href="..\style_opd.css">
<frameset rows="100%,*" frameborder="0" framespacing="0" border="0" >
	
	<frameset cols="100%,*" frameborder="0">

		<frame src="" id="idFrame" name="navigator" scrolling="yes" noresize>
		
	</frameset>
	
    <noframes>

	<body >
	</body>

    </noframes>
	
</frameset>

</html>
