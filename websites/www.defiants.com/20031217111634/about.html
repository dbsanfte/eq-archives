<h1>About Defiant Software</h1>
<p>
Defiant Software was founded in November 1999 by Andrew Dunn and Jason Greenham in Brockville, Ontario. The company was created with the intention of providing high quality and reasonably priced software solutions to a wide variety of organizations.
<p>
Defiant Software's major contribution in it's early years was the Wildcat Library Automation System. This program, marketed in the local area was eventually acquired by the repubable company <a href = "http://www.essentialskills.net" target = "new">Essential Skills Software</a>, where it was developed into a world class competitor. <a href = "http://www.essentialskills.net/liberty" target = "new">Liberty Automated Library</a>, as it is now known, is currently being used in many schools across North America. 
<p>
In 2003 the company moved it's base of operations to the Quinte area and began offering its services to the many respected businesses in the community.
