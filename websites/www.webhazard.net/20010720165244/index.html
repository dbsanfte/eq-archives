News Update, Mon, 16 July 2001, 7:40pm PST by <B>Solarianne</B>
</TD>
</TR>
<TR>
<TD>
Thanks to everyone who was able to make the Aide Station in Ill Omen <IMG SRC="./emoticons/smile.gif"> We got lots of cheers, helped out a lot of people, and had a great time.<P>

A big welcome to Krewnic, Aiolas, and Chayne, the newest members of the Tears of Veeshan. Also welcome Balalyka, Mikelis, and Cloudburst - other incarnations of spirits we all know and love. Welcome all! <IMG SRC="./emoticons/smile.gif"><P>
</TD>
</TR>

<TR>
<TD BGCOLOR="A0B0E0">
News Update, Wed, 11 July 2001, 5:30pm PST by <B>Solarianne</B>
</TD>
</TR>
<TR>
<TD>
Thanks to everyone who attended Slay the Drake! yesterday in Steamfont. Many a foul dragon-kin was destroyed, definitely allowing the nearby residents of Ak'Anon to sleep more soundly. Alas the drakes reproduce at an alarming rate, so it will not be long before the Gnomish city is threatened anew ...<P>
</TD>
</TR>

<TR>
<TD BGCOLOR="A0B0E0">

</TD>
</TR>
