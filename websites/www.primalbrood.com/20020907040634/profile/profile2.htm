<script language="JavaScript">

var interval = 1.5; // delay between rotating images (in seconds)
interval *= 1000;   // multiply by milliseconds

var image_index = 0;
image_list = new Array();
image_list[image_index++] = new imageItem("/profile/images/greenbriarcatering-first.jpg");
image_list[image_index++] = new imageItem("/profile/images/greenbriarcatering-second.jpg");
image_list[image_index++] = new imageItem("/profile/images/greenbriarcatering-third.jpg");
var image_count = image_list.length;

function imageItem(image_location) {
        this.image_item = new Image();
        this.image_item.src = image_location;
}

function get_ImageItemLocation(imageObj) {
        return(imageObj.image_item.src)
}

function getNextImage() {
        image_index++;

        if (image_index >= image_count) {
                image_index = 0;
        }

        var new_image = get_ImageItemLocation(image_list[image_index]);
        return(new_image);
}

function rotateImage(place) {
        var new_image = getNextImage();
        document[place].src = new_image;
        var recur_call = "rotateImage('"+place+"')";
        setTimeout(recur_call, interval);
}

</script>
