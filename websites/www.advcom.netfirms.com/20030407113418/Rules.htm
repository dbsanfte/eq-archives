  height:215.5pt'>
 
  <p class=MsoNormal align="center"> <span style='font-family:"CAC Camelot";
  color:black'><img width=415 height=108 src="AdvCom.gif"
  alt="Adventurers Company" v:shapes="_x0000_s1029"></span></p>
  <p class=MsoNormal>&nbsp;</p>
  <h5 align=center style='text-align:center'><span style='font-size:18.0pt;
  font-family:Arial;color:black'>Way of the Adventurer</span></h5>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>Let these
  words hereafter define who we are to those who would know us. Let no one say
  that we are anything less than that which is held in these words.</span></p>
  <h4 align=center style='text-align:center'><span style='font-size:10.0pt;
  font-family:Arial;color:black'><br>
  </span><span style='font-size:13.5pt;font-family:Arial;color:black'>Conduct</span></h4>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>We in the
  Adventurers Company are Adventurers, Scholars, Hunters, Merchants, and
  Entertainers. In addition, and most importantly, we are, by all rights,
  Heroes. We are proud, and we are strong, with wisdom of travel and passion of
  heart; we stand against those that would be otherwise.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>As such, no
  member will antagonize another player to duel; we are not about challenging
  others to prove that we are better. Let no one ever challenge your worth with
  words or taunts. Let no one ever get the better of you by being beneath you
  and bringing you down to his or her level. However, should the time come that
  someone does harm to you, and they choose to take from you or show you
  dishonor, then be not afraid to stand for yourself in combat and duel for
  your honor.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>As
  Adventurers, we are not a family of beggars. We do not stoop to pestering
  others for items; we rise to the challenge and go out and win them for
  ourselves.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>Courtesy
  should always be the first action towards any player in the game and to any
  member. When requesting items, buffs, ports, etc. from another guild member,
  please ask as a general question in guildchat. Another member may want to
  help or be willing but not able to help at that moment. If they say they
  can't or can but not right at that moment, that is them taking you into
  consideration. Please show them the same consideration. In addition, when requesting
  favors such as ports, buffs, rezzes, etc. from other players, be considerate
  of their situation and be understanding if they are unable to assist you. We
  do not want to be looked upon as demanding or ungrateful.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>No member is
  ever expected, nor should they be asked, to leave a group they are hunting
  with to aid another member. If you make a request in guildchat for help,
  other members will let you know if they can help you or not. We don't want to
  be the guild that no one wants to group with because we leave a group in a
  bad situation to run off to locate a corpse, rezz someone, port a member on
  CR, etc. Those are the guilds that are not Norrath friendly. We are not
  elitists. We are just family.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>KSing/Training
  is not acceptable. If you are being KSed/Trained by a person, speak to them
  and try to reason with them. If reasoning does not work and they are in a
  guild, notify their guild's officers or leader. If the KSing/Training is a
  real problem, petition. Do not turn around and get your higher level character
  and KS/Train them. Anyone found to be maliciously KSing/Training will be
  removed from the guild. You may send a rebuttal regarding your removal to the
  guild leader. However, you will remain outside the guild until a final
  decision is reached.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>Any abuse of
  the guild or its members is grounds for removal. Negative attitudes towards
  other members will not be tolerated.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>The use of
  the option, /anonymous is not accepted as we expect members to display their
  guild tags with pride. If privacy is desired, please use the, /roleplay so
  other members can see you are on when doing a, /w all adv.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>No member
  should ever reprimand or counsel another member. Period. If a member feels
  there is a problem, they should address it to an officer, who will decide
  what action to take. No officer will reprimand or counsel a member without
  due cause, and then they must make a report to the officers' board after
  doing so.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>All officers
  will report on the officers' board any violation of conduct or attendance.
  All violations will be addressed by the officers as a whole. No officer will
  council a member or officer before reporting the violation to the other
  officers available and discussing it. If, after discussing it, the officers
  find that the situation requires counseling or even guild removal, the
  officer taking this action will report on the officers' board the actions
  taken and the reasons why. Any member who is counseled by an officer for
  conduct or attendance issues can send a rebuttal in their defense to the
  guild leader, but they are not to approach another officer about the actions
  taken. They must wait for a response from the guild leader regarding the
  situation. This prevents any biased thoughts until they are reviewed and
  presented by the guild leader. </span></p>

  </span><span style='font-size:13.5pt;font-family:Arial;color:black'><h4 align="center"><b>Loot Rules</b></h4></span></h4>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'><i>These are the guidelines that guide us when we play, 
        grind and hunt with one another:</i></span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'><b>Types of groups:</b><br>
A. Guild only: 
</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>In these situations NBG should apply. If you need the item then ask for it but be considerate and mindful of the needs of other party members. If more than one person needs then the group should lotto it among those that need. Once you win an item you should not ask to receive another until everyone else has received an item or no one else wants it. A guild only group is the best kind of group. Remember, these are your friends.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>B. Pick-up group (groups where not everyone is guild tagged):<br>

Whatever the group members agree too. If you don’t like the rules or the way loot was handled do you best to work it out and if you still aren’t happy then leave the group as soon as it is safe and practical to do so.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>C. Guild Raids (more than 6 guild members trying to accomplish an objective):<br>

Many times there will be reserved piece of loot for one member. For example, epic mobs commonly have reserved loot. This should be stated up front by the raid leader as much as possible. In the event of a drop happening where multiple people could benefit that was not reserved NBG should apply. The RL in consultation with the officers has the final determination of who can roll on the drop (only the guild leader may override the raid leader.).</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>D. Raids with allied guilds:

Whatever rules have been negotiated for the alliance.
Currently we are in an alliance with 4 other guilds collectively called “The alliance.” The ruleset is called TAPS found <a href="http://pub54.ezboard.com/fthealliance59294frm22.showMessage?topicID=417.topic" target="_blank">here.</a> </span></p>
  

  <h4 align=center style='text-align:center'><span style='font-size:13.5pt;
  font-family:Arial;color:black'>Title of Officer</span></h4>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>This is
  simple. An officer of this guild works at making the guild, as a whole,
  better for its members. Officers make sure that events and raids get planned,
  and that issues that members may have get dealt with in a friendly and direct
  manner.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>Officers of
  this guild are members, as well as servants of the guild as a whole. No
  officer will show favoritism to another member for any reason. Officers
  pledge that the good of the guild will always be put before the desires of
  the individual.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>Any time that
  a member feels that an officer has misrepresented them or that the officer
  has broken the rules that he/she is entrusted to uphold, that member should
  speak to the guild leader about what has transpired, in game or by e-mail.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>Officer
  Elections</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>1. The
  Guildleader reserves the right to appoint any member the position if he deems
  the members is worthy of the position. This is with the concurrence of the
  entire officer core and does not include a vote.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>2. There will
  be a total of 9 officers to include the Guildleader. Four of these positions
  are appointed by the Guildleader; they are permanent positions and are not
  voted on.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>3. The
  remaining 4 positions are applied for by members. This officer position is
  for a term of one year after election into office. At any time one of these
  positions should become vacant, there will be another election process to
  fill the slot.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'><br>
  To become a officer you must meet these requirements </span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>1. Be a FULL
  member of the Company. Sorry no one on the 30 day probation may apply.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>2. Main
  character must be of at least 45th level or have 3 guilded characters total a
  minimum of 120 levels. This is only to assure that the officer(s) have
  experience with the game and some of the higher end game as well.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>3. Be in game
  on a regular basis. This is to assure that new officers are available. No
  time limit is necessary, however the more the merrier </span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>The Election
  process<br>
  Post your application in the appropriate area of the member’s only area. No
  application will be considered if they are in the wrong place. Applications
  must contain your name, class/level, how long you have been playing, your
  experiences with Norrath and why you think that you can and will benefit the
  guild by becoming an Officer.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>Applications
  will be left up for one week so that the members can read and determine if
  you are worthy to lead. After one week's time, the application area will be
  locked and the officers will have a brief discussion of 2 days of the
  applicants, to include talking with the applicants. Please be aware that
  these 2 days can not disqualify the applicants. They are simply for officers
  to talk more in-depth with applicants about intent, desires, answer questions
  and share experiences as an officer. After those 2 days of officer
  discussions, there will be a poll placed in the members only area were the
  members and officers will vote. At the end of the voting process, the winners
  will get the job. In the event of a tie, there will be a 3 day period for a
  roll-off election to determine the winner. Once the election(s) are over, the
  winners will be promoted to officer.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>In the event
  that there is not more than 4 nominees to fill the elected positions then all
  the nominees shall be appointed to an officer position without a vote of the
  membership. Any unfilled slots will be left open for a special election.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>How long are
  officer positions?</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>Appointed
  Officer Term: This position is a permanent one. If at any time an appointed
  position becomes vacant, the Guildleader will appoint a new officer to fill
  the slot. This position does not get voted on.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>Elected
  Officer Term: 1 year from being elected or when they resign. If a slot become
  vacant, then there will be another election process. Elected officers may
  elect to reapply after their term is over.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>Special
  Elections: These can be called by a full member at any time to fill an
  unfilled election slot in the officers group. Special elections follow the
  same process of regular elections. The term of the person chosen by the membership
  shall expire at the same time as the term for regular elections. Again if
  there is not more nominees than available slots for the special election the
  nominee(s) shall become officers at the end of the special election without a
  vote by the membership.</span></p>
  <h4 align=center style='text-align:center'><span style='font-size:10.0pt;
  font-family:Arial;color:black'><br>
  </span><span style='font-size:13.5pt;font-family:Arial;color:black'>Guilding</span></h4>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>As of
  6/10/02, the minimum requirement has been raised from level 15 to level 40.
  All members, members on the 30 day probation period and those that have a
  open application are hereby &quot;grandfathered&quot; at the level 15
  requirement. All other applicants must meet the new minimum requirement.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'><br>
  1. You must have achieved 40th level.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>2. The
  applicant must apply on the message board to request sponsorship.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>3. The
  applicant is allowed 7 days to become sponsored.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>4. If an
  applicant is sponsored, then the name, race, class, and level of the
  applicant are posted in the officers' forum. The officers then have 3 days to
  post 'aye' or 'nay' on the guilding of the applicant. The reason why or why
  not is not required. Not posting will count as a vote of agreement.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>5. Should the
  applicant receive a unanimous vote from the officers, then the applicant's
  information will be posted for 3 days for the members to vote upon. Again,
  silence will count as agreeing. Members may post on the boards, or e-mail
  their vote to the guild leader or officers.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>6. Should the
  applicant receive 1 negative vote, they will be declined membership in our
  guild. Why or why not has no bearing on this decision.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>7. Should the 
  applicant be unanimously voted for, then the applicant will be guilded and put
   on probation for 30 days. Failure to post an application on our message
    boards will prevent an applicant from progressing beyond probationary 
	status. After the probation period has ended, they will be considered a full
	 member and will receive all rights and benefits as a member.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>8. Any officer
   may reserve the right to post a “field sponsorship” if they so choose. The 
   officer will be allowed to make the decision of temporarily guilding the 
   recruit prior to the recruit’s information being posting on the board. 
   Once sponsored and guilded by the officer, the recruit will still go through
    steps 2 (posting of application), 4, 5, and 6 as any other applicant, but,
	 obviously, they will not have to seek sponsorship on the boards. 
	 The sponsoring officer will post the recruit’s info on the officers’ board
	  and on the member's board immediately after guilding them for voting. 
	  Again, should this type of recruit receive 1 negative vote, they will be 
	  denied permanent membership and will be removed from the guild. If the 
	  recruit does not receive any negative votes, then they will continue in 
	  the guild, observing the 30 day probationary period. 
 </span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'><br>
  9. At any time during the probationary period, the guild leader or officers
  may decide that the new member should no longer be guilded. After a
  discussion in the officers’ forum regarding the reasons, the new member will
  be informed of the reasons why, and they will be removed.</span></p>
  <h3><span style='font-size:10.0pt;font-family:Arial;color:black'>Guild
  Removal</span></h3>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>Removal of a
  member of the guild must be voted on by the entire officer council. If any
  officer fails to vote, then the guild leader will make the final decision as
  to what action is to be taken.<br>
  Removal of an officer will be voted on by the members. They will send their
  votes to the guild leader and he will then make a decision based upon the
  guild’s voice.<br>
  The guild leader retains the right to remove or demote any officer or member.
  The guild leader has veto power on all guild removal and demotions.<br>
  The guild leader may be impeached by a vote of the entire guild and officers.
  A poll will be placed in the Members Only area where the guild will decide
  the fate of the current Guildleader. This is a majority vote. Once the voting
  is complete, the First Officer will then pass the judgment of the guild. If
  the guild leader is removed, he or she will become a regular member unless
  otherwise decided. At this time another guild leader will be voted on and
  promoted</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>Dues<br>
  At this time we do not collect dues from members. If in time we do start
  collecting again, then the following will be in force.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'><br>
  The incorporation of dues will ensure that on raids or at guild events,
  items, ports, or rezzes are available. Every month, all members will
  contribute 1pp per level of their primary character. These funds will be held
  by an official mule. The balance will be posted on the website, and it will
  be called the Bank of ADVCOM. This will not be used for any individual; it is
  for the guild as a whole only. The officers and the guild leader will
  determine what events or raids qualify for the funds.</span></p>
  <h5 align=center style='text-align:center'><span style='font-size:13.5pt;
  font-family:Arial;color:black'>Alliances</span></h5>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>Any guild
  that we are in an alliance with will abide by the same rules of conduct that
  we do, as per the agreement drawn between our guild and theirs. No alliance
  will be accepted by ADVCOM with out the following stipulations.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>1. In the
  alliance, neither guild will benefit more than the other. No guild shall
  offer their friendship to the other without knowing that the same is given in
  return.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>2. Each
  member shall offer to the allied guild’s members the same comradery and
  courtesy that they offer to their own. The alliance provides both guilds with
  wells of information to draw from and friends to raid and hunt with.
  Remember, they may not bear our tag, but the alliance shows that they have
  the same heart and soul that we do.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>3. There
  shall be equal invitation to any event or raid that is held. For events that
  are formally for members only such as ceremonies, weddings, promotions, or
  change of guild leader, the guild holding the event will have the right to
  decide whether or not to open the event to allies.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>4. The
  benefits of this alliance are not to be abused or taken for granted.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>5. No member
  will be asked to change their membership to that of an allied guild. Any
  member who wishes to move to an allied guild must remain guild-less for 30
  days, or have the approval by their guild leader before petitioning an allied
  guild to become a member. An allied guild will not accept an ex-member’s
  guild application prior to 30 days without this approval. This is to assure
  that there will be no hard feelings on either side regarding the loss of a
  member of their family. This also prevents animosity between guilds. </span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>6. Any guild
  that we are allied with will remain its own separate entity, and so in turn
  do we. Adventurers Company will never enter into an alliance where we absorb
  another guild, or are absorbed by one. Any alliance formed will always
  respect the Charter and Individuality of the guilds involved. No guild will
  have say over the actions of an allied guild. If the actions reflect in a
  manner unappreciated by the alliance, then the alliance can be dissolved.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>7. The guild
  officers of each guild involved will resolve any conflicts or differences of
  opinion between members in the allied guilds. No member will aggressively
  confront a member of another guild that is allied with ours. Officers are to
  be notified of anything that requires their direct involvement, and the
  officers will endeavor to deal with the situation in a diplomatic fashion.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>8. With
  regard to guild wars, this alliance does not convey responsibility for any
  dispute or retribution that one guild may accrue. Should either of the allied
  guilds go to war, the other guild is in no way required to join in. It is
  entirely the allied guild’s decision whether or not they choose to join in.
  Should they decline involvement, it will not be looked upon as a failure to
  uphold any part of the alliance. The guild’s decision will be respected.
  Should an allied guild go to war and invite the allied guild’s members to
  join their ranks to fight, this change in membership would be for the
  duration of the war only. If at some point an ally requests to hold a Guild
  War as an event, this must be agreed upon by both guilds involved. If this
  event suggestion is declined, once again, no lack of respect will be implied.
  This being said does not suggest that any alliance would exist merely for the
  guilds to have mock wars or to support each other in the event of guild wars
  breaking out. However, it is stated here to make sure that, in the event that
  one does occur, there is no animosity on either side due to lack of
  involvement.</span></p>
  <h4 align=center style='text-align:center'><span style='font-size:13.5pt;
  font-family:Arial;color:black'>Guild Mergers</span></h4>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'><br>
  Occasionally we have found other smaller guilds that share our values and
  things progress to the point where the officers wish to propose a guild
  merger. Here are our standards regarding this issue:</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>A. The
  guildleader may appoint a number of people to negotiate the terms of the
  merger.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>B. The
  officer’s of the guild merging into us will provide a list of members that
  will be joining us and we will guild then as regular members.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>C. For
  purposes of a merger our usual 30 day probationary rule is waived in the
  following manner. The new members shall immediately be given access to the
  members forum but all other aspects of the probation shall remain in effect.</span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>D. If all
  officer positions are filled then depending on the terms of the proposed
  merger the GL may at their option appoint a non-voting representative whose
  purpose shall be to help us integrate new members and make us aware of issues
  as they come up to help smooth the transition. This appointment shall not
  last more than 3 months. In the event of officer openings then there may or
  may not be a special election as set forth in our standards after 1 month. If
  there is a special election then after that election is concluded then any
  non voting membership to smooth the transition shall be ended. </span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>E. The
  members from the merging guild must read, understand and agree to be bound by
  the posted standards of conduct on our website. </span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>F. In order
  for the merger to happen an election shall be held with a 60% YES vote
  required for passage from the members. It is a simple up or down vote based
  on the negotiated terms.</span></p>
