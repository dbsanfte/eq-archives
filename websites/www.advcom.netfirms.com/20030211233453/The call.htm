  <p class=MsoNormal align="center"> <span style='font-family:"CAC Camelot";
  color:black'><img width=415 height=108 src="AdvCom.gif"
  alt="Adventurers Company" v:shapes="_x0000_s1029"></span></p>
  <p class=MsoNormal>&nbsp;</p>
  <h1 align=center style='text-align:center'><i><span style='font-size:48.0pt;
  mso-bidi-font-size:13.5pt;font-family:"Arial Black";mso-bidi-font-family:
  Arial;font-variant:small-caps;color:black'>The Call…</span></i></h1>
  <p align=center style='text-align:center'><b><i><span style='font-size:13.5pt;
  font-family:Arial;color:black'>The Battle Cry of the Company:&nbsp;&nbsp;
  &quot;Hail the Hooch!!!&quot;</span></i></b><i><span style='font-size:13.5pt;
  font-family:Arial;color:black'>&nbsp;</span></i><b><i><span style='font-size:
  48.0pt;mso-bidi-font-size:13.5pt;font-family:"Arial Black";mso-bidi-font-family:
  Arial;font-variant:small-caps;color:black'><o:p></o:p></span></i></b></p>
  <p align=center style='text-align:center'><span style='font-family:Arial;
  color:black'>&nbsp;</span><u><span style='font-size:18.0pt;font-family:Arial;
  color:black'>Our guild:</span></u><span style='font-family:Arial;color:black'><o:p></o:p></span></p>
  <p><span style='font-family:Arial;color:black'>&nbsp;&nbsp;&nbsp; The
  Adventurers Company exists as a family of friends who have bonded in battle
  and quest, in times both good and bad, having found a common link which fuels
  our distinctive camaraderie.&nbsp; Adventure being our focus, we seek the adrenaline
  SURGE, that legendary acceleration of blood flow stimulated by victory in
  battle and completion of our quest.&nbsp; It is Adventure that drives us to
  master the quests of Norrath.&nbsp; It is said not all people are cut from
  the Adventuring mold, and grow weary in the time of the SURGE, therefore a
  selective eye is placed on those who wish to join our ranks.&nbsp; The
  Company strives to gain experience that is necessary to achieve loftier
  aims.&nbsp; We will arm our membership with the finest tools with which to
  accomplish our set upon purposes.&nbsp; And upon successful achievement, and
  even on the path to achievement, we will celebrate each victory with the
  finest among the fine blends of distilled and fermented libations available
  in all the lands and seas.&nbsp; For when the mortars light the Norrathian
  sky, and cheers deafen its citizens, all will know it is the Company who
  prevailed that day.<o:p></o:p></span></p>
  <p><span style='font-size:10.0pt;font-family:Arial;color:black'>&nbsp;</span><u><span
  style='font-size:18.0pt;font-family:Arial;color:black'>Our Mission:</span></u><span
  style='font-family:Arial;color:black'><o:p></o:p></span></p>
  <ol start=1 type=1>
   <li class=MsoNormal style='color:black;mso-margin-top-alt:auto;mso-margin-bottom-alt:
       auto;mso-list:l1 level1 lfo3;tab-stops:list .5in'><span
       style='font-family:Arial'>To pursue Adventure through mastery of the
       quests of Norrath, <o:p></o:p></span></li>
   <li class=MsoNormal style='color:black;mso-margin-top-alt:auto;mso-margin-bottom-alt:
       auto;mso-list:l1 level1 lfo3;tab-stops:list .5in'><span
       style='font-family:Arial'>To acquire experience from Adventure, <o:p></o:p></span></li>
   <li class=MsoNormal style='color:black;mso-margin-top-alt:auto;mso-margin-bottom-alt:
       auto;mso-list:l1 level1 lfo3;tab-stops:list .5in'><span
       style='font-family:Arial'>To be victorious in quest and battle, <o:p></o:p></span></li>
   <li class=MsoNormal style='color:black;mso-margin-top-alt:auto;mso-margin-bottom-alt:
       auto;mso-list:l1 level1 lfo3;tab-stops:list .5in'><span
       style='font-family:Arial'>To acquire wealth from our victories, <o:p></o:p></span></li>
   <li class=MsoNormal style='color:black;mso-margin-top-alt:auto;mso-margin-bottom-alt:
       auto;mso-list:l1 level1 lfo3;tab-stops:list .5in'><span
       style='font-family:Arial'>To celebrate and libate at every possible
       opportunity, <o:p></o:p></span></li>
   <li class=MsoNormal style='color:black;mso-margin-top-alt:auto;mso-margin-bottom-alt:
       auto;mso-list:l1 level1 lfo3;tab-stops:list .5in'><span
       style='font-family:Arial'>To strive for quality membership, <o:p></o:p></span></li>
   <li class=MsoNormal style='color:black;mso-margin-top-alt:auto;mso-margin-bottom-alt:
       auto;mso-list:l1 level1 lfo3;tab-stops:list .5in'><span
       style='font-family:Arial'>To structure our ranks as we grow in number,
       yet maintain a loose and welcoming camaraderie, <o:p></o:p></span></li>
   <li class=MsoNormal style='color:black;mso-margin-top-alt:auto;mso-margin-bottom-alt:
       auto;mso-list:l1 level1 lfo3;tab-stops:list .5in'><span
       style='font-family:Arial'>To coordinate events which enhance our
       brotherhood and sisterhood in spirit and wealth, <o:p></o:p></span></li>
   <li class=MsoNormal style='color:black;mso-margin-top-alt:auto;mso-margin-bottom-alt:
       auto;mso-list:l1 level1 lfo3;tab-stops:list .5in'><span
       style='font-family:Arial'>To plunder those zones and exact revenge on
       NPC’s who tormented us in our youth, <o:p></o:p></span></li>
   <li class=MsoNormal style='color:black;mso-margin-top-alt:auto;mso-margin-bottom-alt:
       auto;mso-list:l1 level1 lfo3;tab-stops:list .5in'><span
       style='font-family:Arial'>To encourage skill development among our ranks
       to develop self reliance, <o:p></o:p></span></li>
  </ol>
  <p style='margin:0in;margin-bottom:.0001pt'><span style='font-family:Arial;
  color:black'>AND<o:p></o:p></span></p>
  <ol start=1 type=1>
   <li class=MsoNormal style='color:black;mso-margin-top-alt:auto;mso-margin-bottom-alt:
       auto;mso-list:l0 level1 lfo6;tab-stops:list .5in'><span
       style='font-family:Arial'>To maintain our friendship and camaraderie to
       spite all odds</span><o:p></o:p></li>
  </ol>
