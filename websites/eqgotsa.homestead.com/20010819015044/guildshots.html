 Roman, adobe-times, Times" SIZE="2">and Love.</FONT></FONT></B></I></DIV><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="TimesRoman13" FACE="Times New Roman, adobe-times, Times" SIZE="2"><BR></FONT></FONT></B></I></DIV><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="TimesRoman13" FACE="Times New Roman, adobe-times, Times" SIZE="2">Friendship is like the </FONT></FONT></B></I></DIV><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="TimesRoman13" FACE="Times New Roman, adobe-times, Times" SIZE="2">dawning sun. </FONT></FONT></B></I></DIV><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="TimesRoman13" FACE="Times New Roman, adobe-times, Times" SIZE="2">Friendship rises softly and warms the heart it shines upon. </FONT></FONT></B></I></DIV><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="TimesRoman13" FACE="Times New Roman, adobe-times, Times" SIZE="2"><BR></FONT></FONT></B></I></DIV><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="TimesRoman13" FACE="Times New Roman, adobe-times, Times" SIZE="2">Those who seek and nurture true friendship never walk alone in these lands.</FONT></FONT></B></I></DIV><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="TimesRoman13" FACE="Times New Roman, adobe-times, Times" SIZE="2"><BR></FONT></FONT></B></I></DIV><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="TimesRoman13" FACE="Times New Roman, adobe-times, Times" SIZE="2"><BR></FONT></FONT></B></I></DIV><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="TimesRoman13" FACE="Times New Roman, adobe-times, Times" SIZE="2">With Guildship and friends surrounding ...</FONT></FONT></B></I></DIV><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="TimesRoman13" FACE="Times New Roman, adobe-times, Times" SIZE="2"><BR></FONT></FONT></B></I></DIV><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="TimesRoman13" FACE="Times New Roman, adobe-times, Times" SIZE="2">This was a joyous event. </FONT></FONT></B></I></DIV><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="TimesRoman13" FACE="Times New Roman, adobe-times, Times" SIZE="2"><BR></FONT></FONT></B></I></DIV><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="TimesRoman13" FACE="Times New Roman, adobe-times, Times" SIZE="2">Afterward there was plenty of dancing,&nbsp; floating,</FONT></FONT></B></I></DIV><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="TimesRoman13" FACE="Times New Roman, adobe-times, Times" SIZE="2">SOW and</FONT></FONT></B></I></DIV><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="TimesRoman13" FACE="Times New Roman, adobe-times, Times" SIZE="2">a LOT of drinking... </FONT></FONT></B></I></DIV><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="TimesRoman13" FACE="Times New Roman, adobe-times, Times" SIZE="2">(I droped 10PP worth</FONT></FONT></B></I></DIV><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="TimesRoman13" FACE="Times New Roman, adobe-times, Times" SIZE="2"> of alcohol on the ground myself RLMAO.),</FONT></FONT></B></I></DIV><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="TimesRoman13" FACE="Times New Roman, adobe-times, Times" SIZE="2">and speaking in different languages.</FONT></FONT></B></I></DIV><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="TimesRoman13" FACE="Times New Roman, adobe-times, Times" SIZE="2"><BR></FONT></FONT></B></I></DIV><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="TimesRoman13" FACE="Times New Roman, adobe-times, Times" SIZE="2">I can only look forward to many more joyous memories To share with my brothers and sisters of Norrath's Hope.</FONT></FONT></B></I></DIV><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="TimesRoman13" FACE="Times New Roman, adobe-times, Times" SIZE="2"><BR></FONT></FONT></B></I></DIV><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="TimesRoman13" FACE="Times New Roman, adobe-times, Times" SIZE="2"><BR></FONT></FONT></B></I></DIV><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="TimesRoman13" FACE="Times New Roman, adobe-times, Times" SIZE="2"><BR></FONT></FONT></B></I></DIV><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="TimesRoman13" FACE="Times New Roman, adobe-times, Times" SIZE="2"><BR></FONT></FONT></B></I></DIV><DIV align=left><I><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">See you in EQ</FONT></FONT></I></DIV><DIV align=left><I><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">May your travels be safe. Seska </FONT></FONT></I></DIV></TD></TR></DIV></TABLE>
