<html>
<head>
	<title>Epic Heroes Roster: Roster Header</title>
	<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
	<link rel="stylesheet" href="roster.css" type="text/css">
</head>


<body onResize="window.location.href = window.location.href;">

<script language=JavaScript>
	<!-- Start of JavaScript -->
	if( parseInt(navigator.appVersion) > 3 )
	{
		if( navigator.appName == "Netscape" )
		{
			nWindowWidth	= window.innerWidth;
			nWindowHeight	= window.innerHeight;
		}
		if( navigator.appName.indexOf( "Microsoft" ) != -1 )
		{
			nWindowWidth	= document.body.offsetWidth;
			nWindowHeight	= document.body.offsetHeight;
		}
	}

	document.write(
		'<OBJECT	classid		= "clsid:D27CDB6E-AE6D-11cf-96B8-444553540000"' +
		'			codebase	= "http://active.macromedia.com/flash2/cabs/swflash.cab#version=4,0,0,0"' +
		'			ID			= Header' +
		'			WIDTH		= ' + nWindowWidth +
		'			HEIGHT		= ' + nWindowHeight + '>' +
		'	<PARAM	NAME		= movie		VALUE = "flash/eqroster_header.swf">' +
		'	<PARAM	NAME		= menu		VALUE = false>'+
		'	<PARAM	NAME		= quality	VALUE = high>' +
		'	<PARAM	NAME		= bgcolor	VALUE = #000000>' +
		'	<PARAM	NAME		= salign	VALUE = T>' + 
		'	<EMBED	src			= "flash/eqroster_header.swf"' +
		'			quality		= high' +
		'			bgcolor		= #000000' +
		'			WIDTH		= ' + nWindowWidth +
		'			HEIGHT		= ' + nWindowHeight +
		'			TYPE		= "application/x-shockwave-flash"' +
		'			PLUGINSPAGE	= "http://www.macromedia.com/shockwave/download/index.cgi?P1_Prod_Version=ShockwaveFlash">' +
		'	</EMBED>' +
		'</OBJECT>' );
	<!-- End of JavaScript -->
</script>

</body>
</html>
