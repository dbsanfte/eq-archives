    function displaymembers(sortingby, choice)
    {
      // sortby = 0 - all classes, 1 - one class, 2 - race, 3 - time zone
      // choice = alphabetical order of classes or race, or time zone

	      }

	  document.write("<\/table>");
	 }
      }

	}
       }
       document.write("<\/table>");

    function whichsort(sortform)
    {
     sortingA = sortform.sortA.options[sortform.sortA.selectedIndex].value
     sortingClass = sortform.sort1.options[sortform.sort1.selectedIndex].value
     sortingRace = sortform.sort2.options[sortform.sort2.selectedIndex].value
     sortingTZ = sortform.sort3.options[sortform.sort3.selectedIndex].value

     switch (sortingA)
     {
     case "Class":
      parent.topbar.document.sort_info.sortby.value = "Class";
      parent.topbar.document.sort_info.sortvalue.value = sortingClass;
      break;

     case "Race":
      parent.topbar.document.sort_info.sortby.value = "Race";
      parent.topbar.document.sort_info.sortvalue.value = sortingRace;
      break;

     case "Time Zone":
      parent.topbar.document.sort_info.sortby.value = "Time Zone";
      parent.topbar.document.sort_info.sortvalue.value = sortingTZ;
      break;

     default:
      parent.topbar.document.sort_info.sortby.value = "All";
      parent.topbar.document.sort_info.sortvalue.value = "Null";
      break;
     }
