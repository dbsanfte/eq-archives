, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>Today's event screenshots: </FONT><FONT COLOR=#ffffff><A HREF=kedgetrip.html TARGET="_parent">Kedge Keep</FONT></A></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>Update: </FONT><FONT COLOR=#ffffff><A HREF=air.html TARGET="_parent">Plane of Air</FONT></A><FONT COLOR=#ffffff> screenshots (Thanks Fizzy!)</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>************************************************************************</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>March 3&nbsp; 2000</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>Here are some screenshots of tonight's </FONT><FONT COLOR=#ffffff><A HREF=fgs1.html TARGET="_parent">Fire Giant raid</FONT></A><FONT COLOR=#ffffff>&nbsp; and the happy union between </FONT><FONT COLOR=#ffffff><A HREF=wed1.html TARGET="_parent">Sania and Khale</FONT></A><FONT COLOR=#ffffff>.</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>Items obtained in this event:</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>Mithril Vambraces - Zastari</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>Mithril Torque - Giana</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>Rokyl's Channeling Crystal - Sapphire</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>************************************************************************</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>March 1&nbsp; 2000</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>Aawelan has created an IRC channel where we can all meet during server downtime and discuss important guild issues or just to chat :)</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=center><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>irc.enterthegame.com&nbsp; #obs</FONT></FONT></DIV><DIV align=center><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>************************************************************************</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>February 29&nbsp; 2000</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>Congratulations to all on a job well done in Fear! Even if it was a though break in the drop rate was on our side... till the gods turned against us. It was nice to see that people stayed together in good and bad times during this raid.</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>Here are some of the items obtained: </FONT><FONT COLOR=#ffffff><A HREF=http://www.homestead.com/planeitems/umbrallegs.html TARGET="_parent">Umbral Greaves</FONT></A><FONT COLOR=#ffffff>, </FONT><FONT COLOR=#ffffff><A HREF=http://www.homestead.com/planeitems/umbralarms.html TARGET="_parent">Umbral Vambraces</FONT></A><FONT COLOR=#ffffff>, Cryosilk Sleeves, </FONT><FONT COLOR=#ffffff><A HREF=http://www.homestead.com/planeitems/blightedrobe.html TARGET="_parent">Blighted Robe</FONT></A><FONT COLOR=#ffffff>, Shiverback Tunic, </FONT><FONT COLOR=#ffffff><A HREF=http://www.homestead.com/planeitems/flayedturmoilbelt.html TARGET="_parent">Flayed Turmoilskin Belt,</FONT></A><FONT COLOR=#ffffff> Vermiculated Crown.</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>************************************************************************</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>February 23&nbsp; 2000</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>Phinigel has been once again slain! Congratulations to Nannasin and Fizzler on&nbsp; their new Robes of the Kedge, and to Dona on her Staff of Elemental Mastery: Water.</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>************************************************************************</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>February 22&nbsp; 2000</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>The fire giant raid has proved itself a success. Congrats to Ori on his new Mithril Arms and to Nike on the new Polished Mithril Mask.</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>************************************************************************</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>February 21&nbsp; 2000</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>Three guilds have become one today. Order of the Black Staff, The Talquinn and Crimson Sigil have combined forces, forming what seems to be the largest family in Norrath.</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff>A bright and exciting future awaits us!</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=2><FONT COLOR=#ffffff><BR></FONT></FONT></DIV></TD></TR></DIV></TABLE>
