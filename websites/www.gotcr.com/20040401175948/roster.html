							if ( arrClasses[i].Characters[j].LevelNum >= 60 ) nNumLevel60s++;
						}
					}
				}

				document.write( '<tr>' );
				document.write( '<td></td>' );
				document.write( '<td colspan="6" align=right class="Footer" background="images/cellpic3.gif"><font color="#d8c299">Average level: <b xclass=Highlight>' + Math.round( nTotalLevelsInClass / nNumCharsInClass ) + '</font></b></td>' );
				document.write( '</tr>' );				
				document.write( '<tr>' );
				document.write( '<td colspan="7">&nbsp;</td>' );
				document.write( '</tr>' );				
			}
			document.write( '<tr>' );
			document.write( '<td colspan="7" align=right class="Footer"><font color="#000000">' );
			document.write( '<b>Guild Statistics</b><br>' );
			document.write( '<hr noshade height=1 style="height:1px; color:#000000">' );
			document.write( 'There are <b xclass=Highlight>' + nNumChars + '</b> total members in the guild, with an average level of <b xclass=Highlight>' + Math.round( nTotalLevels / ( nNumChars - nNumCharsUnder46 ) ) + '</b>.<br>' );
			document.write( '<img src=images/empty.gif height=5><br>' );
			document.write( '<b xclass=Highlight>' + nNumLevel60s + '</b> members are level 60+. <span class=DeHighlight><font color="#000000">(' + Math.round( ( nNumLevel60s / nNumChars ) * 100 ) + '%)</font></span><br>' );
			document.write( 'Of the <b xclass=Highlight>' + nNumChars51OrAbove + '</b> members that are level 51+, <b xclass=Highlight>' + nNumCharsWithEpic + '</b> have their epic weapon(s). <span class=DeHighlight><font color="#000000">(' + Math.round( ( nNumCharsWithEpic / nNumChars51OrAbove ) * 100 ) + '%)</font></span><br>' );
			document.write( '</font></td>' );
			document.write( '</tr>' );				
		</script>

		</table>
