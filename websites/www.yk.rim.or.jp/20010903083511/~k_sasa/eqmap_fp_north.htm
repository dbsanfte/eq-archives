      <p>■勝手な感想■</p>
      <p>一番治安がいい区域。道も壁もきちんと出来上がってます。ガードハウスにクレリック、パラディンハウスがあるからでしょうか。</p>
      <p>銀行まえはマーケット地区です。食料と布鎧が充実してます。</p>
      <p>鍛冶スキルを０からあげるなら、「GroflasheresChoeds」がいいとおもいます。さびた武器をあつめておいて、ここで研ぎ石を購入し、店の外にあるForgeで作業しましょう。便利なせいか、先客がいること多いです。</p>
