		function toTD(td) {
			if (td == 0) return "<BR>";
			if (td > 0) return "+" + td;
			return "-" + td;
		}

		function Equipment(name, slot, ac, str, sta, dex, agi, int, wis, cha, hp, mana, pr, mr, fr, cr, dr) {
			this.name = name;
			this.slot = slot;
			this.ac = ac;
			this.str = str;
			this.sta = sta;
			this.dex = dex;
			this.agi = agi;
			this.int = int;
			this.wis = wis;
			this.cha = cha;
			this.hp = hp;
			this.mana = mana;
			this.pr = pr;
			this.mr = mr;
			this.fr = fr;
			this.cr = cr;
			this.dr = dr;
			this.getTitle = function() {
				return "<TR><TH>Name<TH>Slot<TH>AC<TH>STR<TH>STA<TH>DEX<TH>AGI<TH>INT<TH>WIS<TH>CHA<TH>HP<TH>MANA<TH>PR<TH>MR<TH>FR<TH>CR<TH>DR\n";
			}
			this.toTR = function(col) {
				return "<TR>" + col + this.name
					+ col + this.slot
					+ col + toTD(this.ac)
					+ col + toTD(this.str)
					+ col + toTD(this.sta)
					+ col + toTD(this.dex)
					+ col + toTD(this.agi)
					+ col + toTD(this.int)
					+ col + toTD(this.wis)
					+ col + toTD(this.cha)
					+ col + toTD(this.hp)
					+ col + toTD(this.mana)
					+ col + toTD(this.pr)
					+ col + toTD(this.mr)
					+ col + toTD(this.fr)
					+ col + toTD(this.cr)
					+ col + toTD(this.dr)
					+ "\n";
			}
			this.add = function(e) {
				this.ac += e.ac;
				this.str += e.str;
				this.sta += e.sta;
				this.dex += e.dex;
				this.agi += e.agi;
				this.int += e.int;
				this.wis += e.wis;

				this.mana += e.mana;
				this.pr += e.pr;
				this.mr += e.mr;
				this.fr += e.fr;
				this.cr += e.cr;
				this.dr += e.dr;
			}
		}
