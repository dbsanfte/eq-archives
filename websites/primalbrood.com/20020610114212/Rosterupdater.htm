<div id="Layer2" style="Z-INDEX: 2; LEFT: 173px; WIDTH: 628px; POSITION: absolute; TOP: 140px; HEIGHT: 1072px"><!-- #BeginEditable "Text%20Box" --> 
  <p align="center"><font color="#000040"><i><u><font size="6">Primal Roster Updater</font></u></i></font></p>
  <p align="center">&nbsp;</p>
  <p align="center"><font size="4" color="#000000">Please complete the whole form, 
    email address is very important!</font></p>
  <form action="/cgi-bin/FormMail.pl" method="post">
    <input type=hidden name="recipient" value="helmaster@hotmail.com">
    <input type="hidden" name="subject" value="Roster Update">
    <input type="hidden" name="redirect" value="http://www.primalbrood.com/TYRoster.htm">
    <table width="99%" border="1">
      <tr> 
        <td width="61%"><font color="#000000" size="+1"> Character Name: </font></td>
        <td width="39%"> 
          <div align="left">
<input name="realname" size="26" >
          </div>
        </td>
      </tr>
      <tr> 
        <td width="61%"><font size="+1">Select your new level:</font></td>
        <td width="39%"> 
          <select name="New level">
            <option selected>60</option>
            <option>59</option>
            <option>58</option>
            <option>57</option>
            <option>56</option>
            <option>55</option>
            <option>54</option>
            <option>53</option>
            <option>52</option>
            <option>51</option>
            <option>50</option>
            <option>49</option>
            <option>48</option>
            <option>47</option>
            <option>46</option>
            <option>45</option>
            <option>44</option>
            <option>43</option>
            <option>42</option>
            <option>41</option>
            <option>40</option>
          </select>
        </td>
      </tr>
      <tr> 
        <td width="61%"><font size="+1"> Your new rank if applicable: </font>(IE. 
          Title)</td>
        <td width="39%"> 
          <input name="New Rank/Title" size ="40">
        </td>
      </tr>
      <tr> 
        <td width="61%"><font size="+1">Your Email Address</font></td>
        <td width="39%"> 
          <input name="email" size="40" >
        </td>
      </tr>
      <tr> 
        <td width="61%"><font size="+1">Comments to the Roster Keeper:</font></td>
        <td width="39%"><TEXTAREA name="Comments to Roster Keeper" cols=35></TEXTAREA>
        </td>
      </tr>
    </table>
    <div align="center">
      <input type="submit" value="Submit">
    </div>
  </form>
