function SpeedGuideHTML() {
	htmlText="<FONT face=Verdana color=#70DB93 size=2>";
	htmlText+="<font size=4>Speed guide to raising skill in Tailoring</font>";
	htmlText+="<p>";
	htmlText+="I must warn you, there is no <b>real way</b> to speed skill in tailoring. But I did just find this writing by Sir Yakk on EQtraders that seems to have about the best suggestions.";
	htmlText+="<p align=left>";
	htmlText+="<b>1.</b> Get a L 50 necro, L 51 enchanter, and L 40 druid on different accounts. Any one of them can be on the same account as your 'tradeskiller'. Trust me, it is faster this way.";
	htmlText+="<p align=left>";
	htmlText+="<b>2.</b> Using the druid, quad-kite spiders & lions & wolves in EK, with the enchanter providing clarity, and the necro mana-dumping between kites. Stop when you have 5 10-slot backpacks of silk and 5 10-slot backpacks of hides";
	htmlText+="<p align=left>";
	htmlText+="<b>3.</b> Become a master brewer and blacksmith (see speed smithing/brewing guides). Make 4 10-slot backpacks of studs, 1 10-slot backpack of bonings, 20 10-slot backpacks of Heady Kiolas.";
	htmlText+="<p align=left>";
	htmlText+="<b>4.</b> Go to www.eqtraders.com. Copy down trivial lists. Do the pelt-based recipies until you run out of components of the right quality. Then, do cured silk to 81. Then, using your HQ non-cat pelts make reinforced armor until you run out of pelts. Then, use HQ cat pelts to make quivers.";
	htmlText+="<p align=left>";
	htmlText+="<b>5.</b> Repeat the above until you are at 115 tailoring. Save those silks. At 115 tailoring, throw out all your cat/bear/wolf hides.";
	htmlText+="<p align=left>";
	htmlText+="<b>6.</b> Go to Crystal Caverns with your necro and enchanter. Do the corridor outside the queen room (and the queen room if unoccupied), possibly joining groups and bribing people to let you keep crystalline silks. When you have a 10-slot backpack full of crystalline silks...";
	htmlText+="<p align=left>";
	htmlText+="<b>7.</b> Make crystalline silk swatches, and go to thurg. Do the crystalline silks recipies in order of number of swatches/trivial level (swatch count most important) until 131.";
	htmlText+="<p align=left>";
	htmlText+="<b>8.</b> Take the 3 backpacks of silks you have left, and the 12 backpacks of Heady Kiolas. Necro manadumps on the chanter, chanter steals mana from the druid, make 3 backpacks full of mana vials (the L 12 one).";
	htmlText+="<p align=left>";
	htmlText+="<b>9.</b> Do Mantles until trivial, then Sleeves until trivial, then Gi's until trivial.";
	htmlText+="<p align=left>";
	htmlText+="<b>10.</b> If you run out of components, hunt for more.";
	htmlText+="<p align=center>";
	htmlText+="<b>Congratulations, you are now a 158 skill tailor. Now it gets hard.</b>";

	document.all.recipePic.innerHTML=htmlText;
}
