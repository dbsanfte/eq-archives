			var nTotalLevelsInClass = 0;
			var nTotalLevels = 0;
			var nNumLevel60s = 0;
			var nNumCharsUnder46 = 0;
			var nNumChars51OrAbove = 0;
			var nNumCharsWithEpic = 0;
			var nNumCharsWithAAXPTitle = 0;
			for ( i = 0; i < arrClasses.length; i++ )
			{
				nNumCharsInClass = 0;
				nTotalLevelsInClass = 0;
				document.write( '<tr>' );
				document.write( '<td class="ClassHeaderName" width="40%" background="images/cellpic3.gif"><font color="#d8c299">' + arrClasses[i].ClassName + '<a name="' + arrClasses[i].ClassName + '">&nbsp;</font></a></td>' );
				document.write( '<td class="ClassHeader" width="10%" align="center" background="images/cellpic3.gif"><font color="#d8c299">Level</font></td>' );
				document.write( '<td class="ClassHeader" width="10%" align="center" background="images/cellpic3.gif"><font color="#d8c299">Race</font></td>' );
				document.write( '<td class="ClassHeader" width="10%" align="center" background="images/cellpic3.gif"><font color="#d8c299">Epic?</font></td>' );
				document.write( '<td class="ClassHeader" width="10%" align="center" background="images/cellpic3.gif"><font color="#d8c299">PoP?</font></td>' );
				document.write( '<td class="ClassHeader" width="10%" align="center" background="images/cellpic3.gif"><font color="#d8c299">Keys</font></td>' );
				document.write( '<td class="ClassHeader" width="10%" align="center" background="images/cellpic3.gif"><font color="#d8c299">Profile</font></td>' );
				document.write( '</tr>' );

				if ( arrClasses[i].Characters )
				{
					var k = 0;
					for ( j = 0; j < arrClasses[i].Characters.length; j++ )
					{
						if ( !arrClasses[i].Characters[j].IsAlt )
						{
							szClass = ( k % 2 == 0 ? 'ClassContent' : 'ClassContentAlt' );
							document.write( '<tr>' );
							var szEmailAddress = '';
							if ( arrClasses[i].Characters[j].EmailAddress != '' )
							{
								szEmailAddress = '&nbsp;&nbsp;&nbsp;&nbsp;<a style="font-weight:400;" href="mailto:' + arrClasses[i].Characters[j].EmailAddress + '"><font color="#000000">(Send e-mail)</font></a>';
							}	
							if ( arrClasses[i].Characters[j].IsLeader )
								document.write( '<td class="' + szClass + 'BoldLeader"><font color="#000000"><a title="' + arrClasses[i].Characters[j].CharacterName + '`s Alts: ' + arrClasses[i].Characters[j].AltList + '">' + arrClasses[i].Characters[j].CharacterName + ' (Guild Leader)' + szEmailAddress + '</font></td>' );
							else if ( arrClasses[i].Characters[j].IsOfficer )
								document.write( '<td class="' + szClass + 'BoldLeader"><font color="#000000"><a title="' + arrClasses[i].Characters[j].CharacterName + '`s Alts: ' + arrClasses[i].Characters[j].AltList + '">' + arrClasses[i].Characters[j].CharacterName + ' (Guild Officer)' + szEmailAddress + '</font></td>' );
							else
								document.write( '<td class="' + szClass + 'Bold"><font color="#000000"><a title="' + arrClasses[i].Characters[j].CharacterName + '`s Alts: ' + arrClasses[i].Characters[j].AltList + '">' + arrClasses[i].Characters[j].CharacterName + szEmailAddress + '</a></font></td>' );	
							document.write( '<td class="' + szClass + '" align="center"><font color="#000000">' + arrClasses[i].Characters[j].LevelNum + '</font></td>' );
							document.write( '<td class="' + szClass + '" align="center"><font color="#000000">' + arrClasses[i].Characters[j].RaceName + '</font></td>' );
							document.write( '<td class="' + szClass + '" align="center"><font color="#000000">' + ( arrClasses[i].Characters[j].HasEpic ? 'Yes' : '&nbsp;' ) + '</font></td>' );
							document.write( '<td class="' + szClass + '" align="center" style="padding:2px;">' + ( arrClasses[i].Characters[j].HasPoP ? '<img src="images/powericon.gif">' : '&nbsp;' ) + '</td>' );
							document.write( '<td class="' + szClass + '" align="center" style="font-size:10px; padding:2px;">' );
							if ( arrClasses[i].Characters[j].HasHSKey )
							{
								//document.write( '<img alt="Key to Charasis (Howling Stones)" src="images/HSKey.gif">' );
								document.write( '<font color="#000000">(HS)</font>' );
							}
							else
							{
								//document.write( '<img src="images/empty.gif" width="20">' );
							}
							if ( arrClasses[i].Characters[j].HasHSKey && arrClasses[i].Characters[j].HasSebKey ) document.write( '&nbsp;' );
							if ( arrClasses[i].Characters[j].HasSebKey )
							{
								//document.write( '<img alt="Trakanon Idol (Old Sebilis)" src="images/SebKey.gif">' );
								document.write( '<font color="#000000">(S)</font>' );
							}
							else
							{
								//document.write( '<img src="images/empty.gif" width="20">' );
							}
							if ( !( arrClasses[i].Characters[j].HasHSKey || arrClasses[i].Characters[j].HasSebKey ) ) document.write( '&nbsp;' );
							document.write( '</td>' );
							document.write( '<td class="' + szClass + '" align="center">' + ( arrClasses[i].Characters[j].MageloUrl == '' ? ( arrClasses[i].Characters[j].AllakhazamUrl == '' ? ( arrClasses[i].Characters[j].GuildMagicUrl == '' ? '&nbsp;' : '<a target="_new" href="' + arrClasses[i].Characters[j].GuildMagicUrl + '"><font color="#000000">Profile</font></a>' ) : '<a target="_new" href="' + arrClasses[i].Characters[j].AllakhazamUrl + '"><font color="#000000">Profile</font></a>' ) : '<a target="_new" href="' + arrClasses[i].Characters[j].MageloUrl + '"><font color="#000000">Profile</font></a>' ) + '</td>' );
							document.write( '</tr>' );
							k++;
							nNumChars++;
							nNumCharsInClass++;
							nTotalLevelsInClass += arrClasses[i].Characters[j].LevelNum;
							if ( arrClasses[i].Characters[j].HasEpic ) nNumCharsWithEpic++;
							if ( arrClasses[i].Characters[j].HasAAXPTitle ) nNumCharsWithAAXPTitle++;
							if ( arrClasses[i].Characters[j].LevelNum < 46 )
							{
								nNumCharsUnder46++;
							}
							else
							{
								if ( arrClasses[i].Characters[j].LevelNum > 50 ) nNumChars51OrAbove++;
								nTotalLevels += arrClasses[i].Characters[j].LevelNum;
							}
							if ( arrClasses[i].Characters[j].LevelNum >= 60 ) nNumLevel60s++;
						}
					}
				}

				document.write( '<tr>' );
				document.write( '<td></td>' );
				document.write( '<td colspan="6" align=right class="Footer" background="images/cellpic3.gif"><font color="#d8c299">Average level: <b xclass=Highlight>' + Math.round( nTotalLevelsInClass / nNumCharsInClass ) + '</font></b></td>' );
				document.write( '</tr>' );				
				document.write( '<tr>' );
				document.write( '<td colspan="7">&nbsp;</td>' );
				document.write( '</tr>' );				
			}
			document.write( '<tr>' );
			document.write( '<td colspan="7" align=right class="Footer"><font color="#000000">' );
			document.write( '<b>Guild Statistics</b><br>' );
			document.write( '<hr noshade height=1 style="height:1px; color:#000000">' );
			document.write( 'There are <b xclass=Highlight>' + nNumChars + '</b> total members in the guild, with an average level of <b xclass=Highlight>' + Math.round( nTotalLevels / ( nNumChars - nNumCharsUnder46 ) ) + '</b>.<br>' );
			//document.write( 'The average member level is <b class=Highlight>' + Math.round( nTotalLevels / ( nNumChars - nNumCharsUnder46 ) ) + '</b><br>' );
			document.write( '<img src=images/empty.gif height=5><br>' );
			document.write( '<b xclass=Highlight>' + nNumLevel60s + '</b> members are level 60+. <span class=DeHighlight><font color="#000000">(' + Math.round( ( nNumLevel60s / nNumChars ) * 100 ) + '%)</font></span><br>' );
			document.write( 'Of the <b xclass=Highlight>' + nNumChars51OrAbove + '</b> members that are level 51+, <b xclass=Highlight>' + nNumCharsWithEpic + '</b> have their epic weapon(s). <span class=DeHighlight><font color="#000000">(' + Math.round( ( nNumCharsWithEpic / nNumChars51OrAbove ) * 100 ) + '%)</font></span><br>' );
			document.write( 'Of the <b xclass=Highlight>' + nNumChars51OrAbove + '</b> members that are level 51+, <b xclass=Highlight>' + nNumCharsWithAAXPTitle + '</b> have an AAXP title. <span class=DeHighlight><font color="#000000">(' + Math.round( ( nNumCharsWithAAXPTitle / nNumChars51OrAbove ) * 100 ) + '%)</font></span><br>' );
			document.write( '</font></td>' );
			document.write( '</tr>' );				
		</script>

		</table>
		
		<br>
		<br>
	</body>
</html>
