<P>
<CENTER><H1>『　波　止　場　と　潮　風　』</H1>
<P>
<DL>
<DD>マスター：成瀬　洋一郎
<DD>基本設定：ていとく　　　
</DL>
<P>
<IMG SRC="images/las2.gif" BORDER=0>
<P></CENTER><HR><P>
<DL>
<DD>　Ｌ＆Ｓの第２弾は、「もしも織田信長が本能寺で死ななかった世界」の日本が太平洋へと進出し、アジア支配に乗り出したヨーロッパ勢力と覇権争いを繰り広げるという海の戦い。
<DD>　英国海軍の戦列艦がマラッカ海峡に迫り、それを迎え撃たんと出撃する和軍船団。その安宅船から発展した軽巡は、列強からやがて＜ＡＴＴＡＣＫ　ＳＨＩＰ＞として恐れられるようになる。壮絶な戦いは二転三転し、戦いの大海原にいくつもの艦影が消えていく。
