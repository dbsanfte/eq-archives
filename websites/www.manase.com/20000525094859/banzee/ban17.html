<DD>　この学校には創立以来伝わる１つの伝説がありました。
<DD>　「卒業式の日、校庭の片隅にある大きな樹の下で、女の子から告白して馬利他恋人たちは永遠に幸せになれる」という伝説が…。<P>
<DD>　そして３月。
<DD>　今年もまた「伝説の樹の下での告白」を巡り、女の子たちの思惑が交錯する。「ときめく相手が見つかるか」「告白する前に傷ついてしまわないか」「うまく告白できるのか」？
