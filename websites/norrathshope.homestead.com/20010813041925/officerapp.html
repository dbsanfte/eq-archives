<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=386><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=254><DIV align=center><B><FONT COLOR=#000066><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">How officers are chosen:</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#000066><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#000066><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">1) Anyone who wishes to become an officer must be an active member of Norrath's Hope for at least 1 month and be level 20 or above.</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#000066><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#000066><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">2) After filling out the application, it will be reviewed by Reemi and the applicants will be decided upon by all the officers.</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#000066><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#000066><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">3) Once the final applicants have been chosen, there may be a poll on the website for all members to vote on. Only one vote per computer will be allowed.</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#000066><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#000066><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">4) The newly chosen officer will then be promoted in game to 'officer' and given the password to the officer's post.</FONT></FONT></B></DIV></TD></TR></DIV></TABLE>

<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=448><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=329><DIV align=center><B><FONT COLOR=#000066><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Officer Responsabilities:&nbsp; (Don't be scared, it's not this harsh, really)</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#000066><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#000066><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">1) Officers are expected to help the members of the guild in any way their race/class can. (porting, rezzing, ect...) obviously not when it is extremly inconveinient, but if you are available...</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#000066><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#000066><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">2) Officers should always be on the lookout for new members! </FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#000066><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#000066><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">3) Officers should do their best to show up for all the guild events.</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#000066><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#000066><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">4) Officers should PLAN events once in a while. hosting raids is a very important, very needed responsibility.</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#000066><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#000066><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">5) If an officer sees any misconduct in guild chat, or zone wide, by a member of our guild, they should imediatly send the person a tell, and take care of it, explaining the rules of the guild and how they prohibit such behavior... If the members proves to be a problem, send me a tell and it will be taken care of.</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#000066><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#000066><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">6) Officers of the guild should, at some point, donate to the treasury. Helping new members is, after all, what we do!</FONT></FONT></B></DIV></TD></TR></DIV></TABLE>
