<TD COLSPAN=4><DIV align=left><B><FONT COLOR=#ffff00><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">This month's raid will occur on Saturday, 28 April at 8pm EST.&nbsp; </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffff00><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffff00><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">The setting for this Raid will be the Historic battlefield of Kithicor Wood.&nbsp; This is the area where the Forces of Light met the Armies of Darkness and stopped their drive toward to Highpass Hold.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffff00><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffff00><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">The aftermath of this great battle left the entire woods haunted by legions of undead that only appear at night....</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffff00><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffff00><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">While dangerous, this area can be handled with good teamwork and careful pulling.&nbsp; Almost all undead here have pets and are also casters. &nbsp; Fear spells and undead clerics with healing powers are quite common.&nbsp; Dread Wolves also prow this haunted forest and can prove challenging.&nbsp; </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffff00><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffff00><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">Loot is very good and can consist of rare, no drop weapons for all classes.&nbsp; Bring your protection from magic and stun spells and your favorite undead bashing weapon and meet us in West Commons at the Kith zone at 8pm EST on Saturday the 28th and we will drive the undead back to where they belong!!!</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffff00><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffff00><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">During the relatively quiet daytime hours, we will go out and hunt Giants, Griffs and Shadowed Men in WC while waiting for night to fall.&nbsp; Please try to attend as the more people we have, the more undead we can kill !!!!! </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffff00><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffff00><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">Hope to See Ya There,</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffff00><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffff00><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">Balta&nbsp; </FONT></FONT></B></DIV></TD>
