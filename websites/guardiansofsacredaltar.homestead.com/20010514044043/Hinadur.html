<TD><DIV align=left><I><B><FONT COLOR=#ff0033><FONT class="Comic-Sans16" FACE="Comic Sans MS" SIZE="3">Believe it or not, there has been a time when Faldawen and I were not grouped together ridding the world of evil.&nbsp; That was during my 17th season to about my low 20th season.&nbsp; During that time I met up with Fathere,Ruiz, Bulliwyf and the mighty Dwarf Hinadur.&nbsp; Just like Fal, Hinadur was always there to watch my back in case of a bad situation.&nbsp; Hinadur may be a Dwarf, but don't let the littel guy fool you.&nbsp; He is a very dangerous Palidan, but very good at fighting at the same time.&nbsp; Who said Palidans were failed clerics and failed fighters, because if they knew Hinadur, he would make them eat their words.&nbsp; Hinadur and I have become very good friends, and when things went sour in our former guild, we knew it was time to gather our friends to create the Guardians.&nbsp; Hinadur is true to this guild, and will fight for the right decisions to make sure that this guild continues to flow smoothly.&nbsp; If not for the support of Hinadur and my other officers, the Guardians may not exist today.&nbsp; </FONT></FONT></B></I></DIV><DIV align=left><I><B><FONT COLOR=#ff0033><FONT class="Comic-Sans16" FACE="Comic Sans MS" SIZE="3">Just like Faldawen, Hinadur is one who I know when the situation gets bad, I would want him covering my back.&nbsp; Thank you Hinadur for helping me with the Guardians.&nbsp; Your support and friendship has been valuable to not only to me but to the guild.&nbsp; Let us continue to help the guild grow and become one of the most known Guilds to prtect the lands of Norrath.&nbsp; Oh by the way I still can't find that vendor in BB...(my very first port Hin had me looking all over BB for some metal molds)...</FONT></FONT></B></I></DIV><DIV align=left><I><B><FONT COLOR=#ff0033><FONT class="Comic-Sans16" FACE="Comic Sans MS" SIZE="3">~Valorin Diamante~</FONT></FONT></B></I></DIV><DIV align=left><I><B><FONT COLOR=#ff0033><FONT class="Comic-Sans16" FACE="Comic Sans MS" SIZE="3"><BR></FONT></FONT></B></I></DIV></TD>
