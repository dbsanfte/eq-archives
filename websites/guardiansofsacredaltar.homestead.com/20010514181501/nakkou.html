<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=364><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=644><DIV align=left><I><B><FONT class="Comic-Sans16" FACE="Comic Sans MS" SIZE="3">This land is filled with many different races, classes and well Nakkou.&nbsp; My travels have blessed me and The Guardian's with this funny little Halfling.&nbsp; Don't get me wrong, Nakkou may be a Halfling, but she has the sticky fingers of a rouge and a heart of a warrior.&nbsp; The 2 other big characteristic of Nakk is her enjoyable humor in which I spend half the time shaking my head and laughing at her little comments.&nbsp; (No pun intead Nakk.)&nbsp; The other characteristic is her ability to fall down things.&nbsp; I sometimes wonder if Nakk's purpose on this land is to find out how much damage she can take if she falls.&nbsp; The only thing is that thses falls are not small falls.&nbsp; They seem to be off cliff's and bridges.&nbsp; Maybe Nakk's life long dream is to find the highest cliff or bridge, and find out how much damage she can take.</FONT></B></I><I><B><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">&nbsp; </FONT></B></I><I><B><FONT class="Comic-Sans16" FACE="Comic Sans MS" SIZE="3"><BR>Whatever the case, we are blessed to have such an enjoyable person in our guild.&nbsp; She makes us laugh, laugh, laugh.&nbsp; She can also backstab the heck out of some unsuspecting creatures.&nbsp; One other thing that comes to mind with Nakkou, she seems to love ice.&nbsp; Upon entering the Dwarven city in Velious, Nakk became very addicted to ice and skating on it.&nbsp; This unfortunetly led to a fall in the caverns, a port to WC (where we pivked up Balta), port to Gfay to the Tree City of Woodelves, back to iceclad (where Balta found a large cliff and died), back to Thurgardin, and finally camping 3-4 hours later.&nbsp; Now of course none of this was Nakk's fault, she just started a very long night of ummmmm fun?&nbsp; Anyway, Nakkou we love having you in the guild, you bring laughter and joy to us all.&nbsp; Oh by the way, STAY AWAY FROM CLIFFS AND BRIDGES!!!!!!!</FONT></B></I></DIV></TD></TR></DIV></TABLE>
</DIV>
