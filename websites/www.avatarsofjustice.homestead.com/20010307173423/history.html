<DIV style="margin-top: 1px; margin-left: 1px">
<IMG SRC="http://track.homestead.com/~site/Scripts_Track/track.dll?H_H=5811511&H_P=1&H_A=10115141&H_I=124&H_U=5077321&E=51" WIDTH=80 HEIGHT=50 BORDER=0></DIV>
<DIV style="margin-top: 558px; margin-left: 150px">
<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=506><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=1169><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Many moons ago, there ruled a wise king by the name of Aramon who ruled the northern land, now known as EverFrost.&nbsp; Aramon had lived a long and prosperous life, ruling his kingdom with his beautiful wife Ehlonna and his two sons, Heironeous and Hextor.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Aramon felt that having two sons meant that his respected reign of EverFrost would continue on, leaving his legacy behind.&nbsp; However, his two sons were very different in nature.&nbsp; </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Young Heironeous was the strong leader type who carried his fathers code of ethics with him in all that he did.&nbsp; He strived to be the best he could be in every task he set his mind to; relishing in the lavish attention his father gave to him.&nbsp; His love for others, and his ability to reach the people, quickly made him popular throughout the land.&nbsp; All this attention however did not not please his brother Hextor very well, causing sibling rivalry of the worst kind.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Hextor was most unlike his brother and consequently was scolded for not living up to his fathers expectations.&nbsp; Knowing how his father felt about Heironeous and how well he admired him, Hextor began to develop an enormous amount of rage and jealousy towards his brother.&nbsp; His ferocity burned deep within him causing him to lash out at his brother whenever the chance arose.&nbsp; </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">At his wits end, Aramon sent Hextor away for schooling in the arts of magik.&nbsp; Knowing his son's love for the magik arts he felt as though this would help to occupy Hextor's time and keep him out of trouble.&nbsp; Hextor welcomed his time away from his brother and advanced rather quickly in his class.&nbsp; It wasn't long before his mischievious side arose, causing him to use his talent in magik for pranking the local villagers, getting him into constant trouble.&nbsp; Soon, his pranks and secretive practicing of arcane magik led to his explulsion from the magik guild, returning him home to deal with his fathers wrath.&nbsp; Knowing how upset his father would be if he learned what he had done,&nbsp; Hextor vanished and was never to be heard from again.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">One day, King Aramon fell ill to a plague which had been spreading all throughout Norrath.&nbsp; Knowing he was going to die, Aramon gathered the elders of The Tribunal and held a meeting as to who would take the throne when he died.&nbsp; Since noone had heard from Hextor in several years King Aramon and the elders collectively decided that young Heironeous would take the crown and become the next ruler of EverFrost.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Soon after Aramon's passing, Heironeous agreed to take the his fathers crown and his place upon the throne.&nbsp; He ruled the land in the same light as his father and made sure that all the people in his kingdom were well taken care of.&nbsp; Adored and respected, word spread quickly throughout the land of the new king.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Meanwhile, in the darkest corners of Toxx Forest, one of Hextor's messengers brought news of his dear brothers &#034;good fortune&#034;.&nbsp; Enraged at his brothers betrayal of taking the crown, Hextor plotted the downfall of his brothers kingdom&nbsp; He quickly assembled a legion of the most vile beings to ever walk the face of Norrath and ordered them to wreak wherever they went.&nbsp; His army tormented poor travelers, burned villages to the ground, and slaughtered many men, women, and children.&nbsp; Mastering the art of arcane magik, Hextor was nearly instoppable.&nbsp; His reign of tyranny quickly gained him such nicknames as, The Dark One and The Lord of Trickery.&nbsp; His grip slowly tightened around his brothers kingdom, bringing him closer and closer to his goal.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Realizing that the king was in grave danger, the elders quickly gathered and told Heironeous they needed to speak with him concerning a particular secret society his father was once the leader of.&nbsp; They went on to tell him about the Avatars of Justice and how his father had created them many years ago as a defense against evil.&nbsp; Each avatar had a secret identity and purpose within the guild, unknown to outsiders.&nbsp; They informed King Heironeous that his kingdom, not to mention his very life, was in danger and that he would have to lead the avatars into battle himself if he wanted his kingdom to be saved.&nbsp; Heironeous knew what he had to do and was quickly sworn in by the elders as leader of the avatars...</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Hextor was rapidly advancing upon his brother, destroying all who crossed his path.&nbsp; Feeding upon his victims fear, his powers seemed to get stronger and stronger. Soon he would have his vengeance and take his place at the throne.&nbsp; Hextor knew his brother had no clue who was terrorizing the land and had the perfect opportunity to use his long leave of absense as a means to get inside the castle and destroy the kingdom from within.&nbsp; He would play the role nicely as the bewildered prince who finally found his way home after being away for so long.&nbsp; Neither the guards, the elders, and least of all Heironeous would have a clue that he was behind the terror destroying the land.&nbsp; He could literally walk right up to them and go untouched.&nbsp; How could they turn down a prince of royalty?</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=right><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">(Continued on page </FONT><A HREF=history2.html TARGET="_parent"><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">2</FONT></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">...)</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV></TD></TR></DIV></TABLE>

<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=506><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=284><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Scribed upon this tome lie the written translations of earlier recorded documentation concerning the origin and background of the avatars.&nbsp; The pages had to be re-written and translated for universal understanding because the majority of the history that took place reached far back to the era of runes.&nbsp; This form of handwriting allowed for a vast variety of diverse peoples to record their writings in secret; knowing only certain groups could understand them.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Sadly, due to the horrific war between the avatars and the Legion of Improbity, many of these pages were lost throughout Norrath.&nbsp; The council elders of The Tribunal secretly dispatched several brave adventurers to find these pages and quickly return them to their rightful home.&nbsp; Generations of avatars devoted their very lives to finding these pages to keep them from the wrong hands.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Even now, the avatars continue their search for the remaining pages still missing throughout the lands in Norrath.&nbsp; A new generation of avatars have been handed the torch to continue the quest for these pages.&nbsp; Only through perseverance and their knowledge of the land will they attain their goal of gathering the remaining pages.&nbsp; Only then will their quest be complete...</FONT></DIV></TD></TR></DIV></TABLE>
</DIV>
