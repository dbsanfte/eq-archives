<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=554><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=537><DIV align=left><U><B><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">Saturday, February 24th</FONT></B></U><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">&nbsp; -</FONT></DIV><DIV align=left><B><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="1">(submitted by </FONT></B><A HREF=mailto:kindredjedi@charter.net TARGET="_parent"><B><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="1">Joreth</FONT></B></A><B><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="1">)</FONT></B></DIV><DIV align=left><B><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="1"><BR></FONT></B></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Greetings and well met everyone.&nbsp; It is with a heavy heart that I post this, my final message on this website.&nbsp; I have not chosen to leave the guild by any means, but have decided to move the website to a new location.&nbsp; I have been working on a new site, familiar in content, that should be much much cleaner and easier to navigate about.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">As many of you may know, along with the change in the guilds current location on the WWW, there are many changes which will be taking place within the guild.&nbsp; Kind of a makeover if you want to call it that.&nbsp; I will share all those details with you all as they are put to action, but for now I ask that you all check out the following link and cruise through the site and let me know what you think;</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=center><A HREF=http://aoj.moonfruit.com TARGET="_parent"><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">http://aoj.moonfruit.com</FONT></A></DIV><DIV align=center><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">I am still working very heavily on the site to incorporate all the new changes (methods and conditions of guild recruitment, guild council creation, guild raids, festivals, contests, etc).&nbsp; I am also still in the process of adding physical elements to the website itself, like images etc.&nbsp; Also, you will need to have Macromedia Flash to view the website.&nbsp; If you dont have it, you can download it </FONT><A HREF=http://www.macromedia.com TARGET="_parent"><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">here</FONT></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">.&nbsp; This page will be taken down in the next 7-10 days so please pass the URL around to everyone so they will know where to look for the new site.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Officers, please email me with the name/race/class of every member you recruit.&nbsp; If you can get their email address, that would help as well so I can welcome them and send them the URL to the guild's new website.&nbsp; My email address has changed due to getting cable modem, so please send your emails to&nbsp; </FONT><A HREF=mailto:kindredjedi@charter.net TARGET="_parent"><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">kindredjedi@charter.net</FONT></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">.&nbsp; Keep up the great work guys!</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Anyway, check out the site and let me know what you all think.&nbsp; I value your opinions very much, and would love to hear your input.&nbsp; After all, this guild is your guys' home and you should feel exactly like that... at home.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Warmest regards,</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Joreth Macleod</FONT></DIV></TD></TR></DIV></TABLE>
</DIV>
