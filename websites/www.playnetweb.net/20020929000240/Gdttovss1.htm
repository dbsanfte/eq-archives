<SCRIPT LANGUAGE="JAVASCRIPT">
// Version 1.0, basee sur profil
var called=false;

function calcul(){
var Base ;
var Niveau ;
var Total ;
var BaseMana = 0 ;
var Mana200 = 0 ;
var Mana255 = 0 ;

called=true;

// Lecture des donnees
Base = Math.round(document.perso.base.value) ;
Niveau = Math.round(document.perso.niveau.value) ;
Total = Math.round(document.perso.total.value) ;

// Calcul Base Mana
BaseMana = Math.round(((Base/5)+2)*Niveau);
document.perso.manabase.value = BaseMana ;

// CALCUL Mana Base 200 et 255

if ( Total > 200 ) 
{
Mana200 = Math.round((200-Base)/5*Niveau);
Mana255 = Math.round((Niveau+1)/10*(Total-200));
}
else
{
Mana200 = Math.round((Total-Base)/5*Niveau);
}
BaseMana = BaseMana+Mana200+Mana255 ;
// Affichages
document.perso.mana200.value = Mana200;
document.perso.mana255.value = Mana255;
document.perso.tmana.value = BaseMana;

}

var isIE = document.all?true:false;
var isNS = document.layers?true:false;
function onlyDigits(e) {
  var _ret = true;
  if (isIE) {
    if (window.event.keyCode < 46 || window.event.keyCode > 57) {
      window.event.keyCode = 0;
      _ret = false;
    }
  }
  if (isNS) {
    if (e.which < 46 || e.which > 57) {
      e.which = 0;
      _ret = false;
    }
  }
  return (_ret); 
}
