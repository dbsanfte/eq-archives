function Member(name, mclass, level60, epic)
{
	this.name = name;
	this.mclass = mclass;
	this.level60 = level60;
	this.epic = epic;
	if (arguments.length == 5) {
		this.officer = arguments[4];
	} else {
		this.officer = 0;
	}
}

function AlternateMember(name, mclass, level, primary) 
{
	this.name = name;
	this.mclass = mclass;
	this.level = level;
	this.primary = primary;
}

function CreateAlternateTable()
{
	if (alternate_members.length == 0) {
		document.write("<P align=center><B><FONT color=BLACK>No alternate characters of members currently listed.</FONT></B></P>");
		return;
	}
	
	// document.write('<TABLE border=1 cellpadding=3 width="80%" align=center bgcolor=#990000 bordercolorlight=#BB00000 bordercolordark=#500000>');
	document.write('<TABLE border=1 cellpadding=3 align=center bgcolor=#990000 bordercolorlight=#BB00000 bordercolordark=#500000>');
	document.write("<TR bgcolor=BLACK>");
	document.write("<TD align=middle>Name</TD>");
	document.write("<TD align=middle>Class</TD>");
	document.write("<TD align=middle>Level</TD>");
	document.write("<TD align=middle>Alternate of:</TD>");
	document.write("</TR>");

	for (floop = 0; floop < alternate_members.length; floop++) {
		if (floop != 0) 
			document.write("<TR>");		
		document.write("<TD>", alternate_members[floop].name,"&nbsp;</TD>");
		document.write("<TD>", classes[alternate_members[floop].mclass],"&nbsp;</TD>");
		document.write("<TD>", alternate_members[floop].level, "&nbsp;</TD>");
		document.write("<TD>", alternate_members[floop].primary, "</TD>");
		document.write("</TR>");
	}

	
	document.write("</TABLE>");
	document.write("<FONT color=BLACK><P align=center><B>Total number of alternate characters: ")
 	document.write(alternate_members.length);
	document.write("</B></P></FONT>");
}
