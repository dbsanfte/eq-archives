function Member(name, mclass)
{
	this.name = name;
	this.mclass = mclass;

		this.officer = arguments[2];
	} else {
		this.officer = 0;
	}
}

// MV
function SecondaryMember(name, mclass, level, primary) 
{
	this.name = name;
	this.mclass = mclass;
	this.level = level;
	this.primary = primary;
}

function TrialMember(name, mclass, end, status, key_sebelis, key_charasis, key_cs, fr, cr, pr) 
{
	this.name = name;
	this.mclass = mclass;
	this.end = end;
	this.status = status;
	this.key_cs = key_cs;
	this.key_sebelis = key_sebelis;
	this.key_charasis = key_charasis, 
	this.fr = fr;
	this.cr = cr;
	this.pr = pr;
}

{
	this.name = name;
	this.mclass = mclass;
	this.level = level;
	this.primary = primary;
}

// MV

{
	this.name = name;
	this.mclass = mclass;
	this.sdate = sdate;
}

// MV

{
	this.name = name;
	this.mclass = mclass;
	this.sdate = sdate;
}

function TickOrBlank(i)
{
	if (i != 0) 
	{
		document.write('<TD align=center valign=center><IMG src="tick.gif"></TD>');
	} else 
	{
		document.write("<TD>&nbsp;</TD>");
	}
}


function CreateMemberTable()
{
	var tcol = 0;
	document.write("<TABLE border=0 align=center><TR>");

	for (cloop = 0; cloop < 14; cloop++) {
		tcol = (cloop == tableSplit); 
		if ((cloop == 0) || tcol) {
			if (tcol) 
				document.write("</TABLE></TD>");
			document.write("<TD valign=top>");
			document.write('<TABLE border=1 cellpadding=3 bgcolor=#990000 bordercolorlight=#BB00000 bordercolordark=#500000>');
			document.write("<TR bgcolor=BLACK>");
			document.write('<TD align=middle width="10%">Class</TD>');
			document.write('<TD align=middle width="10%">Total</TD>');
			document.write("<TD align=middle>Name</TD>");
			document.write("</TR>");
		}
		var shortList = new Array();
		for (lloop = 0; lloop < members.length; lloop++) {		
			if (members[lloop].mclass == cloop) {
				shortList[shortList.length] = members[lloop];
			}
		}			
		if (shortList.length) {
			document.write("<TR><TD align=middle valign=middle rowspan=");
			document.write(shortList.length);
			document.write(">");
			document.write(classes[cloop], "</TD>");
			document.write("<TD align=middle valign=middle rowspan=", shortList.length, ">");
			document.write(shortList.length, "</TD>");

			for (sloop = 0; sloop < shortList.length; sloop++) {
				if (sloop != 0) 
					document.write("<TR>");
				document.write("<TD>");
				if (shortList[sloop].officer) 
					document.write("<B>");
				document.write(shortList[sloop].name);
				if (shortList[sloop].officer) 
					document.write("</B>");
				document.write("</TD>");
				document.write("</TR>");
			};
		}
		delete shortList;
	}
	document.write("</TD></TR></TABLE></TABLE>");
	
	document.write("<P align=center>");
	document.write("<FONT color=BLACK><P align=center><B>Total number of primary characters: ")
 	document.write(members.length);
	document.write("</B></P></FONT>");
	document.write("<P align=center>");
	document.write("<FONT color=BLACK><B>Bold text</B> indicates officers of Deadly Virtues.</FONT>");
	document.write("</P>");
	document.write("<BR>");

		
}
