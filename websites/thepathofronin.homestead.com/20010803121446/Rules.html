<TD><DIV align=center><B><FONT class="Helvetica24" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="5">Rules of Path of Ronin</FONT></B></DIV></TD>

<TD COLSPAN=2><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">1.&nbsp; Treat your fellow citisens of Norrath with Courtesy and Respect. Path of Ronin grown its roots of a all race and class guild bt we will nerver outgrow the guild the guild philosophy of &#034;Truth and Honor&#034;</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">2. All members, Regardless of real life age are expected to act with Maturity and to follow rule#1. Additionally, begging for chsh or items is not permitted in guild chat.(Use the auction section of the Path of Ronin message board to request items.)</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">3. ThePurpose of a guild is to bring players together for Camaraderie and fun, but expecialloy for raids the the Indicidual could not hope accomplish without the guilds help. The guild depends on the support of all of its members for the success of it raids. If a members is not on-line durring an official guild raid and the guild raid is of the apprepriate level for the guild raid, he is expected to be there.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">4. An item recived as part of an official guild raid, may not be sold or traded.When a members outgrows the item or leaves the guild, said item(s) must be given to an officer to distribute to other guild members.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">5. Members are not to use the /anon command. Instead use the /roleplay. Guild tags must be displayed at all times. Our &#060;Path of Ronin&#062; guild tag is a reminder to each of us that actions reflect upon the guild as a whole. More importantly, our guild tag is a banner telling Norrath that Path of Ronin is proub of its good name and its Tradition to others.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">6. After being in the Guild for 1 month, you need to check in at the forums every other week, to let Sior or Bamanorn know if your still active or alive for that matter :)</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">7. There is NO Harrassing other members. &#034;PERIOD&#034;</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">8. You must listen to the Officers, and Leaders</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">9. You can't say anything about the Path of Ronin's Allys</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">10. You must post something in the froums after joining</FONT></FONT></DIV></TD>
