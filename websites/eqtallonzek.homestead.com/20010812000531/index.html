<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=344><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=6860><DIV align=center><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Saturday June 2, 2001</FONT></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">GM EVENT:</FONT></B></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></B></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">On 05/23/2001 </FONT><I><FONT COLOR=#ff9900><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">(23.5.01 for you brits)</FONT></FONT></I><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">,&nbsp; A group</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">including myself, and 3 other elvish races were in a</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">battle with many dark elves near the entrance to</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Nektulos forest in the East Commonlands. The fighting</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">went on for endless minutes, Each side fought very</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">bravely, when suddenly, a strange wind began to blow</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">from the north, A wind smelling of death. </FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">A shout from my commrades informed me that there was a</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Dark Elvish Dragoon named R'Vylan. and a Dark Elvish</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Guard named G'rorn, were running out from the tunnel</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">to the Commons. Turning to look, I noticed them! Full</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">plated Dark ones with green names rushing towards us!</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">They cut through my group, leaving me standing there</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">for a moment, surrounded by many dark ones. I shouted</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">a praise to my god, and began swinging for dear life.</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">After I awoke, without clothing, food or drink, I</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">surveyed the damage of the commons. </FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">The Dragoon and Guard had rallied all they could find</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">to destroy all other races in the commonlands, they</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">spread their Wrath across the Commonlands and reached</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">as far outward as Kithicor before they were thwarted</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">by other players. The damage was done however, and</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">many innocent people lost thier lives. </FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">The dark races continued their fury even without their</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Guards, and travel through the commonlands was</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">virtually impossible for hours. </FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Qalaman Everlove</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Proud Husband of Jazzemen Everlove</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Officer/Spirit of the Dragons</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Honored Paladin of Tunare 25th Season</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><I><FONT COLOR=#ff9900><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">That event was much fun. Sorry I couldn't put it up on</FONT></FONT></I></DIV><DIV align=center><I><FONT COLOR=#ff9900><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">the page sooner, but I was occupied with my war of</FONT></FONT></I></DIV><DIV align=center><I><FONT COLOR=#ff9900><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">freeport. I also was at this event. However, since I</FONT></FONT></I></DIV><DIV align=center><I><FONT COLOR=#ff9900><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">was with a low leveled character I just watched.</FONT></FONT></I></DIV><DIV align=center><I><FONT COLOR=#ff9900><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">Anyway, thanks a lot Qalaman.</FONT></FONT></I></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Monday May 28, 2001</FONT></FONT></B></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></B></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">War of Freeport!</FONT></B></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Over 400 people attended and the war rivaled all in server history! </FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">In the West Commonlands:</FONT></B></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">The Shorties lead by the liberation of the underfoot, defeated a elven team lead by the Takish-Hiz. </FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">In the East Commonlands:</FONT></B></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">The darkies beat the humans back into Freeport. We fought hard and my group and Canizi's kept the tunnel in human hands until our force of 12 was overwhelmed by 6-7 darkie groups that were finshing off the remaining human resistance in the zone. </FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">In Freeport:</FONT></B></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">The humans defended their city. They were lead by a series of charges made by Rallas of The Human Retrebution </FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><I><FONT COLOR=#ff9900><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">All in all the war was much fun. In a month or so I will be having another war. However, this time it will be for BB Mts. in Faydwer. What do you guys think of my choice for my 2nd war. I thank you all for the huge turn out!</FONT></FONT></I></DIV><DIV align=center><I><FONT COLOR=#ff9900><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></I></DIV><DIV align=center><I><FONT COLOR=#ff9900><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">P.S. I was there as Raoa.</FONT></FONT></I></DIV><DIV align=center><I><FONT COLOR=#ff9900><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></I></DIV><DIV align=center><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Wednesday May 23, 2001</FONT></FONT></DIV><DIV align=center><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></FONT></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Human Retrebution changes policy:</FONT></B></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Today, the Human Retrebution announced a change in policy. The changes regarded tags and player made rules. Visit their website for more details</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Detials on the New Server:</FONT></B></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Offical news state that the new server will be open in a &#034;couple of weeks&#034;. The server will be deity based, unlike Tallon and Vallon Zek, which are race war servers. The new server will reportly not allow cross teaming (w00t!) and will allow unlimted PvP. In other words a level 60 can kill a level 1. </FONT></DIV><DIV align=center><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></FONT></DIV><DIV align=center><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Wenesday May 23,2001</FONT></FONT></DIV><DIV align=center><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></FONT></DIV><DIV align=center><FONT COLOR=#339966><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Here are some battle planes for the upcoming battle:</FONT></FONT></DIV><DIV align=center><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></FONT></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">STARTING LOCATIONS:</FONT></B></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Humans - In the sand, EC, near the FP zone line.</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Darks - In EC, at the Tunnel to Nek Forest (of course).</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Shorts - In WC, by the zone to Kith Forest.</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Elves - In WC, By the entrance of Befallen, the ancient home of the elves.</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">With Darks and Humans being the largest of the teams, and the closeness of their starting points, this will probably be the heart of the war, with the shorts and elves that show up being a side-show. Will the elves and shorts just attack each other IN WC, with the winner moving on to take on whats left of the humans or darks, or move in on the darky rear... Who knows&nbsp; </FONT></DIV><DIV align=center><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></FONT></DIV><DIV align=center><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Monday May 21, 2001</FONT></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Okay, just a few clearifications;</FONT></DIV><DIV align=center><I><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">1) Although I want you to RSVP there wil be &nbsp; &nbsp; &nbsp; &nbsp;&nbsp; &#034; walk-ins&#034;</FONT></I></DIV><DIV align=center><I><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">2) Please follow all rules of the server (player and Verant made)</FONT></I></DIV><DIV align=center><I><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">3) After you die, you </FONT></I><I><B><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">MUST</FONT></B></I><I><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"> loot and scoot to North Ro, or Freeport.</FONT></I></DIV><DIV align=center><I><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></I></DIV><DIV align=center><I><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">4) Just&nbsp; reminder </FONT></I><I><B><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">PLEASE RSVP</FONT></B></I><I><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"> so I know if we will get enugh people for a good battle.</FONT></I></DIV><DIV align=center><I><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></I></DIV><DIV align=center><I><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">5) This is not only a lightie verus darkie event. I would not mind if a 1 team guild comes in at the&nbsp; middle of the battle and kills all. It adds a whole new favour to the battle. </FONT></I></DIV><DIV align=center><I><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></I></DIV><DIV align=center><I><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">6) I invite all the come!</FONT></I></DIV><DIV align=center><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></DIV><DIV align=center><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Sunday May 20, 2001</FONT></FONT></DIV><DIV align=center><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></FONT></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">The Battle for Freeport:</FONT></B></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">The City of Freeport has been under darkie siege sinde the start of this server. Many lighties have lost their lives just by walkign a few steps away from the safety of the city guards. So I declare that the should be a major war in and around Freeport.&nbsp; The War of Freeport which it shall be named should not be one battle but a series of battles and different occasions.&nbsp; Why have a series of minor 3 on 3 PvP fighties when we can have 50-100 people fighting for the city and land they hold dearly? </FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><I><FONT COLOR=#3333cc><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">The War Shall begin on:</FONT></FONT></I></DIV><DIV align=center><I><FONT COLOR=#3333cc><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">Sunday May 27, 2001</FONT></FONT></I></DIV><DIV align=center><I><FONT COLOR=#3333cc><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">6:00 pm EST. </FONT></FONT></I></DIV><DIV align=center><I><FONT COLOR=#3333cc><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">In the East Commonlands.</FONT></FONT></I></DIV><DIV align=center><I><FONT COLOR=#3333cc><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">Please RSVP, ASAP! </FONT></FONT></I></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">If you miss the battle don't worry because like I said before, this will be a </FONT><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">WAR</FONT></B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">! I invite all members of this fine server, and guilds to come for this event. </FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Thursday May 17, 2001</FONT></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">I am sorry about the lack of updates people. I have gotten plenty of news so read on. </FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">On Monday Night:</FONT></B></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">The Human Retrebution raided HHP. The raid was manily for exp. but they managed to kill a couple of shorties and a few darkies. </FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">On Wednesday Night:</FONT></B></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">The Human Rerebution had a guild meeting 27 members attended and for the span of 4 hours there were no non-humans in Qeynos! I&nbsp; have screens of the event which I will put up tommorrow.</FONT></DIV><DIV align=center><I><FONT COLOR=#ff9900><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></I></DIV><DIV align=center><I><FONT COLOR=#ff9900><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></I></DIV><DIV align=center><I><FONT COLOR=#ff9900><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"> The HR is alive and kicking. So shorties, sorry they are not going anywhere</FONT></FONT></I></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></B></DIV><DIV align=center><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></FONT></DIV><DIV align=center><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Monday May 14, 2001</FONT></FONT></DIV><DIV align=center><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></FONT></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Takish-Hiz's Policy</FONT></B></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></B></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Lets get a few things straightened out about Takish-Hiz's PvP Policy. This should clear up all of your questions regarding how we treat Non-Elves. I have Talked with Morrith ( Our leader ) about this.</FONT></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></B></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Their definitions:</FONT></B></DIV><DIV align=center><FONT COLOR=#3333cc><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">FIRST - a few definitions as seen by Takish-Hiz members.</FONT></FONT></DIV><DIV align=center><FONT COLOR=#3333cc><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"> PK Guild = A guild whos ONLY PURPOSE is to kill anyone not on thier Team.</FONT></FONT></DIV><DIV align=center><FONT COLOR=#3333cc><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"> Pk'er = Someone whos ONLY PURPOSE is to kill anyone not on thier team. Usually a Secondary character.</FONT></FONT></DIV><DIV align=center><FONT COLOR=#3333cc><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"> KOS Guild = Killing on sight anyone who is not on your team</FONT></FONT><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">.</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Takish-Hiz is neither of these types of guilds. We are a 1-TEAM Only guild whos first interest is PvE but we have no problems with killing Non-Elves. We only want Main Characters to join our guild( PK'ers are usually secondary characters - this is why we are not a PK Guild. We usually point PK Elves to Fier'Dal Assassins ). Should any Elf be engaged in battle with a Non-Elf, all Takish-Hiz members will assist that Elf to kill the Non-Elf. Elves come first. As for the Random Non-Elf minding thier own business, all I have to say is keep on your toes. At any given time a Takish-Hiz member may (or may not) attack ANY Non-Elf.</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Call us what you want. We know what we are and we know what we aren't.</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">I hope this answers your questions. If you are an Elf and this sounds like a good pilicy to you then click on the 'Takish-Hiz' picture in my signature. PK'ers need not bother.</FONT></DIV><DIV align=center><I><FONT COLOR=#ff9900><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></FONT></I></DIV><DIV align=center><I><FONT COLOR=#ff9900><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Thanks Splintyr! That clears a lot up.</FONT></FONT></I></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Monday May 14, 2001</FONT></FONT></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></B></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">From Totenkof:</FONT></B></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Well folks, on Thursday I celebrate my last birthday.</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">I will be 39.</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">To mark this auspicious occasion I would like to offer up an RP event.</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">I propose that this weekend sometime (Time TBD) I be 'arrested' by Elven Empire, Hashish Whatever, and/or Feir'dal Assassins and sentenced to execution for 'Crimes against Elvanity.'</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">The execution will take place in the Arena.</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">The shorts and any 'supporters' (HR?) would have one hour prior to the scheduled execution to abscond me from the arena (group with me and port me out.)</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Since faction is no longer an issue any and all players (light and dark) are welcome to show up for a bloodbath.</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">If there is interest I will develop a story to support it and post it here.</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Any elven guilds wanna execute me?</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Any shorts wanna try and save me</FONT><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">? </FONT></B></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></B></DIV><DIV align=center><I><FONT COLOR=#ff9900><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">Seems like fun! I will try to get a hold of Totenkof to find out the time, and the location.</FONT></FONT></I></DIV><DIV align=center><I><FONT COLOR=#ff9900><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></I></DIV><DIV align=center><B><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Monday May 14, 2001</FONT></FONT></B></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Wow! A lot more people then I expected are coming to the site. I would like to thank Everquest Links for adding us to their data base.&nbsp; In other news, I am looking for writers to write articles, and I want fans to report raids that they are planning and/or a summary of the events of a recent raids.&nbsp; I am also considering a History section. In this section, we can remember the great raids of the past. From, the battle for the Highpass, various massive raids on Freeport, we can remember the &#034;good old days&#034;. &nbsp; </FONT></DIV><DIV align=left><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><B><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></FONT></B></DIV></TD></TR></DIV></TABLE>
</DIV>
