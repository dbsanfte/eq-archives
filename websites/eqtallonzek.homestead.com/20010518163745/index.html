<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=344><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=3424><DIV align=center><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Thursday May 17, 2001</FONT></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">I am sorry about the lack of updates people. I have gotten plenty of news so read on. </FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">On Monday Night:</FONT></B></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">The Human Retrebution raided HHP. The raid was manily for exp. but they managed to kill a couple of shorties and a few darkies. </FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">On Wednesday Night:</FONT></B></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">The Human Rerebution had a guild meeting 27 members attended and for the span of 4 hours there were no non-humans in Qeynos! I&nbsp; have screens of the event which I will put up tommorrow.</FONT></DIV><DIV align=center><I><FONT COLOR=#ff9900><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></I></DIV><DIV align=center><I><FONT COLOR=#ff9900><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></I></DIV><DIV align=center><I><FONT COLOR=#ff9900><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"> The HR is alive and kicking. So shorties, sorry they are not going anywhere</FONT></FONT></I></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></B></DIV><DIV align=center><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></FONT></DIV><DIV align=center><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Monday May 14, 2001</FONT></FONT></DIV><DIV align=center><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></FONT></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Takish-Hiz's Policy</FONT></B></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></B></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Lets get a few things straightened out about Takish-Hiz's PvP Policy. This should clear up all of your questions regarding how we treat Non-Elves. I have Talked with Morrith ( Our leader ) about this.</FONT></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></B></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Their definitions:</FONT></B></DIV><DIV align=center><FONT COLOR=#3333cc><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">FIRST - a few definitions as seen by Takish-Hiz members.</FONT></FONT></DIV><DIV align=center><FONT COLOR=#3333cc><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"> PK Guild = A guild whos ONLY PURPOSE is to kill anyone not on thier Team.</FONT></FONT></DIV><DIV align=center><FONT COLOR=#3333cc><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"> Pk'er = Someone whos ONLY PURPOSE is to kill anyone not on thier team. Usually a Secondary character.</FONT></FONT></DIV><DIV align=center><FONT COLOR=#3333cc><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"> KOS Guild = Killing on sight anyone who is not on your team</FONT></FONT><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">.</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Takish-Hiz is neither of these types of guilds. We are a 1-TEAM Only guild whos first interest is PvE but we have no problems with killing Non-Elves. We only want Main Characters to join our guild( PK'ers are usually secondary characters - this is why we are not a PK Guild. We usually point PK Elves to Fier'Dal Assassins ). Should any Elf be engaged in battle with a Non-Elf, all Takish-Hiz members will assist that Elf to kill the Non-Elf. Elves come first. As for the Random Non-Elf minding thier own business, all I have to say is keep on your toes. At any given time a Takish-Hiz member may (or may not) attack ANY Non-Elf.</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Call us what you want. We know what we are and we know what we aren't.</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">I hope this answers your questions. If you are an Elf and this sounds like a good pilicy to you then click on the 'Takish-Hiz' picture in my signature. PK'ers need not bother.</FONT></DIV><DIV align=center><I><FONT COLOR=#ff9900><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></FONT></I></DIV><DIV align=center><I><FONT COLOR=#ff9900><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Thanks Splintyr! That clears a lot up.</FONT></FONT></I></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Monday May 14, 2001</FONT></FONT></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></B></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">From Totenkof:</FONT></B></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Well folks, on Thursday I celebrate my last birthday.</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">I will be 39.</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">To mark this auspicious occasion I would like to offer up an RP event.</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">I propose that this weekend sometime (Time TBD) I be 'arrested' by Elven Empire, Hashish Whatever, and/or Feir'dal Assassins and sentenced to execution for 'Crimes against Elvanity.'</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">The execution will take place in the Arena.</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">The shorts and any 'supporters' (HR?) would have one hour prior to the scheduled execution to abscond me from the arena (group with me and port me out.)</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Since faction is no longer an issue any and all players (light and dark) are welcome to show up for a bloodbath.</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">If there is interest I will develop a story to support it and post it here.</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Any elven guilds wanna execute me?</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Any shorts wanna try and save me</FONT><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">? </FONT></B></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></B></DIV><DIV align=center><I><FONT COLOR=#ff9900><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">Seems like fun! I will try to get a hold of Totenkof to find out the time, and the location.</FONT></FONT></I></DIV><DIV align=center><I><FONT COLOR=#ff9900><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></I></DIV><DIV align=center><B><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Monday May 14, 2001</FONT></FONT></B></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Wow! A lot more people then I expected are coming to the site. I would like to thank Everquest Links for adding us to their data base.&nbsp; In other news, I am looking for writers to write articles, and I want fans to report raids that they are planning and/or a summary of the events of a recent raids.&nbsp; I am also considering a History section. In this section, we can remember the great raids of the past. From, the battle for the Highpass, various massive raids on Freeport, we can remember the &#034;good old days&#034;. &nbsp; </FONT></DIV><DIV align=left><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=center><B><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Sunday May 13, 2001</FONT></FONT></B></DIV><DIV align=left><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">I have added the guilds page and a link to The Tallon Zek Times. Also, because of real life matters I missed the Dreadlands War. If anyone sends in a discribition of the events and/or screenshots I will be happy to write a news report on it.&nbsp; </FONT></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Saturday May 12, 2001</FONT></FONT></B></DIV><DIV align=center><B><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></B></DIV><DIV align=center><B><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">From Tfenen:</FONT></B></DIV><DIV align=center><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">I'm scheduling a massive PvP war in Dreadlands. I've been organizing for numerous guilds to come, including Chosen Blood, Stature of the Gods, Pahojen Kilta, Nox Noctis, Warlords of Zek, etc. It will be a blast.</FONT></DIV><DIV align=center><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=center><FONT COLOR=#3333cc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Server: Tallon Zek</FONT></FONT></DIV><DIV align=center><FONT COLOR=#3333cc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Time: Saturday, May 12, 4:00 PM EST</FONT></FONT></DIV><DIV align=center><FONT COLOR=#3333cc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Location: Dreadlands</FONT></FONT></DIV><DIV align=center><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">MELEES, BIND IN FIRIONA VIE PRIOR TO ENGAGING IN COMBAT, TO AVOID LONG CORPSE RUNS AND TO KEEP THE PVP COMING!</FONT></DIV><DIV align=center><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=center><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">BE THERE. THIS WILL BE THE EVENT OF A LIFETIME! JUST LIKE THE OLD MASSIVE TROLL/OGRE FREEPORT RAIDS! FOR THE FIRST TIME, NON-STOP 50+ PVP ACTION!!!</FONT></DIV><DIV align=center><B><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ff0033><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Saturday May 12, 2001</FONT></FONT></B></DIV><DIV align=left><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">I am pleased to announce to opening of the Tallon Zek Tribune. The site was recentely errected and is still under heavy contruction, but feel free to look around.</FONT></DIV><DIV align=center><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">the Dread</FONT></DIV></TD></TR></DIV></TABLE>
</DIV>
