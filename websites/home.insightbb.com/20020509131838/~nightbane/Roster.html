function generateTable()
{
	document.write( "<tr><td colspan=6 background=Graphics/Header.gif><FONT size=2><i><b>Roster</b></i></FONT></td></tr>" )
	document.write( leaderTable() )
	document.write( tableRows() )

	document.write( "<tr><td colspan=6><font size=2>* = Class Leader</font></td></tr></table>" )
}

function tableRows()
{
	var rows = ""

	rows = rows.concat( "<tr><td bgcolor="+colors[3]+">Bards</td><td bgcolor="+colors[3]+">Clerics</td>"
		+ "<td bgcolor="+colors[3]+">Druids</td><td bgcolor="+colors[3]+">Enchanters</td>"
		+ "<td bgcolor="+colors[3]+">Magicians</td><td bgcolor="+colors[3]+">Monks</td></tr>" )

	for( i=9; i > -1; i-- )
	{
		var currentrow = "<tr>" + tableElements( i, bards, clerics, druids, enchanters, magicians, monks ) + "</tr>"

		rows = rows.concat( currentrow )
	}

	rows = rows.concat( "<tr><td bgcolor="+colors[3]+">Necromancers</td><td bgcolor="+colors[3]+">Paladins</td>"
		+ "<td bgcolor="+colors[3]+">Rangers</td><td bgcolor="+colors[3]+">Rogues</td>"
		+ "<td bgcolor="+colors[3]+">Shadow&nbsp;Knights</td><td bgcolor="+colors[3]+">Shamans</td></tr>" )

	for( i=9; i > -1; i-- )
	{
		var currentrow = "<tr>" + tableElements( i, necros, paladins, rangers, rogues, sks, shamans ) + "</tr>"

		rows = rows.concat( currentrow )
	}

	rows = rows.concat( "<tr><td bgcolor="+colors[3]+">Warriors</td><td bgcolor="+colors[3]+">Wizards</td>"
		+ "<td bgcolor="+colors[3]+">Applicants</td><td bgcolor="+colors[3]+">MIA</td>"
		+ "<td bgcolor="+colors[3]+">Retired</td><td bgcolor="+colors[3]+"></td></tr>" )

	for( i=9; i > -1; i-- )
	{
		var currentrow = "<tr>" + tableElements( i, warriors, wizards, apps, MIA, retired, blank ) + "</tr>"

		rows = rows.concat( currentrow )
	}
	
	return rows
}

function tableElements( pos, struct1, struct2, struct3, struct4, struct5, struct6 )
{
	var elements = ""
	var color = "00004F"

	color = chooseColor( struct1[pos] )
	elements = elements.concat( "<td bgcolor="+ color +">"+ struct1[pos] + "</td>" )
	color = chooseColor( struct2[pos] )
	elements = elements.concat( "<td bgcolor="+ color +">"+ struct2[pos] + "</td>" )
	color = chooseColor( struct3[pos] )
	elements = elements.concat( "<td bgcolor="+ color +">"+ struct3[pos] + "</td>" )
	color = chooseColor( struct4[pos] )
	elements = elements.concat( "<td bgcolor="+ color +">"+ struct4[pos] + "</td>" )
	color = chooseColor( struct5[pos] )
	elements = elements.concat( "<td bgcolor="+ color +">"+ struct5[pos] + "</td>" )
	color = chooseColor( struct6[pos] )
	elements = elements.concat( "<td bgcolor="+ color +">"+ struct6[pos] + "</td>" )

	return elements
}

function chooseColor( str )
{
	if( str.indexOf( '*' ) != -1 )
	{
		return colors[2]
	}	

	if( str.length == 0 )
	{
		return colors[0]
	}
	else
	{
		return colors[1]
	}
}

function leaderTable()
{
	var output = ""

	for( i=0; i < leaders.length; i++ )
	{
		output = output.concat( "<tr><td colspan=2 bgcolor="+colors[3]+">"+ leaders[i] +"</td><td colspan=4 bgcolor="+colors[4]+">" 
			+ titles[i] +"</td></tr>" )
	}

	return output
}

function calcMembers()
{
	var memberTotal = 0

	memberTotal = len( bards ) + len( clerics ) + len( druids ) + len( enchanters ) 
		+ len( magicians ) + len( monks ) + len( necros ) + len( paladins ) + len( rangers ) 
		+ len( rogues ) + len( sks ) + len( shamans ) + len( warriors ) + len( wizards )

	var appnum = 0
	appnum = len( apps )

	var miaret = 0
	miaret = len( MIA ) + len( retired )

	return "<FONT size=2>Full Members: " + memberTotal + ", Applicants: " + appnum + ", MIA/retired: "+ miaret + "</FONT>"
}

function len( arr )
{
	var leng = 0

	for( i=0; i<arr.length; i++ )
	{
		if( arr[i].length != 0 ) { leng++ }
	}

	return leng
}
