// browser test:
browserName = navigator.appName;
browserVer = parseInt(navigator.appVersion);
if (browserName == "Netscape" && browserVer >= 4 || browserName ==
"Microsoft Internet Explorer" && browserVer >= 4)
version = "1";
else if (browserName == "Netscape" && browserVer >= 3)
version = "2";
else
version = "3";
if (version == "1") {
var correctwidth=1024
var correctheight=768
if (screen.width<correctwidth||screen.height<correctheight)
location="./html/lowres/indexlow.html"
else
location="indexhi.html"
}
if (version == "2") {
var toolkit = java.awt.Toolkit.getDefaultToolkit();
var screen_size = toolkit.getScreenSize();
var correctwidth=1024
var correctheight=768
if (screen_size.width<correctwidth||screen_size.height<correctheight)
location="../html/lowres/indexlow.html"
else
location="indexhi.html"
}
if (version == "3")
location="indexlow.html"
</SCRIPT>
</HEAD>
