  <TR>
    <TD bgcolor=#cccccc style="WIDTH: 310px" width=310>
      <P>The Fort Worth Stockyards were built in the 1800's as a central place to
      bring livestock (cattle and pigs) to market. The livestock came from all over
      the surrounding country and it was the second largest stockyard in the United
      States, after Chicago, the largest stockyard in the country. </P><P>There were many
      cowboys who drove the cattle across the prairies to here. There are still rodeos
      held here.</P>
      <P>&nbsp;</P>
    </TD>
  </TR>

  <!--==========================================================================
  SECOND "ROW" WITH IMAGE ON LEFT, TEXT ON RIGHT ->
  <TR>
    <TD BGCOLOR=#008080 style="WIDTH: 310px" width=310 VALIGN=top ALIGN=left><B>
      Move 'em in, move 'em out!
    </B></TD>
    <TD ROWSPAN=2 align=center>
      <IMG src="stock4.jpg" style="HEIGHT: 200px; WIDTH: 300px" width=300 height=200>
    </TD>
  </TR>
  <TR>
    <TD bgcolor=#cccccc style="WIDTH: 310px" width=310>
      <P>When the train came there were fewer cattle drives, but still lots of
      cowboys. When a trainload of livestock came in they were herded into pens
      and were inspected for quality. After being inspected they were herded through
      an underground tunnel to one of two meat packing plants.</P>
      <P>&nbsp;</P>
    </TD>
  </TR>

  <TR>
    <TD bgcolor=#cccccc style="WIDTH: 310px" width=310>
      <P>One of the interesting things about the Fort Worth Stockyards is that
      most of the ground was bricked. Here you can still see surviving bricks. This
      made it easier to keep everything clean.</P>
