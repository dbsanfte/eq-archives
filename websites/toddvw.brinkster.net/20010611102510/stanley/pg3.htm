  <TR>
    <TD bgcolor=#cccccc style="WIDTH: 310px" width=310>
      <P>Over the centuries six flags have flown over Texas: Spain, France, Mexico,
      Republic of Texas, Confederate States and the United States of America. All
      these different influences mean that Texas is a diverse place with many kinds
      of places to see and, of course, food to eat.</P>
      <P>One of the better types of food you can get is Texas barbecue. In Canada
      barbecue is usually simply grilled meat. In Texas it is a completely different
      deal.</P>
      <P>&nbsp;</P>
    </TD>
  </TR>

  <!--==========================================================================

  <TR>
    <TD bgcolor=#cccccc style="WIDTH: 310px" width=310>
      <P>The meat is smoked for many hours and has a very different taste.
      Texas is known worldwide for the quality of its barbecue</P>
      <P>Wow! This is the real stuff! Smoked meat, frito pie and a HUGE baked potato 
(it's bigger than I am!)</P>
      <P>&nbsp;</P>

  <TR>

      <P>After eating all that food I passed out and slept the day away. When

      works in downtown Fort Worth in a skyscraper.</P>
      <P>He spends many hours sitting in front of computer monitors, staring
