    <TD BGCOLOR=#008080 VALIGN=top ALIGN=left style="WIDTH: 310px" width=310><B>
      Out of the envelope!
    </B></TD>

  <TR>
    <TD bgcolor=#cccccc style="WIDTH: 310px" width=310>
      <P>It took almost a week to get to Texas by mail. It was pretty bumpy, but I made it. 
      I arrived on a Friday afternoon. Your Aunt Erin picked up the mail and found an 
      envelope with me inside. She knew that I was coming and had everything set up 
      for my stay.</P>
      <P>I met their cat, Seefer. She was very curious about me – she had never seen a 
      flat boy like me before. She kept sniffing me and trying to lick me. After she 
      figured out that I was not cat food, she started to purr and lie on her back. 
      It was very funny, but your Aunt Erin said that she does this when she is happy.</P>
      <P>&nbsp;</P>
    </TD>
  </TR>

  <!--==========================================================================
  SECOND "ROW" WITH IMAGE ON LEFT, TEXT ON RIGHT ->
  <TR>
    <TD BGCOLOR=#008080 style="WIDTH: 310px" width=310 VALIGN=top ALIGN=left><B>
      Hey! It's not all desert and cactus here!
    </B></TD>
    <TD ROWSPAN=2 align=center>
      <IMG src="river.jpg" style="HEIGHT: 200px; WIDTH: 300px" width=300 height=200>
    </TD>
  </TR>
  <TR>
    <TD bgcolor=#cccccc style="WIDTH: 310px" width=310>
      <P>I always thought that Texas was all desert and cactus, like in the
      cowboy movies. I thought I was going to be covered in sand all the time,
      but your Aunt and Uncle live in a river valley, where it is green at this
      time of year.</P>
      <P>In the middle of the summer, though, they say the river is very low
      and the plants are all dried out. I guess I came to visit at a good time.</P>
      <P>&nbsp;</P>
    </TD>
  </TR>

  <!--==========================================================================
  THIRD "ROW" WITH IMAGE ON LEFT, TEXT ON RIGHT ->
  <TR>
    <TD ROWSPAN=2 style="WIDTH: 310px" width=310 align=center>
      <IMG src="drive.jpg" style="HEIGHT: 200px; WIDTH: 300px" width=300 height=200>
    </TD>
    <TD BGCOLOR=#008080 VALIGN=top ALIGN=left style="WIDTH: 310px" width=310><B>
      Yahoo! Let's Drive!
    </B></TD>
  </TR>
  <TR>
    <TD bgcolor=#cccccc style="WIDTH: 310px" width=310>
      <P>I met your Uncle Todd that night when he came home from work. He was very tired, 
      but was happy to meet me. We had dinner and then I went to bed. I was also 
      very tired from the long journey.</P>
      <P>The next day, though, it was time to DRIVE. Texans LOVE to drive. There
      are roads everywhere and there are always people driving. There aren't as
      many buses or trains as in Canada so people drive much more.</P>
      <P>I got behind the wheel and ALMOST got to drive, but your Uncle Todd said "What
      the hay?" Oh well.<P>
      <P>&nbsp;</P>
    </TD>
  </TR>
