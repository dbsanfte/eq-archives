<html>
<head><title>View Event Schedule</title></head>
<body bgcolor="black" text="white" link="gray" vlink="white" alink="red">
<center><h3>Welcome to<BR>The Lost Cabal<br>Calendar of Events</h3></center>
<br><br>
<a href="getmonth.asp">Click here to view the current month</a><br><br>
Or choose a month and year to view below.<br>
<form action="viewmonth.asp" method="get">
<table border=0>
<tr>
	<td align=right><b>Year:</b></td>
	<td align=left><select name="yearnum">
				<option value="2001">2001
				<option value="2002">2002
				<option value="2003">2003
				<option value="2004">2004
				<option value="2005">2005
				</select></td>
	<td align=left><b>Month:</b></td>
	<td align=left><select name="monthnum">
				<option value="1">January
				<option value="2">February
				<option value="3">March
				<option value="4">April
				<option value="5">May
				<option value="6">June
				<option value="7">July
				<option value="8">August
				<option value="9">September
				<option value="10">October
				<option value="11">November
				<option value="12">December
				</select></td>
	<td align=right><input type="submit" value="Go"></td>
</tr>
</table>
</form>
</body>
</html>
