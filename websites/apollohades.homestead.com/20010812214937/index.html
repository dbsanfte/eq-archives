<DIV style="margin-top: 198px; margin-left: 243px">
<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=525><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=3344><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">At this point everyone knows that the quest has been completed, probably by about 10 - 20 high lvl shamans on each server. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">From a barbarian perspective let me add some info. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">1) first I killed some mage type pirate on seafuries island and the captain that drops the bracer of erollisi spawned out of his corpse. Then I killed the captain and a lesser spirit spawned immediately out of the corpse. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">2) said 'who are you' and followed dialogue till I got a gem. If you dont say 'who are you' you wont get anything from the spirit. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">3) take gem to ooglyn in eruds xing. Spawns beside the stone with faces on the sides furthest from the cat people. (not the one where wisps spawn, but the one further away from cat people, next to it. Hand gem to ooglyn and she takes off into the water. I dont have any locs because I honestly didn't write them down. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">4) 2 spirits will spawn after you sit for a while. keep conversing with all off them till abe the abandoned spawns. he waits a while then says something about returning a broken arrow. repeat the phrase he says to you and get the broken arrow. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">5) after all of them leave (they will try to get you to follow them but you shouldnt) you meet with a spirit again. hail and follow dialogue till you get another gem. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">6) head to west karana by the first guard tower and bandit farm. hang out here for up to 15 minutes till you see a dark colored wisp. I forget the name but when you see a dark wisp thats the one. Give the gem then follow conversation. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">7) head to rathe mountains and go to the nw corner of zone by a stone and kill tabien the goodly and loot his shield. (marrs promise?) Then go past hill giants and north from the innothule swamp zone to the ramparts in the middle of the big open field in the ne corner of the zone. Kill glaron the wicked and loot both woe and envy. Alternatively you can buy these from people as all 3 of these are not no drop. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">8) hand the 3 pieces to the dark wisp again in west karana (wandering soul?) and it will give you a text box about the shield of falsehood. Repeat the phrase with an open spot in your inventory. (shield is very large so doesnt fit in a backpack) You also get a gem here. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">9) you dont need to head directly to emerald jungle from here but in order, this is who you turn the next gem into. I personally turned in gem and dire pelt here the first time I came here but I'll tell the order how you should do it so you can decide for yourself. Give gem to sentinal spirit in the building in emerald jungle. There are 2 sentinal spirits in emerald jungle. One in a building and one by the lake. Hailing the building spirit will do nothing but hand in the gem and follow the bracket text. You eventually get to a point where he talks about a dark pointy ear and sends you off to mistmoore. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">10) head to mistmore with a good group of lvl 50-55s to be safe. You need to be lvl 52 or higher to pull the black dire alone (friends are lvl 38 and will jump you if you are below this level if you try to pull him). I ran across him when he was trained to zone so all I had to do was whoop his butt and not worry about his friends. I have never got any shaman spells off on the black dire both times I was in a group killing him so there may be a proximity of landing spells on him like fire giants. Get in melee range and have a good tank and cleric working him down is all I can say. Black dire wolf is lvl 45, hits for 200 damage and casts spells like a shadowknight, complete with a 400 damage harm touch or so. Like other lvl 45 mobs he only has about 4-6k hps though, so it isnt a very long fight at all as long as you dish out that kind of damage in an efficient manner. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">11) black fur boots - aka SoW boots. WOOT, personally best part of quest for ability to have sow UNMEMMED for once in your life, hehe. Turn in your black wolf pelt to the same sentinal spirit in emerald jungle you gave your gem to and he starts to talk about reports from city of mist. follow dialogue and you get a container with 6 slots. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">12) city of mist - solo about lvl 50, grouped you can do this at about lvl 47+. keep killing stuff in city of mist till you get 5 different writings. seem to be random from all the mobs in the zone here. One writing only comes from one mob in the temple on the right side of zone as you enter past the bridge. go thru bridge, kill the 3 mobs that guard there. head right till you pass under an archway and come to a temple with green water running down the side. kill the mob standing above the door by pulling with a slow spell or whatever. walk up to the door but dont open it, agro the first mob that is by the door by standing there and come back out and kill it. Proceed to pull mobs one or two at a time and kill them off till you clear the temple. Warning the bottom 3 mobs in the temple are always around lvl 40-45 with rare lvl 37ish mobs. Keep killing this temple for an hour or so till the named ghost spawns. Think name is something like lost soul or some lame ghost name. This guy has 2 writings on him. One is illegible scroll (dont need, goes straight to destroy button) other one you keep. While temple is clear, at the bottom of temple there is a door on the left. Inside is a bag on the ground. Pick this up. This is your high scale icon used later in the quest. Hopefully you'll get something nice during your stay here. I personally picked up a kunzar ku'juch and traded a warrior a pair of jb gaunts for it. Combine the 6 no drop lore items you get (not the illegible scroll) and you'll get some sort of full pack. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">13) Return full writings pack to the building spirit in emerald jungle and he'll talk about how you need to return the books from lord ghiosk and turn them into the spirit in the lake. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">NOW COMES THE HARD PART. Don't say I didn't warn you. Everything you've done up to this point was CAKE. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">14) Bring about 3 groups of lvl 50ish people or 2 groups of lvl 55ish people. maybe one group of lvl 60s. Bring them to city of mist for a reaver hunt. We personally pulled from the castle at the back of the zone but I hear you can go skyward to do this. (thought of falling off a ramp or something up there didnt appeal to me so we did castle). </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Get a reaver pulling action going till you have a single reaver pulled. If you have adds you might as well just zone because everyone will die. If you got a reaver alone you are cool. Black reavers hit for 155 (least one we had did) and spawn another either reaver, lord ghiosk, lord rek'ashiir, or lord neh'ashiir. We got lucky and had lord ghiosk spawn after first reaver when we went but i've heard of people going thru 10+ reavers before getting a named before. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">ONLY lord ghiosk is KOS and doesnt seem to attack when you fight mobs in the area but might attack if you get close enough. I also could not get any spells off on this guy but I assume you could probably land a few spells if you get close enough. This guy was a warrior mob and had tons of hitpoints when we killed him. He also started to run when we got him down so you need to get in melee range and nuke, ebolt when he gets really low. He also hit for 155 but didn't spawn anything after he died. have guild loot the mace of shadowed soul, or throneblade of ykesha and make sure you loot the 3 books he has on him. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Since you are already here with your guild, have the mages break out fire pets. lvl 49 ok, but 55 preferred. Keep killin reavers, named till you get lord rek'ashiir. This guy has a HUGE ae fire damage. We're talking like 2k in damage from a proc. Can also, not cast spells on this guy from a distance. Well probably can, but only like 2% would land if yer not in melee range. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Time his damage shield. I think it lasts 5 and a half minutes but you should time it yourself before attacking him. Wait till it has about 20 seconds before he recasts then have mages send fire pets in. You need at least 3 to 4 fire pets going on this guy (lvl 49) or 2 (lvl 55) fire pets. Have clerics chain healing their pet they have targeted and wait till lord gets down to 75% health or so before trying to help in the fight. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">when he gets down enough to where a slow spell wont agro him much, go in there and slow him. when he gets down to 30 or 40% get in there with a fire resist on and try to get an ebolt and plague off on him to help out. The clerics will be going oom about now so either help with damage or gheal or super heal some pets. This guy probably gates as he is a caster so you need to fight him close to where he spawns to avoid this. We found him on the right side of the path close to the castle when we went but I'm told he spawns out of reavers. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">He will drop some sort of writing that you need to loot. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">15) Go back to the pond spirit in emerald jungle and give it the 3 books you got from lord ghiosk and he'll send you to get an icon of high scale and give it to high scale kirn. Since you already have the icon you just need a bunch of uber pals to accompany you to the hole. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">16) Go to the hole, thru the city to the tower. (not the direction of master yael). Respawn time here is 6 minutes so if you cant handle it before you get to the tower, come back when you can. Pull everything from the tower and set timer for 3 minutes from time of pull before you have to talk to high scale kirn. Kill off pull fast with nukers and tanks. If you have 60% mana on clerics and necros yer good. if you killed everything around tower within 3 minutes head on up and give him the icon of the high scale you got from the temple in city of the mist. He will attack you after some dialogue. Loot the ring after his demise. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Take this ring to city of mist again (I know its a pain but you'll prolly get another mace of shadowed soul and make another sham in guild happy pullin reavers) Keep killin reavers till you get lord neh-ashiir(sp?) NOT the guy with the fire damage. This guy has some sort of poison damage so water pets would work here but you don't need to kill him. Give this guy the ring and he sends you to talk to lord rek'ashiir (the guy with fire damage) </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Again you can talk to rek'ashiir and kill him to make another sham in guild happy but you have to give rek'ashiir an item that neh'ashiir gives you. Rek'ashiir will tell you about his lost daughter or something and you need to go to plane of fear. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Plane of fear - by cazic temple. Guardians have place holders sometimes that are 'iksar child'. Kill the iksar child (one nuke can kill to avoid agro) and loot the tear. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Back to rek'ashiir one last time with the tear and give it to him and follow dialogue. This is where you are SUPPOSED to kill him so if you don't have a lot of shams in the guild you can just leave him alone till now. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">anyway, basically you take the writing that rek'ashiir (fire guy) had on him back to the pond spirit in emerald jungle and give it to him. Follow text till it gives the coveted [spear of fate] in brackets. Ask about spear of fate and voila, you have best sham weapon in the game with new clicky effect that stacks with all your other dots for free mana. This weapon has a good ratio, good stats, good resists, free damage clickable. This, combined with shield of falsehood and SoW boots make for a VERY happy shaman. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">So to recap heres things you have to kill </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">1) mage mob that is ph for capt surestout in oot. (lvl 20ish) </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">2) capt surestout in oot. (lvl 25ish?) </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">3) tabien the goodly in rm. (lvl 32ish?) </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">4) glaron the wicked in rm. (lvl 32ish?) </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">5) black dire wolf in mm. (lvl 45) </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">6) named ghost guy in temple on right side of com. (lvl 40ish) </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">7) lord ghiosk in com. (lvl 52?) </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">8) high scale kirn in the hole. (lvl 55?) </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">9) iksar child in pof. (lvl 10?) </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">10) lord rek'ashiir in com. (lvl 53?) </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Remember respectable levels of mobs does not mean difficulty of obtaining an item. For instance 3 full parties of lvl 45 - 50s got wiped out three times in city of mist by trained mobs when I was there. Once by rek'ashiir before I knew who he was and about fire pets. Once by black reaver puller who picked up 4 of black reavers friends on the way back to the camp site. And once by another guild trying to kill the lhanc guy in the middle of city of mist while we were setting up to pull lord ghiosk. They trained us bad by city of mists roaming agro problem. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">City of mist has a problem where mobs will stop what they are doing if they have a short agro list to attack anyone in melee range. Complete with, passing by people and adding them to hate list regardless of whether or not they actually attack you. Meaning by the time the mob gets back from being trained to zone, everything in the zone could be agro on you all the way skyward. When someone shouts 'train' in city of mist when your whole guild is there, you need to zone, period. The train will eventually get back to you and kill you. The only safe spot i've seen in city of mist is outside the temple to the right of the zone past the bridge, and thats too far to pull reavers too. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Another note about city of mist is everyone needs to NOT use area of effect spells. You will agro underground mobs and skyward mobs with these spells and you'll get your guild trained on. I've heard that sometimes single spawns in the hole can spawn up to 3 mobs but I can't verify this. I know that the non-mezzable mobs in the hole are the least of your worries in this quest, so dont try to put stress on an enchanter. Be a man and slow / root park them and take the hits. No sense in relying on an enchanter when you can take a much larger beating than they can. Enchanters will probably only help up to the city of mist part. From there its straight guts n blood. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">All and all this is a fairly easy quest provided you have the lvl 50ish manpower of a guild. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Monks have to kill like 2 lvl 60s at once, so dont think we have it hard. We dont. We have it very easy compared to other classes, and the stats on the spear and boots alone make this a very worthwhile quest. When you get to lvl 50+ you'll start to understand how much the resists on these items help and how much stats affect your character. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Try to see the big picture here. You can probably get this whole quest done with 3 raids. One city of mist raid, one hole raid, and one plane of fear raid. Hell if you are friends with anyone in a guild going into plane of fear you could probably just go in to kill iksar child and leave and just have 2 major raids. Not too hard considering. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">good luck and </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">/salute </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Mandicus of Innoruuk server</FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> </FONT></FONT></DIV><DIV align=left><FONT COLOR=#0066ff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Mandicus 57 barbarian shaman / Zakani 44 iksar monk of Innoruuk server.</FONT></FONT></DIV></TD></TR></DIV></TABLE>
