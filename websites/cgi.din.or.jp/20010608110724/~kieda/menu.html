<FORM action="./" method="post" name="JST">JST(GMT+9)<BR>
<INPUT name="datestr" size="23"> <SCRIPT language="JavaScript">
<!---都市別時計
function tJST(){
var GMT = 9;
var week = new Array("Sun","Mon","Tue","Wed","Thu","Fri","Sat");
var gmt = new Date();
var now = new Date();
var set = now.getTimezoneOffset();
gmt.setTime(now.getTime()+(set/60+parseFloat(GMT))*60*60*1000);
Mon = gmt.getMonth() + 1;
Wee = week[gmt.getDay()];
Dat = gmt.getDate();
hor = gmt.getHours();   if(hor < 10)hor = "0" + hor;
min = gmt.getMinutes(); if(min < 10)min = "0" + min;
sec = gmt.getSeconds(); if(sec < 10)sec = "0" + sec;
document.JST.datestr.value = " "+Mon+"/"+Dat+"["+Wee+"] "+hor+":"+min+":"+sec;
setTimeout('tJST()',999);
}
tJST();
//end--->
</SCRIPT></FORM>
