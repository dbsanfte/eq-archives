      <TD valign="top" width="20%" bgcolor="#0a0a0a"><FONT size="2">本文</FONT></TD>
      <TD width="80%" bgcolor="#0a0a0a"><FONT size="2">
いよいよ以前から綿密に計画を練っていた、ScVを潰す最後の戦いが始まった・・。<BR>
これに負けた方はギルドを解散する！　絶対に負けられない戦いである。<BR>
そしてこれほどまでに大きな戦いはもう出来ないだろう。<BR>
<BR>
幸先を占う大事な緒戦、第二戦はScVのDeciet穴部屋待ち伏せで始まった。<BR>
そして=+=は二戦ともこれを撃破！<BR>
<BR>
もちろんこのまま押し切れると思っている。<BR>
さよならScV。</FONT></TD>
