      <TD width="80%" bgcolor="#0a0a0a"><font size="2">きよよ</font></TD>
    </TR>
    <TR> 
      <TD valign="top" width="20%" bgcolor="#0a0a0a"><font size="2">本文</font></TD>
      <TD width="80%" bgcolor="#0a0a0a"><font size="2">
ほりえもんは、過去に既存の放送業界を殺すとか発言してるわけだし、<BR>
そこまで言い切ってる人間がニッポン放送をのっとったら、殺されると<BR>
判断して、無理やり防衛してるんだといえば、以外と今回の件は<BR>
フジが勝つかもしれんな。<BR>
<BR>
殺すという単語までつかってるわけだから、殺意のあるやつが<BR>
ニッポン放送の業績をのばせるともおもえんし、やっぱライブドアが<BR>
ニッポン放送をのっとるのはまずいという判断は適切だという結論も<BR>
ありえなくはないと思う。</font></TD>
