<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=568><TR VALIGN=top><TD><IMG SRC="http://track.homestead.com/~site/Scripts_Track/track.dll?H_H=9174829&H_P=1&H_A=13807540&H_I=209&H_U=7614522" WIDTH=16 HEIGHT=1></TD><TD><IMG SRC=/tp.gif WIDTH=10 HEIGHT=1></TD><TD><IMG SRC=/tp.gif WIDTH=113 HEIGHT=1></TD><TD><IMG SRC=/tp.gif WIDTH=429 HEIGHT=1></TD></TR>

<TD COLSPAN=3><DIV align=left><A HREF=mag2index1.html TARGET="_parent"><U><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">Starting a Barbarian Shaman</FONT></U></A></DIV><DIV align=left><U><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="1">Juror Beaumains</FONT></U></DIV><DIV align=left><U><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="1"><BR></FONT></U></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">First of all, congratulations on creating a barbarian shaman - one of the </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">most versatile classes in Norrath. </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">As a shaman, you will be able to buff, debuff, heal, and melee depending on </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">the needs of the group you join. Your services will be in demand in most </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">locations in Norrath. You can solo with root, DOTs, and cold-based DD </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">spells and later a pet but it is in groups that you really shine. </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">When you are young (under 4), stick close to Halas ramp while you </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">hunt. Kill cubs, whelps, pups, spiderlings, and decaying skeletons. If a </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">vengeful soloist, lyricist, or composer pops up, run for the guards </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">immediately. Collect the following things for the following quests: </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">white polar bear skin for Cindl at Mac's Kilts (patchwork and leather armor) </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">6 ice goblin necklaces for Lysbith at arena - say &#034;I will protect the pass&#034; </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">to get box ($, rations, torches) </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">8 wooly fungus for Waltor outside shaman guild - say &#034;I will assist in </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">gathering fungus&#034; to get jar (5 lvl spell - can be repeated to get most of </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">your 5th lvl spells) </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">As soon as you reach 5th lvl, start doing goblin camps with partner, </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">preferably tank. Closest one is over hill to the right of newbie </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">area. Other ones are to the right of Snowflake if you are facing tundra, </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">past Bandl, and the end of mountain range. Ice goblin casters which drop </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">caster beads needed to get gavel of justice from Shamus outside shaman </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">guild spawn uncommonly at the last camp. It is easy to get lost so don't </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">stray too far onto tundra and learn locs of ramps and guards as soon as you </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">can. You will also need to get 2 light sources - one to carry with you and </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">one to leave in the bank for CRs (GLS is usually best) as soon as you can. </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">At 7th lvl you should be able to kill gnolls at entrance to Blackburrow and </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">head in there. Solo up top, just inside door, and near bridge / med </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">room. Then get in a group and work your way down toward snake ledge and </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">snake pit as you level. Trains can get really bad here so know your exits </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">and zone if necessary. Collect gnoll fangs for Lysbith or better yet </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Captain Tillin, a guard at the top of the arena in Qeynos. </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Once you get SoW and reach your teens, I would suggest hunting bears, </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">leopards, skeletons, and orcs on the tundra for a while. Do not cross </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">river and watch for Martar Icebear. He will kill you if he sees you. His </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">brother Karg on the other hand will give you a nice cloak for a white polar </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">bear skin and 5pp. if you are lucky enough to find him. Give 2 wraith orc </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">wristbands to Cindl for more armor. Run to Bandl if you get in trouble. </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">You can also hunt rabid animals in Qeynos Hills and turn diseased pelts </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">into Caulria at the temple in Qeynos for $, spell, and XP. Make sure there </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">are no druid NPCs around before you attack them though. Or you can get in </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">bandit group in WK and turn in sashes to Chesgard and spectacles to Gehna </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">at the House of Thunder in Qeynos. </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Before heading to Qeynos, get wanted poster from Jinkus at shaman guild by </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">giving him parchment from Cindl (ask her &#034;what mammoth hide parchment&#034;) and </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">ink from Greta outside Smokes and Spirits (ask her &#034;what ink&#034;) Take poster </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">to guard just outside or just inside bank in Qeynos to get List of Qeynos' </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Most Wanted. Return list to Jinkus for Initiate Symbol of Justice necklace. </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT COLOR=#33ccff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Other general tips</FONT></FONT><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">: </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Get a decent piercing weapon and practice piercing whenever you are </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">fighting easier mobs. 1HB and 2HB are easy to raise and there are better </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">1HB and 2HB weapons available for young shamans but later in life piercing </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">weapons become more important. </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Don't bother with raft to Halas. Just swim across. Nothing will attack you. </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Make your own water and food to raise conjuration skill needed for DoTs </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">(purchased from Starn at temple on tundra.) Cast flash of light frequently </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">to raise divination skill needed for vision spells (purchased from gypsies </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">in Oasis.) Other skills should increase naturally as you buff, heal, cure, </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">and blast. </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Use inner fire as well as minor and light heal at lower levels because it </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">is more mana efficient. </FONT></DIV><DIV align=left><FONT COLOR=#33ccff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#33ccff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Additional info to clarify:</FONT></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">You can actually start goblin hunting with partner at lvl 3 although it is best to wait until lvl 4 since there are usually several at each camp, they will aggro on you, and shamans don't get harmony-like spell.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> You can start hunting polar bears, snow leopards, snow orc troopers, giant wooly spiders, and skeletons on the tundra at lvl 9 solo or lvl 7 with partner. </FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Be sure to put one training point in channeling at lvl 4 and one training point in meditation at lvl 8. </FONT></DIV></TD>
</TR>
