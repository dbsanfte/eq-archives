<TD COLSPAN=2><DIV align=left><U><FONT COLOR=#3333cc><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">Tip: Divine Aura</FONT></FONT></U></DIV><DIV align=left><U><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="1">Loral Ciriclight</FONT></U></DIV><DIV align=left><U><FONT COLOR=#3333cc><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></U></DIV><DIV align=left><U><FONT COLOR=#3333cc><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></U></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">No greater ability ever bestowed upon the clerics of Norrath is as powerful as </FONT><A HREF=http://64.4.16.250/cgi-bin/linkrd?_lang=EN&lah=ab4cde20246b9e0acd37c967d8070eda&lat=980787186&hm___action=http%3a%2f%2feq%2ecastersrealm%2ecom%2fspells%2fspelldescriptions%2easp%3fId%3d675 TARGET="_blank"><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Divine Aura </FONT></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">. This is the only single spell given to a cleric that will stay in their spell slot for their entire career. Divine Aura will render the caster true invulnerability for eighteen seconds at a cost of 20 mana and with a one second casting time. Here are a few tips and tricks to using this very powerful spell.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT COLOR=#33ccff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Feather Fall</FONT></FONT><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">:&nbsp; While monks might be practitioners of the safe fall, clerics are truly the master. No matter how high you are, if you can cast this spell before you begin your fall, you will land taking no damage. Consider the mobs of the Aviak village in the penthouse. Should your party pull far more than it can handle, you can simply cast Divine Aura, jump off the side, drop the spell and gate before the mobs can reach you.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT COLOR=#33ccff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Lose the Agro</FONT></FONT><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">:&nbsp; While a few mobs will stay on and beat you while the Divine Aura is up, many will simply turn away and attack other members of your party. Should you accidentally blast a bit too much or just cast a word of healing that cured about 2500 points of health, you can use this spell to get the mobs off of you and back onto the fighters where they belong.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT COLOR=#33ccff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Hotkey it</FONT></FONT><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">:&nbsp; Here's a way to bind Divine Aura to a dedicated key of your choice. Make a social called aura. Inside the social type &#034;cast 8&#034;. Make sure Divine Aura is always in slot 8 of your spell gems. Now drag the social over to your hot menu to a dedicated slot like the last slot on the right (slot 10). Finally, go into the keyboard configuration and set the user 10 command to a key you can reach easily from your basic movement keys. You can add a couple of emotes or group messages to this social as well, informing your party that you are currently under the protection of your diety.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT COLOR=#ff0033><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">WARNING</FONT></FONT><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">:</FONT><FONT COLOR=#33ccff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> Evac Buster! </FONT></FONT><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> While Divine Aura may make you feel like a God for 15 seconds, it can sometimes create some horrible side effects. Divine will stop any effect that is cast on you including your own parties protection, healing or teleportation spells. If you really need a heal or an evac is coming, make sure to right click the spell off, so that you will go with the rest of them instead of being all alone with a stack of mobs on you. Remember, you are in control of the duration of the spell, you do not need to wait the whole 18 seconds to drop it, just right click the spell in your buff box and away it goes.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT COLOR=#33ccff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Mana sink your opponent in a dual</FONT></FONT><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">:&nbsp; One of my personal favorites is to dual another caster in the Arena. As soon as you start the fight, throw up the divine aura and watch the caster burn half his mana before realizing that you are unaffected. While they are burning it, go up and /rude them for an extra effect.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT COLOR=#33ccff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Kite Trakanon</FONT></FONT><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">:&nbsp; This one was a rumor I heard. The cleric leader of a large guild aparently uses Divine Aura to pull </FONT><A HREF=http://64.4.16.250/cgi-bin/linkrd?_lang=EN&lah=4c83dbb14c58c3c6df93b6a7ee147042&lat=980787441&hm___action=http%3a%2f%2fmikeshea%2enet%2feverquest%2fimages%2ftrak3%2ejpg TARGET="_blank"><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Trakanon</FONT></A><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">, away from the inital teams that invade his lair. Even Traknons 1200 per tick poison breath and 550 triple attack has no effect when protected by this mighty spell. While Trakanon is busy hammering on the protected cleric, the rest can pull away his Sebilite Protector and make the future battle a little easier.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">So remember, keep this little gem of a spell memorized and it might not only save your life but impress your friends as well.</FONT></DIV><DIV align=left><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></DIV></TD>
</TR>
