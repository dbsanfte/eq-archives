<TD COLSPAN=13><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff>Purpose of the guild.</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff>--------------------------------------------------------------------------------</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff>To have fun being evil without making the game less fun for others that are not in the guild.</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff>To develop a group of friends that can be trusted.</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff>To give and receive help as needed.</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff>To learn about the game from those more experienced.</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff>To relive the early joys of the game through the eyes of new players.</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff>To kill every good NPC possible. </FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff>Guild Structure</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff>--------------------------------------------------------------------------------</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff>Midnight Council is not ruled by a single individual. At the top level is a ruling triad made up of Reog, Obeah and Lexxii. Coincidentally this represents the three evil races of the main land: ogre, troll and dark elf. Following is the council of seven made up of one member from each race that can be evil. Ogre, troll, dark elf, iksar, gnome, human and eurdite. The triad makes quick decisions and sees that things get done. The council approves or rejects policies, reviews quick decisions made by the triad, and each council member governs members of his or her own race within the guild. Inquiries about membership should be directed through your council member or one of the triad. </FONT></FONT></DIV></TD>
