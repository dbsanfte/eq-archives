<TD COLSPAN=13><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff><U>WHAT IS NOT ALLOWED.</FONT></U></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff>Roleplaying evil is not an excuse to be a but-hole or harm others. We are all here to have fun, not cause misery to other players. We have very strict rules about conduct.</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff>You shall not cause harm to others players. This includes those of good nature as well as evil. The exception of the rule is duels or matches within the arena. Training mobs or guards onto other players is never an acceptable act.</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff>You shall not beg. Begging is for weaker races such as halflings. It is an irritation to players and thus not an acceptable practice for guild members. If you cannot survive on your own, you are not worthy to walk to path of evil.</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff>You shall not swindle other players. Swindling other players is not evil role-play, it is a practice used by the person behind the character to gain easy items or money at the expense of other real people playing the game. Most swindlers are kids who make a female paladin in hopes of convincing other players that they are good players in need. Well, we don't need this type of player.</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff>Bad or abusive language is not allowed.</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff>Harassment of others is not allowed.</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff>No kill stealing.</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff><U>WHAT IS ALLOWED.</FONT></U></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff>You are allowed to twink your character, &#034;quietly&#034;. No one cares if your level 8 rogue has an SBD, just don't brag about it. This takes the joy and anticipation of material achievement away from other guild members that do not have the means to acquire high level items.</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff>Your guild character does not have to be your primary character.</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff>You are allowed to have other characters in other guilds.</FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff>You are allowed to group with &#034;good&#034; characters. Just please do it in a RP fashion. Consider it as using others to further your growth and power. </FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff><BR></FONT></FONT></DIV><DIV align=left><FONT FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE=4><FONT COLOR=#ffffff>You are allowed to kill any good NPC, but do not interfere with others that may be using that NPC for a quest.</FONT></FONT></DIV></TD>
<TD COLSPAN=2 HEIGHT=980></TD>
</TR>
