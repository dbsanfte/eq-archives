<TD COLSPAN=8><DIV align=center><FONT COLOR=#ffff00><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">1er Partie</FONT></FONT></DIV><DIV align=center><B><FONT COLOR=#ffff00><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"> </FONT></FONT></B><U><B><FONT COLOR=#ffff00><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Obtain the Shiny Tin Bowl </FONT></FONT></B></U></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">1.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Telin Darkforest in Burning Woods. Target him and say 'what action should I take' to get the &#034;Worn Note&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">2.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Faelin Bloodbriar in Greater Faydark. Give her the Worn Note to get &#034;Faelins Ring&#034;</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT><FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>[Note: She spawns at POS 1500, POS 500; placeholder is an orc pawn.] </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">3.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Giz X`Tin in Kithicor. Give him Faelin's Ring to get the &#034;Dark Metal Coin&#034;</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT><FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>[Note: A Dark Reaver will spawn; just run from it.] </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">4.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Telin Darkforest in Burning Woods. Give him the Dark Metal Coin to get the &#034;Worn Dark Metal Coin&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">5.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT> &nbsp; &nbsp; [Note: The following part must be done as one sequence and all takes place in East Karana]</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT> &nbsp; Go to Althele. Give her the Worn Dark Metal Coin to get &#034;Braided Grass Amulet&#034;</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT> &nbsp; Go to Sionae. Give her the Braided Grass Amulet to get the &#034;Frayed Braided Grass Amulet&#034;</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT> &nbsp; Go to Nuien. Give him the Frayed Braided Grass Amulet and he will return it to you</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT> &nbsp; Go to Teloa. Give her the Frayed Braided Grass Amulet and she will lead you to the druid gathering</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT> &nbsp; Kill the Dark Elf Corruptor and Reavers that spawn and loot the Fleshbound Tomb</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT> &nbsp; Go to Althele. Give her the Fleshbound Tomb to get the &#034;Earth Stained Note&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">6.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Ella Foodc</FONT></FONT><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">rafter in Misty Thicket. Give her the Earth Stained Note to get the &#034;Shiny Tin Bowl&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffff00><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">2 ieme partie</FONT></FONT><B><FONT COLOR=#ffff00><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"> </FONT></FONT></B></DIV><DIV align=center><U><B><FONT COLOR=#ffff00><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Create the Hardened Mixture</FONT></FONT></B></U><U><B><FONT COLOR=#ffff00><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> </FONT></FONT></B></U></DIV><DIV align=left><B><FONT COLOR=#ffff00><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">1.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Everfrost and forage &#034;Chilled Tundra Root&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">2.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Greater Faydark and forage &#034;Ripened Heartfruit&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">3.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Innothule Swamp and forage &#034;Speckled Molded Mushroom&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">4.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Misty Thicket and forage &#034;Sweetened Mudroot&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">5.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Place the Chilled Tundra Root, Ripened Heartfruit, Speckled Molded Mushroom, and Sweetened Mudroot the Shiny Tin Bowl. Hit the Combine button to create the &#034;Hardened Mixture&#034;</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffff00><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">3 ieme partie</FONT></FONT></DIV><DIV align=center><U><B><FONT COLOR=#ffff00><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Runecrested Bowl Ingrediant #1 [Ancient Pattern] </FONT></FONT></B></U></DIV><DIV align=left><B><FONT COLOR=#ffff00><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></B></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">1.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Alrik Farsight in Timorous Deep. Target him and say 'I will take the artifact' to get the &#034;Crushed Pot&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">2.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Farios Elianos in Felwithe [B]. Give him the Crushed Pot to get the &#034;Grocery List&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">3.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Merchant Nora in Felwithe [A]. Give her the Grocery List to get the &#034;Bag of Provisions&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">4.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Farios Elianos in Felwithe [B]. Give him the Bag of Provisions to get the &#034;Receipt&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">5.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Alrik Farsight in Timorous Deep. Give him the Receipt to get the &#034;Ancient Pattern&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">4.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Part 4: Runecrested Bowl Ingrediant #2 [Platinum Speckled Powder] </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">1.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Forage a Rose of Firiona in Firiona Vie. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">2.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Merdan Fleetfoot in Surefall Glade. Give him the Rose of Firiona to get the &#034;Wood Painting&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">3.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Human Skeleton in Frontier Mountains. Give her the Wood Painting to get the &#034;Silver Chained Locket&#034;</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">[Note: Spawns around NEG 2100, POS 2000] </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">4.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Niera Farbreeze in Surefall Glade. GIve her the Silver Chained Locket to get the &#034;Platinum Speckled Powder&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">5.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Part 5: Runecrested Bowl Ingrediant #3 [Enchanted Clay] </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">1.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Obtain a Jade Reaver from City of Mist </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">2.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Kinlo Strongarm in Kaladim [B]. Give him the Jade Reaver to get the &#034;Enchanted Clay&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">6.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Part 6: Create the Runecrested Bowl </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">1.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Combine the Ancient Pattern, Enchanted Clay, and Platinum Speckled Powder in a Pottery Wheel to make a Runecrested Bowl.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">[Note: This requires no skill in pottery to do and any pottery wheel should work.] </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">7.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Part 7: Obtain Swiftwind &#038; Earthcaller </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">1.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Give Ella Foodcrafter in Misty Thicket the Hardened Mixture and the Runecrested Bowl to get the &#034;Softly Glowing Stone&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">2.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Kill Venril Sathir in Karnor's Castle to get the &#034;Pulsing Green Stone&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">3.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Foloal Stormforest in Firiona Vie. Give her the Softly Glowing Stone and the Pusling Green Stone to&nbsp; get the &#034;Warmly Glowing Stone&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">4.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Telin Darkforest in Burning Woods. Give him the Warmly Glowing Stone to get the &#034;Ancient Longsword&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">5.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Jaeil the Wretched in The Hole. Give him the Shiny Tin Bowl to spawn Jaeil the Insane. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">6.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Kill Jaeil the Insane and loot the &#034;Soulbound Hammer&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">7.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Mairee Silentone in Eurdin. Give her the Soulbound Hammer to get the &#034;Dwarven Smiths Hammer&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">8.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Island Four of the Plane of Air. Kill the Essensce Tamer to get the &#034;Swirling Sphere of Color&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">9.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Mairee Silentone in Eurdin. Give her the Dwarven Smiths Hammer and the Swirling Sphere of Color to get the &#034;Hammer of the Ancients&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">10.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Kinlo Strongarm in Kaladim. Give Kinlo Strongarm the Hammer of the Ancients, which causes Usbak the Old to spawn, who gives you a &#034;Small bit of Mithril Ore&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">11.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Give Usbak the Old the Ancient Longsword to get the &#034;Refined Ancient Sword&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">12.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Give Kinlo Stirngarm the Small bit of Mithril Ore to get the &#034;Refined Mithril Blade&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">13.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Telin Darkforest in Burning Woods. Give him the Refined Ancient Blade, which causes Faelin Bloodbriar to spawn. Telin gives you the Ancient Blade back </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">14.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Give Faelin Bloodbriar the Refined Ancient Sword to get Swiftwind. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">15.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Kill Innoruuk in the Plane of Hate to get the &#034;Shattered Emerald of Corruption&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">16.<FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT>Go to Xanuusus in North Karana. Give him the Refined Mithril Blade and the Shattered Emerald of Corruption.</FONT></FONT><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV></TD>
