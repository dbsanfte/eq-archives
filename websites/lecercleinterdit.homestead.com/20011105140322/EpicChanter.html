<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=520><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=434><DIV align=center><U><I><B><FONT COLOR=#f4d589><FONT class="TimesRoman14" FACE="Times New Roman, adobe-times, Times" SIZE="4">STAFF OF THE SERPENT </FONT></FONT></B></I></U></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">Statistical Information</FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">Classes:&nbsp; Enchanters</FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">Races:&nbsp; Humans, Erudites, Gnomes, Dark Elfs, High Elfs</FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">Type: 1H Blunt </FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">Damage: 11</FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">Delay: 24</FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">Stats:&nbsp; +60 MANA +40 HP +20 INT +15 CHA +5 STR +10 STA +10 SV COLD +10 SV DISEASE +10 SV FIRE +10 SV MAGIC +10 SV POISON</FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">Special Attributes:&nbsp; MAGIC, NO DROP, LORE</FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">Slot(s):&nbsp; Primary Hand Slot</FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">Weight:&nbsp; 5 Stone</FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">Effect:&nbsp; Speed of the Shissar&nbsp; </FONT></FONT><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> </FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=center><I><FONT COLOR=#db7124><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">I</FONT></FONT></I><I><FONT COLOR=#db7124><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">nformation Suplementaire</FONT></FONT></I></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">Rarity: Very Rare</FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">Proc Level:&nbsp; 51</FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">Max Damage: 62.15</FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">Damage/Delay Ratio: Damaging (0.458)</FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">Max Attack Speed: Very Fast (13.333)</FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">Weapon Performance: Good (9.687)</FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2"><BR></FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">Effect Details:&nbsp; Regarded by Enchanters as Augment 3, this spell increase attack speed by 66%, Agility by 40, Armor Class by 12, and has three times the stamina regen of the original augmentation spell.</FONT></FONT><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> </FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV></TD></TR></DIV></TABLE>

<DIV style="margin-top: 612px; margin-left: 110px">
<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=834><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=6290><DIV align=center><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">1ier partie</FONT></FONT></DIV><DIV align=center><U><B><FONT COLOR=#db7124><FONT class="TimesRoman12" FACE="Times New Roman, adobe-times, Times" SIZE="3">Obtenir la note</FONT></FONT></B></U></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The first thing you should do is find Stofo Olan. He is on the second floor of the Vasty Deep Inn near the Erudin City Library (Loc: -1100, -60). </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Hail him and the conversation is as follows:</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Good day, I have discovered something truly wonderful! If I only had the materials required so I can copy my notes and send them to my teacher'.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Ask him 'What materials' </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'The materials I need are a mechanical pen, ink of the dark, and white paper. Bring me those and I will give you a copy of this information'.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Ask him 'Who is your teacher' </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'My teacher is Jeb Lumsed. He was last seen in the regions of the newly discovered lands. If you wish to find him that is where you must seek him out'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">You then need to gather the three items and bring them back to Stofo Olan: a Mechanical Pen, Ink of the Dark, and the White Paper.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The Mechanical Pen can be obtained in Ak'Anon. Rilgor Plegnog (in the Mines of Malfunction) in is the one to ask about the Mechanical Pen. </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Ask him 'What Mechanical Pen'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Why do you want one of those contraptions. You will spend more time repairing it then you will writing with it. But if you insist on getting one, you are going to have to do a small favor.' </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Rilgor Plegnog tugs at your robe and grins evilly. </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Mighty nice outfit you have there. Sure beats these drab robes us three are wearing. Hmm...my favorite color is purple, in fact a shiny metallic purple would do nicely. How bad did you want that pen?'. </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">You guessed it, he wants a Shining Metallic Robe (SMR).&nbsp; These are obtained off the Arch Ghoul Magi in the Dead Side of Lower Guk.&nbsp; Rare Spawn and Rare Drop.&nbsp; Once you hand him the SMR he will give you the Mechanical Pen.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">To obtain the Ink of the Dark, head on over to Qeynos. Reania Jukle is in the Temple under Qeynos (Loc: 2030, -580). </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Ask Reania 'What Ink of the Dark'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'The ink is the blood of a dark scribe. Tempt him and give him this vial. He should cooperate'. </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">She will then give you an Empty Ink Vial.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">From there head to Lower Guk. The Ghoul Scribe spawns in the Ghoul Sage room (near the Executioner room).&nbsp; Whilst a rare spawn, this shouldn't be too long a camp.&nbsp; Charm the Scribe and hand him the Empty Ink Vial. You will get the Ink of the Dark returned to you.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Then you need to get the White Paper. This part is completed in West Karana.&nbsp; You will need to bring a paper and a quill and these can be obtained from almost all Enchanter guilds. You need to speak with Chrislin Baker (Loc: 1050, -1990). </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Hail her and then give her the paper and quill.&nbsp; </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Chrislin Baker gives you a hug. 'Thank you so much. I did some cleaning after you left and found this behind a barrel. It may have been left behind by the person who took my materials. You can have it'. </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">You will then get a Bandit Sash.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">A Human Monk named Thrackin Griffen will then spawn at Loc 880, -11570. Kill him and you and loot the White Paper.&nbsp; This mob is almost totally magic immune and a tough battle.&nbsp; Take a group with some tanks and a cleric.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Head back to Erudin City and return to Stofo (Loc: -1100, -60).&nbsp; Give him the three items and he will say the following: </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Yes, that is what I wanted.'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Here, take these notes.' </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'My teacher will be very interested if he knows what I have found'. </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">He will then give you a Copy of Notes.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Now it is time to head over to the Burning Woods and speak with Jeb Lumsed (Loc: -1200, -4000). </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Give him the Copy of Notes and he will then talk to you:</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'I see that you have what I was waiting for. Stofo does do excellent work. It seems that you are to start on a long journey. Take this seal and it will guide you on your next step. Seek out the masters of enchantment. In time we will craft the Serpent for you. When you have collected the four parts of the staff, you must combine them in a bundle for me. If you need a sack, just let me know'. </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">He will also give you the coin Jeb's Seal.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Tell him 'I need a sack'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Take this sack and combine the items I requested in it. Then return it to me'. </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">He will then give you an Enchanter's Bag.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Ask him 'Who are the four other masters'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'The masters are enchanters who have reached the plateau of understanding. Their names are Modani Qu'Loni, Mizzle Gepple, Nadia Starfeast, and Polzin Mrid. All are master crafters in their own right'.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Ask him 'Who is Modani'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Modani is a master of illusions. You should seek him out first. Keep a careful eye out for him - he is never in his true form. The last time I spoke to him, he seemed very excited about his voyage to the elven outpost. You may or may not find more clues about his location there'.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Ask him 'Who is Mizzle'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Mizzle is a gnome who has mastered the use of enlightened magic. Go to him once you have spoken to Modani. Mizzle is not one to travel, so you should not have to look far from his home to find him'.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Ask him 'Who is Nadia'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'The mistress of charm, Nadia is very beautiful. She, too, traveled with her relatives to the new land. I just recently received a letter from her. She says more and more pilgrims and explorers are arriving every day, and that the outpost is well defended now'.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Ask him 'Who is Polzin'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Master of the Phantasms - he is the last one you will seek out. Hmm...Polzin is native to Erudin, however, after the incident near Paineel, no one has heard from him. I hope that he is well'.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Now the fun begins.&nbsp; You have to find&nbsp; the four masters and complete sub-quests for all of them.</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">2 ieme partie</FONT></FONT></DIV><DIV align=center><U><B><FONT COLOR=#db7124><FONT class="TimesRoman12" FACE="Times New Roman, adobe-times, Times" SIZE="3">Enchanter Master One</FONT></FONT></B></U></DIV><DIV align=center><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">First go and locate Modani Qu'Loni in Overthere (Loc: +540 -940). Modani is in the form of a Scorpion. Actually getting to Modani can be tricky sometimes as there are other Scorpions nearby that can make it a challenge.&nbsp; Either kill them, or have someone lure them away so you can speak to Modani.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Hail Modani Qu`Loni'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'The hidden self inside a myriad of magic is one that walks quite softly. Yes, that is what you must seek.'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Give Modani Jeb's Seal.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Ah yes, Jeb's seal. The time to craft a Serpent must have come. I will need components collected to craft the first of the pieces. I will also provide you with a sack in which you must combine the items. Are you ready to collect them?'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'I am ready to collect them.'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Scattered throughout the world are various items. To prove your worth, go collect these and return them to me. The Xolion Rod, Innoruuk's Word, Chalice of Kings, and snow blossoms.'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'I need a sack.'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Take this sack and combine the items I requested in it. Then return it to me. '</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">You will receive an Enchanter's Bag</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'What is the Chalice of Kings?'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'The Chalice of Kings is the chalice of elven kings. Recently thought to be lost to the ages, it was recently discovered. I need its magical powers to create a magical liquid.'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'What is the Xolion Rod?'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'This is the rod of an ancient civilization found on this continent. Nothing is known of it other than that the scaled ones discovered it years ago.'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'What are Snow Blossoms?'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'These are flowers that are also used in the creation process. They were once widespread, but now I am told they only grow in select places.'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Head to Oggok and look for Bozlum Blossom (Loc 540, 1150). Hail her and she will start talking:</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Bozlum Blossom heaves a great sigh.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Ask her 'What is wrong Bozlum?'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Boz like to grow perty flowers in her garden. But garden no more.'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'What happened to your flower garden?' </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Boz not know what happen. Only see der biggins footprints in it. Me perty sure my puppy not smash garden. He has tiny feets. Right, puppy?'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Bozlum Blossom pet wags his tail.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Go and find Brokk Boxtripper in a hut outside her caves (Loc: 230, 380). </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Once you find him, look for a pair of sandals right next to him. Get it and you will see they are called Large Muddy Sandals.&nbsp; Take the sandals back to Bozlum and give it to her. She will give you a Scribbled Parchment and ask that you take it to Brokk.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Go to Brokk and give him the Parchment. He will give you a Gift to Bozlum to make up for messing her garden.&nbsp; Give her the Gift. </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Oh, dat silly Brokk. He sent me too many of these perty flowers. Me not know where put them all. Here, you take some cause you help Bozlum. Me like you. Flowers make you smell perty, too'. </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">She will then give you the Snow Blossoms.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Then get a good group together and head over to Neriak.&nbsp; Inside the Cleric Guild in the Third Gate region you will find Verina Tomb. Verina is on a two day spawn, and often is not up (some other Enchanter has killed her normally).&nbsp; You may have to just wait, or pop back now and then to check on her.&nbsp; She is a level 60 Dark Elf Cleric and you can kill her without aggroing the guards (provided you aren't Kill on Sight to the guards).&nbsp; </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">You will loot Innoruuk's Word off her once she is dead.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The Xolion Rod can be obtained by killing Vessel Drozlin in the Cabilis Shaman guild (Loc: 591, -826.)&nbsp; You will need to swim through the large pool and go through the tunnels.&nbsp; Becareful as this monster is also immune to most magic, and will run through a one way door as the fight progresses.&nbsp; He also has some guards.&nbsp; Take a good high level group (or more if worried).&nbsp; </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Kill Drozlin and then loot the Xolion Rod.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Now its time to head over to Chardok and head deep inside the dungeon.&nbsp; You have to kill Prince Selrach Di'zok (Loc: -560 +1360). The Prince is a level 61 Warrior and to fight him and clear the path to his room you will need some heavy fighting power. Kill the Prince and loot his head.&nbsp; Then go to Felwithe and look for Joren Nobleheart in the Magician guild. </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Hail him and then give him the princes head.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Vengeance has been fufilled! However, the King still has a heavy heart. Not until Firiona has been return can this sadness be lifted. But in appreciation of your efforts, I am honored to present to you the King's Chalice'. </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">He will then give you the Chalice of Kings.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Once you have the Xolion Rod, Innoruuk's Word, the Chalice of Kings, and Snow Blossoms, put all of them in the Enchanter's Bag Modani previously gave you and hit the combine button.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">You will create a new item called a Sack for Modani.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Go back to the Overthere and see Modani once again&nbsp; (Loc: +540 -940). Give him the Sack for Modani.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Excellent, you have done well. Here is the first piece of the staff. Now you must go seek out the second master; he will clear the path for you'. </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">You will get the 1st Piece of Staff.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">3 ieme partie</FONT></FONT></DIV><DIV align=center><U><B><FONT COLOR=#db7124><FONT class="TimesRoman12" FACE="Times New Roman, adobe-times, Times" SIZE="3">Enchanter Master Two</FONT></FONT></B></U></DIV><DIV align=center><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Next you need to find Mizzle Gepple in Ak'Anon (Loc: 2020, -520). Mizzle is hiding as a Clockwork Gnome. You will see him as Clockwork VIIX. Check by asking him if he is Mizzle and he should say he is. </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Ask for a sack. Mizzle will then give you another Enchanter's Bag and ask you to collect four different items, a Spoon, the One Key, the Lost Scroll, and the book Charm and Sacrifice.&nbsp; This is a much easier quest than Modani's.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The Spoon is on a named sand giant called Cazel, you can find him in the Oasis of Maar.&nbsp; Whilst he is only level 50 he has ridiculous regen and hits very hard.&nbsp; 2 groups are recommended to kill Cazel, or one very high level group.&nbsp; Kill him and grab the Spoon.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Head on over to to the Overthere on the boat which leaves from the Oasis dock.&nbsp; On the top of a little ledge at Loc: -190, -380 you should find the key. The key spawns once every 24 hours. </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The Lost Scroll is at the bottom of Dalnir's Crypt.&nbsp; Go to Loc -20, 50. You will see a bed next to a wall. The scroll will spawn between the bed and the wall every 24 hours. </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The Book of Charm and Sacrifice is in the Plane of Sky on a table in the quest room at Loc: 1300, 560. The book spawns once every 24 hours. </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Put the Spoon, the One Key, the Lost Scroll, and the Book of Charm and Sacrifice in the Enchanter's Bag Mizzle previously gave you and combine them. You will get a Sack for Mizzle.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Give this back to Mizzle Gepple in Ak'Anon (Loc: 2020, -520).</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Oh excellent, you have done what is required. Here take this part, and seek the third master, you are well on your way'. </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">He will then give you the 2nd Piece of Staff.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">4 ieme partie</FONT></FONT></DIV><DIV align=center><U><B><FONT COLOR=#db7124><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">E</FONT></FONT></B></U><U><B><FONT COLOR=#db7124><FONT class="TimesRoman12" FACE="Times New Roman, adobe-times, Times" SIZE="3">nchanter Master Three</FONT></FONT></B></U><B><FONT COLOR=#db7124><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2"> </FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Nadia Starfeast has your next sub-quest. &nbsp; Head over to Firiona Vie to Loc: -3870, 2525 (be careful of your faction here, you may need to raise it if you are kill on sight by killing goblins in Warslik Woods). </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Hail her and ask for a sack. She will give you another Enchanter's Bag and ask that you obtain the essence of four different stones: a Dull Diamond, a Dull Sapphire, a Dull Ruby, and a Dull Emerald.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">To obtain these you will need to transform them into enchanted versions of the gems. To do so, you will need to charm a few different creatures. </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'What gems?'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'I have prepared some gems that you will need to trap the essence. You will need to force a diamond, sapphire, ruby and emerald onto special creatures to obtain their essence.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">What diamond?'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Here is the diamond that I have prepared for you. Its only purpose is to trap the essence of a particular book worm. If you should fail in your first attempt. Do not worry, I will provide you with another.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'What sapphire?'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Here is the sapphire that I have prepared for you. Take it and give it to the one referred to as the Golden Faerie.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'What ruby?'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Blood red is the ruby that I have given you. The city that you must travel to has no sun, but still a day and night. And at night, the mist could suffocate one. Tis the fate of poor Jaxion.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'What emerald?'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Nadia Starfeast jumps. 'Eeekk... a scorpian. I thought they rid this area of these critters. Those things give me the creepers. Take this emerald and be on your way.'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">To obtain the Enchanted Diamond go to Kaesora.&nbsp; You need to get to Loc: 85, -415.&nbsp; It is quite easy to get there. Once you enter Kaesora, cast levitate and invis, and go straight forwards and drop down the hole.&nbsp; Don't go all the way down - just keep heading straight ahead onto the ledge in front of you. Enter the room with the three spiders and turn right and go through that door. Directly behind that door there is a secret wall which you go through then just before you hit the corner, cast invis vs. undead. Enter the building you see when you go round the corner.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Here you will find either a Spectral Librarian or a Tortured Librarian (placeholder).&nbsp; Kill the Tortured Librarian until the Spectral Librarian spawns. Then charm him and give him the Dull Diamond. He will then give you the Enchanted Diamond and turn into a Enraged Spectral Librarian. If you kill this spawn it will turn into three Freed Souls which cast some nasty area Area Effect spells.&nbsp; They have almost no hitpoints though but take them out quick.&nbsp; They are an optional extra you can gate out once you have the Enchanted Diamond if you like.&nbsp; </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Then head to the City of Mist and look for the Wraith of Jaxion. It spawns right up the back in Neh'Ashiir's building near the Reaver.&nbsp; It is a rare spawn.&nbsp; If it is not there, keep killing everything near there until it does. Then charm it and hand the Dull Ruby. You will get the Enchanted Ruby.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Head to the Overthere. Look for a scorpion called Impaler Tzilug at Loc: -90, 810. Charm the Impaler (like Modani this might mean killing some other NPC's first) and give him the Dull Emerald. In return, he will give you the Enchanted Emerald.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Now head to Skyfire and look for the a tiny Chromodac called Felia Goldenwing near the Burning Woods zone. Felia is another rare spawn and you might have to kill a bunch of other placehoder spawns to trigger her. Once she does spawn, quickly charm her and avoid taking her anywhere near other Skyfire spawns. Other mobs will kill her on sight. After you charm Felia, hand her the Dull Sapphire and she will give you an Enchanted Sapphire.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Combine the Enchanted Diamond, Enchanted Sapphire, Enchanted Ruby, and Enchanted Emerald in the Enchanter's Bag Nadia gave you. You will create a new item called a Sack for Nadia.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Give Nadia back her new sack.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Excellent, you have done what is required. Here take this part, and seek the fourth master, to complete your quest'. </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">She will then give you the 3rd Piece of Staff.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">5 ieme partie</FONT></FONT></DIV><DIV align=center><U><B><FONT COLOR=#db7124><FONT class="TimesRoman12" FACE="Times New Roman, adobe-times, Times" SIZE="3">Enchanter Master Four</FONT></FONT></B></U></DIV><DIV align=center><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Next head to The Hole and find Polzin Mrid (Loc: 210, -50). </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Hail Polzin Mrid!'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Yes, young one? </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Give Polzin Mrid Jeb's Seal.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Jeb has spoken with you already, excellent. Tell me are you ready for the test of the phantasm?</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">You receive Jeb's Seal back.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'I am ready for the test of the phantasm'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'It will be simple, go collect these items and return them to me. Head of a serpent, essence of a ghost, essence of a vampire, and sands of the mystics. Do so and you will receive the last of the pieces. Be sure to combine them in a sack first. Just ask and I will provide you with one.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'What is the head of a serpent?'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Serpent is probably not an accurate term form what you must return to me. It is actually the remnants of a spirit. The spirit is one which was eradicated long long ago by the Iksar. I believe they were called the Shissar. You may need to travel to the Iksar city to learn more about these creatures.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'What is the essence of a ghost?'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'You don't have to look for to find roaming spirits. One in particular though has more meaning then the other sorry souls trapped here. You see, Kindle was a dear friend of mine. I came in search of him when he stopped writing. Wel....look at me now. I fear that I have succumbed to the same fate as poor Kindle.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'What is the essence of a vampire?'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'The essence of a vampire is just that. Only the most powerful of these creatures will possess what you need.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'What sands of the mystics?'</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'They are sands that were imbued with the magical might of the mystics. Mystics use a ritual involving their own blood to create a powerful bond with the sand. One will need to search the shores.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">You should get the Essence of a Ghost first since it is found in The Hole as well. You must look for the Ghost of Kindle, a spawn in between the city and Master Yael's lair (take a couple of groups). Kill her get the Essence of a Ghost.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The Head of a Serpent is found in the Plane of Fear. Clear the zone and kill Cazic Thule. A Shissar Spirit will spawn soon after. Kill it and loot the Head of the Serpent.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The Essence of a Vampire is found in the Plane of Hate. They are a rare drop by Forsaken Revenants (mainly in the north east corner of the zone). </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Then head to the Field of Bone and look for The Tangrin (Loc: 3300, 2530).&nbsp; A rare spawn Gorilla Warrior - this is a fun fight for a couple of high level groups.&nbsp; Kill The Tangrin and loot the Sands of the Mystics.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Put the four items in the Enchanter's Bag Polzin gave you and when combined you will get a Sack for Polzin.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Give Polzin the sack. </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'Excellent, you have done what is required. Here take this part, and return to Master Jeb Lumsed'. </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">He will then give you the 4th Piece of Staff. </FONT></FONT></B></DIV><DIV align=center><FONT COLOR=#ffff00><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">6 ieme parite</FONT></FONT></DIV><DIV align=center><U><B><FONT COLOR=#db7124><FONT class="TimesRoman12" FACE="Times New Roman, adobe-times, Times" SIZE="3">Completing the Quest</FONT></FONT></B></U></DIV><DIV align=center><B><FONT COLOR=#db7124><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Return to Burning Woods and look for Jeb Lumsed (Loc: -1200, -4000). Find him and make sure you have an Enchanter's Bag. If you don't have it just ask for a sack again. Now put all four Pieces of Staff in your Enchanter's Bag and hit the combine button. You will create a new item called Bundle of Staves.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Give the Bundle of Staves to Jeb Lumsed.</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">'The path you trod was long and hard. Now you are worthy to bear the Serpent. Use it well'. </FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><I><B><FONT COLOR=#f4d589><FONT class="TimesRoman12" FACE="Times New Roman, adobe-times, Times" SIZE="3">He will then give you the Staff of the Serpent</FONT></FONT></B></I></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV></TD></TR></DIV></TABLE>
