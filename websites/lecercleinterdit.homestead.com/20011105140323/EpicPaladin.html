<DIV style="margin-top: 562px; margin-left: 112px">
<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=794><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=1178><DIV align=center><FONT COLOR=#ffffff><FONT class="TimesRoman12" FACE="Times New Roman, adobe-times, Times" SIZE="3">1er Partie</FONT></FONT></DIV><DIV align=center><I><B><FONT COLOR=#db7124><FONT class="TimesRoman14" FACE="Times New Roman, adobe-times, Times" SIZE="4">SoulFire Quest</FONT></FONT></B></I></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The quests starts in North Freeport in the Hall of Truth.&nbsp; Find Kalatrina Plossen, one of the Greatest Paladins in the Land.&nbsp; She is directly above the entrance on the second floor.&nbsp; Hail her and she will say:</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">&#034;Hail! Welcome to the Hall of Truth.&nbsp; We, the Knights of Tunare, are the hope this city has of loosening the grip of Lucan D'lere and his militia.&nbsp; I seek a young knight to [serve the will of the Truthbringer.] </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Respond: &#034;I serve the will of the Truthbringer&#034; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">&#034;Stand tall then, Knight!&nbsp; We have need of your service.&nbsp; We have sent a man to infiltrate the militia.&nbsp; We fear he may soon be found out.&nbsp; Take him this note of warning.&nbsp; Say the words, 'Truth is good,' and you shall find him.&nbsp; Be careful, young knight.&nbsp; The militia does not take prisoners.&#034;</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Continue talking to her using the keywords to get her to continue speaking and you will learn of a spy in the Militia.&nbsp; He is in danger Kalatrina tells you and you have to take a note to him.&nbsp; He is located at the Freeport Militia House.&nbsp; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The Spy</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Hurry over to the House.&nbsp; The spy is in the middle of the Militia House in the Courtyard on the first floor.&nbsp; Hail him and he will warn you of danger.&nbsp; Then give him the note from Kalatrina.&nbsp; The Militia will then jump him and kill him.&nbsp; Before he dies he gives you an old piece of burned parchment and yells for you to take it to Kalatrina.&nbsp; Run back to Kalatrina and give her the note.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The Note</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Kalatrina is excited by the note you have been given. Do not give Kalatrina Plossen the Note. If you do, restart the Quest and get it again. This is where the Quest is counter-intuitive. If you give her the Note, she tells you Zimel was a great Blacksmith who knew the secret of enchanting blades and making superior weapons. This is a bug in the Quest.&nbsp; Do not give her the note and carry it with you.&nbsp; She sends you to talk to Rashinda Elore who is located at the Office of the People.&nbsp; Ask her , &#034;Have you heard of Zimel's Blades?&#034; and she will start giving tons of information.&nbsp; After lots of talk she suggests that you go ask Groflah Steadirt about him because Groflah was a friend of Zimel.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Groflah Steadirt</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Go to Groflah's Forge and find Groflah.&nbsp; He is on the second floor.&nbsp; Ask him about Zimel.&nbsp; He doesn't really comfortable about talking about him.&nbsp; Then, give him the note that the spy gave to you.&nbsp; He will start mumbling how this could have survived the fire.&nbsp; Then he says to meet him at Seafarers and gives you the note back.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Finding More on Zimel</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Go to the Seafarers and wait until about 1-3 am.&nbsp; He should then show up.&nbsp; Ask him about Zimel's Blades again and give him the note.&nbsp; He will go into a long story about how Zimel has disappeared and the Blade, Soulfire has been lost. Hand Groflah the Note and he attempt to decipher it. Groflah tells you that he thinks Sir Lucan D'Lere, Head of the Freeport Militia, and Pietro Zarn, Head of the ShadowKnight Guild in Freeport are in cahoots and searching for Soulfire as well.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Tykar Renlin</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Now, look around Seafarers Roost for a beggar named Tykar.&nbsp; He says that he is thirsty so buy him a Drom's Champagne.&nbsp; Repeat this three times and then ask him again about Zimel.&nbsp; He will tell you that he saw Zimel thrown into a dungeon and locked up.&nbsp; He then gives you a blanket to give to Zimel because he feels sorry for him.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Zimel</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Go to the dungeon below the arena and search for Zimel.&nbsp; (Thought to be in Cell Number 4) &nbsp;&nbsp; After talking to him you can tell that he wants a blanket (which you have), bog juice (made from brewing), and edible goo (made from cooking and purchasable in bakeries.)&nbsp; Hand him the three items and you will get a key labeled &#034;H.K. 102&#034;</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">High Keep</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Run to HighKeep and give the Bank Clerk the key.&nbsp; She thanks you and gives you a note to give to Brother Hayle who is being held prisoner in Splitpaw.&nbsp; Go to Splitpaw (zone in South Karanas) and find Brother Hayle.&nbsp; Give him the note from the Bank Clerk.&nbsp; He says he will give you the SoulFire if you get him the Hilt of Soulfire, the Brilliant Sword of Faith, and your Testimony.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The Hilt</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The Hilt of SoulFire is being held by Xicotl, an evil Shadow Knight in Mistmoore.&nbsp; He is level 40 and drops the hilt every time.&nbsp; He spawns around the spa and throne room.&nbsp; His spawn is very random so just kill everything you see in hopes of finding him.&nbsp; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The Sword</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The Sword is found through a sub-quest.&nbsp; You have to first get a big group of people together.&nbsp; They should be level 40-60.&nbsp; Then go to the Freeport Militia and kill Sir Lucan (level 48).&nbsp; He and his friends put up a very good fight.&nbsp; You have to kill him twice, once the actual him and the other time his reincarnation.&nbsp; Loot the testimony from him and give it to Valeron in the Hall of Truth at Freeport.&nbsp; She will give you the Brilliant Sword of Faith.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Your Testimony</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">To get your Testimony, first speak to Merko in the Hall of Truth. He'll give you a note to give to Altunic Jartin in East Commons.&nbsp; Wait in Altunic's house for him to appear, and give him the note.&nbsp; His house is near the last inn before West Commons. Walk outside, and fight Squire Narl. He should be extremely easy. After killing him and getting his head, go buy a cloth shirt from one of the merchants in the commons.&nbsp; Give the head to Altunic, then give him the shirt, to get a Token of Generosity.&nbsp; Buy (Or fight for) a Spider Venom Sack, and return to Merko. Tell him you've earned the Token of Generosity, and he'll ask you for the sack. Give it to him, and get the Token of Bravery.&nbsp; Then hand in both tokens, one at a time, to get your final task.&nbsp; This is very important, you must move very quickly to the sewer, where the canoe is, and to the left is Guard Willia. If you hesitate at all, Willia will run away, and you will lose your chance. Guard Willia will plead with you to not kill him/her, and will try to run away. The words [Freeport Militia] will appear in the paragraph, and if you try to say something, they will be long gone. If anyone gets to say anything to the Guard, please tell me what they say, if anything. I would guess the Guard is about 12th level or so, a little harder than a desert tarantula. After killing the Guard, you loot the body for a &#034;Token of Truth&#034;. If Guard Willia runs away, he/she will say, &#034;Thank you for letting me go. I promise to change my ways...Maybe!&#034;&nbsp; The reward for turning in the Token of Truth is 3 gold and your testimony.&nbsp; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> </FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="Helvetica12" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">The End</FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="Helvetica12" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">Hand in the Hilt, the Sword, and your Testimony to Brother Hayle.&nbsp; In return you will receive the legendary SoulFire.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> <FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT> </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV></TD></TR></DIV></TABLE>
</DIV>

<DIV style="margin-top: 1709px; margin-left: 113px">
<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=794><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=549><DIV align=center><FONT COLOR=#ffffff><FONT class="Helvetica12" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">2ieme Partie</FONT></FONT></DIV><DIV align=center><I><B><FONT COLOR=#db7124><FONT class="TimesRoman14" FACE="Times New Roman, adobe-times, Times" SIZE="4">Fiery Avenger Quest</FONT></FONT></B></I></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">This is now a sub-quest for the Fiery Defender Quest.&nbsp; This quest starts in Plane of Air but it is advised that you get all the items needed before you go to the quest giver.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The first two items you will need are the Ghoulbane and the Soulfire.&nbsp; The Ghoulbane is dropped from the Froglok Shin Lord.&nbsp; This froglok is located in Upper Guk.&nbsp; He is level 30 and can be killed with a well-balanced full group of high 20s.&nbsp; The Ghoulbane is a rare drop so you might have to kill him a few times before you get it.&nbsp; The Soulfire is gotten through the separate Zimel's Blade quest.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Now comes the hard part.&nbsp; You have to recreate the Book of Scale.&nbsp; There are two parts of the book, the torn, burnt book and the book of frost.&nbsp; The &#034;torn, burnt book&#034; is dropped by Nagafen (Level 53 in Nagafen's Lair), Faydedar (Level 60 in Timorous Deep), Talendor (Level 60 in Skyfire Mountains), and Severilous (Level 60 in Emerald Jungle.)&nbsp; The Book of Frost is dropped from Lady Vox (Level 53 in Permafrost), Faydedar (Level 60 in Lake of Ill Omen), and Gorenaire (Level 60 in Dreadlands.)&nbsp; </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Takes the two parts of the Book of Scale to the bartender at Blind Fish Tavern in Neriak.&nbsp; You must have high enough faction to do this part of the quest.&nbsp; You can figure out that you have high enough faction when the bartender responds to your hails.&nbsp; Give the the two parts of the Book of Scale and 1000pp to the bartender and she will give you the Book of Scale.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Now take the Book of Scale to the Oracle in Ocean of Tears.&nbsp; The oracle is located directly straight out from the docks at the Sister Isle.&nbsp; He and his guardian should be indifferent to you unless you have killed him many times.&nbsp; Give the Book of Scale to the Oracle and you will receive Miragul's Phylactery.&nbsp; Take the Phylactery to the Everfrost Ice Caves.&nbsp; Here you will find the Lich of Miragul roaming around.&nbsp; He is level 45 and aggressive to everyone so have an enchanter come along to mesmerize him.&nbsp; Once mesmerized, give the Lich the Phylactery.&nbsp; This will cause Miragul himself to spawn.&nbsp; Miragul is a very hard necromancer.&nbsp; It would be best to take as many people as you can.&nbsp; Around 3 groups of level 45-60 would be ideal.&nbsp; Get him to spawn and then attack him.&nbsp; It takes a while to kill him because of his 300-400 lifetap spell.&nbsp; It's better to be safe than sorry because he does despawn and if he does do that, you must do the entire Book of Scale part of the quest over again.&nbsp; Miragul will drop Miragul's Head and Miragul's Robe.&nbsp; These items drop every time.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Now you have all four items needed.&nbsp; Take yourself and the items to Plane of Air and wait on the fourth island aka the Pegasus Isle.&nbsp; Have a friend give Dirkog Steelhand, who is in the quest room, 500 platinum.&nbsp; This will cause Inte Akera to spawn.&nbsp; Give Inte the Soulfire and he will give you your first Blessing of Nobility.&nbsp; Then give him the Ghoulbane for your second Blessing of Sacrifice, and then give him both blessings and Miragul's Head and Miragul's Robe for the Fiery Avenger.&nbsp; You must have good faction with Inte Akera who is a Deepwater Knight.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> <FONT class="Times10">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</FONT> </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV></TD></TR></DIV></TABLE>
</DIV>

<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=341><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=338><DIV align=center><I><B><FONT COLOR=#db7124><FONT class="TimesRoman14" FACE="Times New Roman, adobe-times, Times" SIZE="4">Fiery Defender </FONT></FONT></B></I></DIV><DIV align=center><B><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">MAGIC ITEM &nbsp; LORE ITEM &nbsp; NO DROP</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">Skill: 2H Slash &nbsp; Atk Delay: 40</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">DMG: 35</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">STR: +20 &nbsp; STA: +10 &nbsp; WIS: +15 &nbsp; HP: +70 &nbsp; MANA: +30 &nbsp; SV FIRE: +10 &nbsp; SV DISEASE: +10 &nbsp; SV COLD: +10 &nbsp; SV MAGIC: +10 &nbsp; SV POISON: +10 &nbsp; </FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">Effect: Holy Shock; AC:15</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">WT: 0.1 </FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">Class: PAL&nbsp; </FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2">Race: ALL&nbsp; </FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffff><FONT class="TimesRoman10" FACE="Times New Roman, adobe-times, Times" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffff><FONT class="TimesRoman10" <TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=794><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=853><DIV align=center><FONT COLOR=#ffffff><FONT class="Helvetica12" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">3 ieme partie</FONT></FONT></DIV><DIV align=center><I><B><FONT COLOR=#db7124><FONT class="TimesRoman14" FACE="Times New Roman, adobe-times, Times" SIZE="4">Fiery Defender </FONT></FONT></B></I></DIV><DIV align=center><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">To begin the Fiery Defender quest, one must first speak to Reklon Gnallen in the Temple of Quellious within Erudin. Reklon gives you the basic information regarding this quest, as well as the background information. The actual quest giver is located within the Plane of Fear, a Fetid Fiend Irak Altil. After asking 'why are you moaning?' Irak will explain that he was betrayed by a corruptor of thought and stripped of all his holy arms. Asking you to cleanse them he details the three items needed to be cleansed as well as where they can be found: </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">You say, 'what sword?' </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Irak Altil says 'Hands of a twisted brother no longer living. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">You say, 'what shield' </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Irak Altil says 'Earthly children of the god of hate. Keeping stand over his dark brothers and sisters. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">You say, 'what breastplate' </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Irak Altil lets loose an unearthly howl as it gleams with sickly light. 'Upon she who lured me from my post. In that place where hatred festers. Painful corruption.'</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The sword is found off the Keeper of Tombs, located within the hole. Spawn time is 7-10 days. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The cleansing agent for the sword is a bucket of pure water, aquired from a mini-quest within Freeport. First say to the peasant woman found by the canal in West Freeport &#034;What water?&#034; She will hand you a bucket to take to her brother Joshua in the building beside her. Hand this to Joshua and you will recieve a bucket of pure water. Hand this and the sword to Reklon in Erudin to recieve the cleansed sword. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The shield can be found off Kirik Vil, a level 55 guard in Nektulos Forest. Kirik has an extremely high regeneration rate and can be very tough. Spawn time is 7-10 days. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">There is no actual item as the cleansing agent for the shield. Instead go to Felwithe and hand this to Elia the Pure. She will hand you back the cleansed shield. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The breastplate can be found off the Thought Destroyer in the Plane of Hate. This spawn is triggered randomly by killing various mobs within hate. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">To cleanse the breastplate one must complete a mini-quest located in Kaladim. Within the mines is an NPC named Jark. Hail him and say 'some'. Then proceed with the dialogue ending with the word 'dinner'. Go to Nella, who can be found next to the crystal pond in front of the Cleric guild. Hail her and say 'dinner' then give the dinner to Jark. You will recieve a pure crystal. Hand this and the breastplate to Reklon in Erudin to recieve the cleansed breastplate. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Now finally hand all three cleansed items to Reklon in Erudin and he will state this dialogue: </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Reklon Gnallen says 'I never thought our order would see these artifacts again. With the return of these relics we can now put at ease a scar upon the history of our order. This cleansing will atone for his failure. Your soul must be pure to have given so freely of yourself. Go now, take this crested token of our order. If you wish to free his soul you must undertake another sacrifice. </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">You say, 'what sacrifice' </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">Reklon Gnallen says 'Only this crest and the sacrifice of something that symbolizes your strength and purity will release his spirit into the cleansing flames of our lady Quellious. Go now. Thank you Soandso.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">The crest he speaks of is the Mark of Atonement recieved by turning in all three cleansed items. This symbol of strength and purity is the Fiery Avenger. Take both these items to the Plane of Fear and hand them to Irak Atil. He will give you back the famed Fiery Defender.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> </FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#ffffff><FONT class="Helvetica10" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV></TD></TR></DIV></TABLE>
</DIV>
