<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=482><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=275><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">New recruits:</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">1) You must be level 10 to join. This includes secondary characters.</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">2) you must have 2 recomendations from current guild members who have been an upstanding part of the guild for more than a month. Any</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> references from a member on probation will not be considered.</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">~OR~</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> You may be asked to complete a small quest, to prove your loyalty and willingness to help the guild. Quests will be givin with your level, race, and class in mind. </FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">You may be asked to aquire something someone needs for their trade skill, or merely sent on a journey, to collect something trivial. Perhaps you will help a guild mate in their own quests... </FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV></TD></TR></DIV></TABLE>
</DIV>

<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=487><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=474><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Guild Members:</FONT></FONT></B></DIV><DIV align=center><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">(sigh.... formalities)</FONT></FONT></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">1) Please refrain from excess curse words in the guild chat channel. if a complaint is received you will be warned. NO talk of drugs, or other illegal activity will be accepted and may result in immediate termination </FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">of your membership, with no warning.</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">2) Guild members will not ruin the reputation of another player or guild under any circumstance. doing so creates a bad name for our entire guild, and it will not be tolerated.</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">3) No begging will be allowed inside the guild. This goes for power leveling too. If someone offers to help you, wonderful., but please don't ask. ( this does not include the guild treasury. if there is anything in there that will </FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">help you let me know. that's what it's there for )</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">4) NO&nbsp; picking on newbies of ANY kind. This too may result in immediate termination without warning.</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">5) Please refrain from using the /anon command, as you dissappear from the list of people online. If you wish to go /anon, use the /role command. That is roleplaying and is just like anon, but people can still see your guild name, and you will show up online, but no one will see you&nbsp; level, race, class, or zone.</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">6) While dating inside the guild is perfectly acceptable and it is awfully cute to see people in love... the mushy, gushy talk tends to get on some peoples nerves... LOL while not a rule, it is something that has been brought to my attention and I agree with it. </FONT></FONT></B></DIV></TD></TR></DIV></TABLE>
</DIV>

SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">4) there will be an average of 1 officer per 10 people or so. Applications will be taken at any time, and stored until the need for an officer comes up.</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">A member can not be promoted to officer if a complaint has recently been received on them..</FONT></FONT></B></DIV></TD></TR></DIV></TABLE>
