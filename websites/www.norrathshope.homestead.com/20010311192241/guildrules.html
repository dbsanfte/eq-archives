<TD COLSPAN=9><DIV align=center><I><B><FONT COLOR=#ffffcc><FONT class="Bookman48" FACE="Bookman Old Style" SIZE="7">Guild Rules</FONT></FONT></B></I></DIV></TD>
</TR>
<TR VALIGN=top><TD COLSPAN=10 HEIGHT=76></TD>
</TR>
<TR VALIGN=top><TD COLSPAN=4 HEIGHT=170></TD>
<TD COLSPAN=4><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">New recruits:</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">1) You must be level 10 to join. This includes secondary characters.</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">2) you must have 2 recomendations from current guild members who have been an upstanding part of the guild for more than a month. Any</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> references from a member on probation will not be considered.</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV></TD>
<TD COLSPAN=2 HEIGHT=170></TD>
</TR>
<TR VALIGN=top><TD COLSPAN=10 HEIGHT=144></TD>
</TR>
<TR VALIGN=top><TD COLSPAN=2 HEIGHT=429></TD>
<TD COLSPAN=7><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">Guild Members:</FONT></FONT></B></DIV><DIV align=center><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">(sigh.... formalities)</FONT></FONT></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">1) Guild Members will refrain from excess curse words in the guild chat chanel. if a complaint is received you will be </FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">warned. NO talk of drugs, or other illeagal activity will </FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">be accepted and may result in immediate termination </FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">of your membership, with no warning.</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">2) Guild members will not ruin the reputation of another player or guild under any curcumstance. doing so creates a bad </FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">name for our entire guild, and it will not be tolerated.</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">3) No begging will be allowed inside the guild. This goes for power leveling too. If someone offers to help you, </FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">wonderful., but please don't ask. ( this does not include</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"> the guild treasury. if there is anything in there that will </FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">help you let me know. that's what it's there for )</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">4) NO&nbsp; picking on newbies of ANY kind. This too may result in immediate termination without warning.</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">5) Please refrain from using the /anon command, as you dissappear from the list of people online. If you wish to go /anon, use the /role command. That is roleplaying and is just like anon, but people can still see your guild name, and you will show up online, but no one will see you&nbsp; level, race, class, or zone.</FONT></FONT></B></DIV></TD>
<TD HEIGHT=429></TD>
</TR>
<TR VALIGN=top><TD COLSPAN=10 HEIGHT=128></TD>
</TR>
<TR VALIGN=top><TD COLSPAN=3 HEIGHT=254></TD>
<TD COLSPAN=4><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">OFFICERS:</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">to be an officer the following will occer:</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">1) An application wil be sent via email to you to fill out and return to me.</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">2) The application will be reveiwed, and, if i apporve, will be forwarded to the other officers. </FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">3) As the need for a new officer comes up, the present officers will vote in the officers meeting on the new recruit.</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">4) there will be an average of 1 officer per 10 people or so. Applications will be taken at any time, and stored until the need for an officer comes up.</FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></B></DIV><DIV align=center><B><FONT COLOR=#ffffcc><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2">A member can not be promoted to officer with a check by their guild status.</FONT></FONT></B></DIV></TD>
<TD COLSPAN=3 HEIGHT=254></TD>
</TR>
