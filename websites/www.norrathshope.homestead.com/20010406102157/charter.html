<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=770><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=69><DIV align=center><I><B><FONT class="TimesRoman48" FACE="Times New Roman, adobe-times, Times" SIZE="7">The Beginning</FONT></B></I></DIV></TD></TR></DIV></TABLE>

<DIV style="margin-top: 129px; margin-left: 60px">
<TABLE BORDER=0 CELLSPACING=0 CELLPADDING=0 WIDTH=639><DIV style="margin-top: 0px; margin-left: 0"><TR VALIGN=top><TD HEIGHT=1002><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3">I was in my seventh season when it happened, but I remember it well... we were so excited and no one could have predicted what lay ahead. </FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3"><BR></FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3">The high elves were returning to Firona Vie to rebuild their city. My parents, Darian and Serina were among the first to go. We had enlisted help from many races, and although there would be a fight, there was no way we could lose... </FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3"><BR></FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3">We set sail on the 20th day of september, my 8th birthday, and even though there was much to be done, my mother sat down next to me, and with her arm on my shoulder she told me about the new life that lay ahead. She then took a small key, which she had worn around her neck for as long as I could remember, and she put it it around mine.</FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3">&#034;Should anything ever happen to me, dear Reemi,&#034; she said, &#034;Search for the box of the silver dragon, and never stop searching until you find it. It will explain it all, my child&#034;</FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3"><BR></FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3">It pains me to continue with my story, but I know I must...</FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3"><BR></FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3">We boarded the ship and all was well, laughing and working we all did our part to keep the operation running smoothly and it was... until the 4th night. All was silent on the boat, everyone was sleeping, save a few watchmen and the animals. There was a blast on the deck like none I have ever heard and the light was so bright I squinted my eyes. I felt my mothers hand on my wrist, &#034;Come Reemi,&#034; she cried over the sounds of panic, aboard the ship. She quickly tied 3 empty water barrels around my waist and took me took the back of the ship. &#034;Darling, the It's happened, just as i feared,&#034; she cried as she hugged me tight, &#034;you must jump, my child, and swim as far as you can, the ship is sinking and the Iskars are here, you can make it love, I will see you soon... I promise!&#034;</FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3">&#034;Where is daddy?&#034; I sobbed</FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3">&#034;I will find him Reemi, and we will catch up to you, but you must go now, I love you dear&#034;</FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3">&#034;I love you too mommy&#034;</FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3"><BR></FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3">These were the last words I ever spoke with my mother, for I have never seen her again. It has been nearly 12 years since that fateful night.</FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3">We were the only ship that failed to make it to Firona, and as you all know, we did win the battle, and our town is refoming. </FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3"><BR></FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3">I recently found the box that my mother spoke of... just this past season.</FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3">I slid the key in the lock and my heart was pounding as the latch popped. Inside lay my mothers journal, and her mother's before her.&nbsp; I sit many nights and read their entries, wondering what they were thinking... You see, my grandmother had started a secret army of people to defend the good of Norrath, and keep the evil at bay. When she passed away, my mother found her journal and continued her efforts... But alas, I keep no secrets, so here I am, once again, taking over the well established army of&nbsp; truth and justice. Recruiting new members into our force and keeping peace throught the lands.</FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3"><BR></FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3">Norrath needs a hero.. we are that hero</FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3">We will stand tall and be strong, for together, as one, we are Norrath's Hope.</FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3"><BR></FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3"> I too... will pass this legacy on to my daughter, in the form of the silver dragon box, with my journal added to the small collection.</FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3"><BR></FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3">As for my parents, I have never given up hope... A part of me knows they are still out there, and I will find them... </FONT></B></I></DIV><DIV align=center><I><B><FONT class="TimesRoman16" FACE="Times New Roman, adobe-times, Times" SIZE="3">Someday....</FONT></B></I></DIV></TD></TR></DIV></TABLE>
</DIV>
