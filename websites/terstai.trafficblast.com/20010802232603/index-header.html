// DESC:        Display a ticking countdown clock on your web page.



var eventdate = new Date("August 27, 2000 20:00:00 CDT");



function toSt(n) {

  s=""

  if(n<10) s+="0"

  return s+n.toString();

}

 

function countdown() {

  cl=document.clock;

  d=new Date();

  count=Math.floor((eventdate.getTime()-d.getTime())/1000);

  if(count<=0)

    {cl.days.value ="----";

     cl.hours.value="--";

     cl.mins.value="--";

      return;

   }

  count=Math.floor(count/60);

  cl.mins.value=toSt(count%60);

  count=Math.floor(count/60);

  cl.hours.value=toSt(count%24);

  count=Math.floor(count/24);

  cl.days.value=count;    

  

  setTimeout("countdown()",500);

}

// end hiding script-->

</script>
