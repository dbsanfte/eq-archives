<p align="center"><b><font size="6">Becoming a Sponsor is easy</font></b></p>
<p align="left"><font size="3"><b>1: If you have a site with a links section,
add Top Links Direct to it.</b></font></p>
<p align="left"><font size="3"><b>2: Email the webmaster and let him know, give
URL it can be found at.</b></font></p>
<p align="left"><font size="3"><b>3: After we verify it is there, we will add
your site as our sponsor on all pages.</b></font></p>
<p align="center"><b><font size="5" color="#FF0000">Too Easy</font></b></p>
