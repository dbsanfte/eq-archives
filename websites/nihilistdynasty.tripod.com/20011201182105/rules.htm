<div>
                <TABLE BORDER="0" CELLPADDING="1" CELLSPACING="1" WIDTH="612" BORDERCOLORLIGHT="#C0C0C0" BORDERCOLORDARK="#808080" FRAME="VOID" RULES="NONE" ALIGN="BOTTOM" HSPACE="0" VSPACE="0"

                        <tD  VALIGN=CENTER ROWSPAN=36 HEIGHT= 1  WIDTH="608"><div>
1) Guild members must uphold and maintain the guild reputation at all times</div>
<bR>
<div>
2) No kill stealing</div>
<bR>
<div>
3) No use of offensive or sexually explicit conversation in guild chat.</div>
<bR>
<div>
4) No verbal attacks towards the guild or its members in guild chat.</div>
<bR>
<div>
5) No excessive or intrusive demands for ports, items, or powerleveling.</div>
<bR>
<div>
6) Refrain from giving high end items to those who would other wise not be able to obtain them,</div>
<div>
instead issue a quest to them for the item or offer it at a reduced price.</div>
<bR>
<div>
7) Any guild business requiring a vote shall be voted on at a guild event.</div>
<bR>
<div>
8) Awards of higher titles will be given by the House leader, in which part the members, valor,</div>
<div>
reputation, and over all guild particapation will be reviewed.</div>
<bR>
<div>
9) Ideas or suggestions for guild improvement should be referred to your house leader.</div>
<bR>
<div>
10) All members are to maintain a valid email address. </div>
<bR>
<div>
11) Raids will be posted on the message board in advance. If you wish to attend, you must sign up</div>
<div>
there. Those who did not sign up for the raid will only end up in groups on an on need basis. </div>
<bR>
<div>
12) If you wish to set up a raid for an item or quest, you must be within 6 levels of the creature that must be killed if you are underl level 40. After level 40, you may attempt to set up item/quest raids as seen fit by your house leader and the Raid coordinator.</div>
<bR>
<div>
<B>Recruiting</B></div>
<bR>
<div>
All new recruits must be sponsored by a current member, in which they would be responsible</div>
<div>
for the new recruits, behavior within the guild during their probationary period. This also includes</div>
<div>
informing the new recruit about our website, rules, and getting them introduced into the guild.</div>
<div>
When you have someone you would like to sponsor, direct them to our web sight and have them visit our message board and fill out an application there.</div>
<bR>
