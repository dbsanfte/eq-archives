<div>
The Rules of the Dragon's Wrath</div>
<div>
1) Uphold the Guild Rules </div>
<bR>
<div>
2) In battle get to know your role and abilities and use this to help others. A shadowknight can save someone with fear. A monk can hold a mob back and then feign death after everyone has escaped. Learn a saving tactic and the people you save will remember. </div>
<bR>
<div>
3) Be courteous in all forms. In any group and around anyone try to be nice. If someone is really getting on your nerves or has committed an uncalled for action report this to the guild and we will make sure they are put on a black list. </div>
<bR>
<div>
4) Try to stay up to date, to the best of your ability, by visiting the websites message board and checking emails before siging into the game. </div>
<bR>
<div>
5) Participation is a main factor in earning your ranks in Dragons Wrath. If we can't see you in action how can we evaluate or give you a new status. Please try to participate in the guild events if able. </div>
<bR>
<div>
6) Above all this is our guild not my guild or the sentinels. We do not want to tell you or make you play the game a certai way. If you have any misconceptions, ideas, or don't like what we're doing let us know. We want to try and let everyone have a FUN time on the game. What else do we play it for? </div>
<bR>
<div>
7) New status and ranks will be announced at guild meetings. You will not know ahead of time if you are recieving one. Outstanding performers regardless of position will recieve rewards and gifts. </div>
<bR>
<div>
8) Crusador and Sentinel ranks if you would like to try your role as leader of the Dragons Wrath or sentinel you can challenge that position. The process is like a ballot everyone will place a vote with the emperor or ambassador secretly and thus the people will decide the new ruler. If a new leader is chosen they have the right to change any rules and regulations, intiate quests and raids that fall under the Dragons Wrath while in there position. If an unjust ruler should take the throne and does not show proper leadership the Ambassador, Lord, and Emperor all have the ability to judge him on his behavor and remove him if necessary. A lead position can only be challenged one time by a person if that same person would like to try again they must wait till after the next guild meeting usually a months time. </div>
