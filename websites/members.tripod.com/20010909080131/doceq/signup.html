<html>
<head>
<title>
Disciples of Chaos membership application
</title>
<Base href=http://members.tripod.com/doceq/>
</head>
<BODY background=backgrounds/parchtile.gif>
<center>
	<h1>
		Application for<br>
		Guild Membership
	</h1>
</center>
<hr><br>
<form method=post action=mailto:zheldon@carolina.rr.com enctype=text/plain>
	<table name=application><!--****Holds the inputs****-->
		<tr>
			<td>
				<label>Character's name: </label>
			</td>
			<td>
				<input type=text name=character_name size=40>
			</td>
		</tr>
		<tr>
			<td>
				<label>Character's level: </label>
			</td>
			<td>
				<input type=text name=character_level size=2>
			</td>
		</tr>
		<tr>
			<td>
				<label>Character's class: </label>
			</td>
			<td>
				<select name=character_class size=1>
					<option>Bard
					<option>Cleric
					<option>Druid
					<option>Enchanter
					<option>Magician
                              <option>Monk
                              <option>Necromancer
					<option>Paladin
					<option>Ranger
					<option>Rogue
					<option>Shadow Knight
					<option>Shaman
					<option>Warrior
					<option>Wizard
				</select>
			</td>
		</tr>
		<tr>
			<td>
				<label>Character's Religion: </label>
			</td>
			<td>
				<select name=character_religion size=1>
					<option>Agnostic
					<option>Bertoxxulous
					<option>Brell Serilis
					<option>Bristlebane
					<option>Cazic Thule
					<option>Innoruuk
					<option>Rallos Zek
					<option>Solusek Ro
					<option>Veeshan
				</select>
			</td>
		</tr>
		<tr>
			<td>
				<label>Email address: </label>
			</td>
			<td>
				<input type=text name=member_email size=50>
			</td>
		</tr>
		<tr>
			<td>
				<label>Preferred trade skill:  </label>
			</td>
			<td>
				<select name=character_trade_skill size=1>
					<option>None
					<option>Baking
					<option>Brewing
					<option>Fletching
					<option>Jewel Craft
					<option>Smithing	
					<option>Tailoring
				</select>
			</td>
		</tr>
	</table>
	<label>Suggestions or comments: </label><br>
		<textarea name=user_comments cols=60 rows=6></textarea>
<br>
<br>
<center>
	<input type=submit value=Apply accesskey=a>
	<input type=reset value=Clear accesskey=c>
	<br>
	<font size=3>
		Press <b>alt-a</B> for send and <b>alt-c</B> for clear if you prefer.<br>
	Mac users know to use the <b>apple</B> or <b>command</B> key in place of the <b>alt
	</B> key.
	</font>
</center>
</form>
</BODY>
</html>
