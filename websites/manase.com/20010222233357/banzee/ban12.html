<P>

<DL>
<DD>　１９４４年９月１７日。連合軍は戦いに決着をつけるべくマーケット・ガーデン作戦を発令した。この計画は、ドイツ占領下にある複数の橋を空挺部隊が占拠し、その橋を利用して機甲部隊を中心とした地上部隊の主力を一気にベルリンまで前進させようという大胆な計画である。
<DD>　プレイヤーはイギリス第一空挺隊の小隊長としてアルンヘルムへと降下。橋を占拠した後、史実に従って撤退した。降下位置がずれれば捕虜に、撤退が遅れれば戦死するだけだ。
<DD>　果たして戦いの行方は？
</DL>
