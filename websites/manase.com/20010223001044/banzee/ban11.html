<DL>
<DD>　バンジージャンプ航法によって宇宙に拡大した人類は、なおも戦争の火種を抱えていた。地球本国の圧制に苦しむ植民惑星が独立戦争を決意していたのだ。
<DD>　しかし、宣戦布告より早く攻撃をかければテロ行為とみなされ、わずかな自治権さえ奪われてしまうが、かといって遅すぎれば防衛側が迎撃体制を固めてしまう。いかにタイミングを見計らって攻撃をかけるかが、運命の分かれ道となる。
