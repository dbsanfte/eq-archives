<TD><DIV align=center><FONT COLOR=#99ccff><FONT class="Helvetica32" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="6">Rules and Regulations</FONT></FONT></DIV></TD>

<TD COLSPAN=3 ROWSPAN=3><DIV align=left><B><FONT COLOR=#33ccff><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4">In order to maintain order and well being among members of our guild, we have set forth the guidelines below:</FONT></FONT></B></DIV><DIV align=left><B><FONT COLOR=#99ffff><FONT class="Helvetica18" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="4"><BR></FONT></FONT></B></DIV><DIV align=left><FONT COLOR=#999999><FONT class="Helvetica13" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="2"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#99ffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">1) We are NOT a power-leveling or twinking guild.&nbsp; Power-leveling and twinking are allowed IF both parties agree.&nbsp; You may offer to power-level or twink, but may NEVER ask to be power-leveled or twinked.&nbsp; Please do not pester/beg higher levels to help you.&nbsp; We do believe in helping each other, but each player has a life in Norath, please respect their time and resources.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#99ffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#99ffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">2) You should ONLY ask for help, resurrect and porting, when in dire need of it.&nbsp; No one should ask/pester for porting UNLESS they have an emergency.&nbsp; For instance, you died on the other side of the world.&nbsp; When asking the guild for a port please state the circumstances you are in and why you need one. We do believe in helping each other, but each player has a life in Norath.&nbsp; Asking a member to log on another character regardless of need to obtain ports or resurrections is forbidden.&nbsp; Please respect their time and resources.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#99ffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#99ffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">3) We expect each member to emanate good conduct in their adventures through Norath (each member is a reflection of our guild as a whole).&nbsp; For instance, cursing, pestering, kill stealing, player killers, and arguing are things you should not participate in.&nbsp; Disagreements will happen, when they do try to understand both sides of the conflict and try to come to an agreeable settlement.&nbsp; Under no circumstances is anyone to argue in guild say (take it to tells).&nbsp; While using guild say you should not say anything that would be offensive to younger players (i.e. profuse swearing, racial slurs, and inappropriate sexual language).</FONT></FONT></DIV><DIV align=left><FONT COLOR=#99ffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#99ffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">4) We must show respect for each other.&nbsp; We all come from different areas and backgrounds; we have cultural and social diversity and must understand and respect differences.&nbsp; This respect must be demonstrated when dealing with others.</FONT></FONT></DIV><DIV align=left><FONT COLOR=#99ffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3"><BR></FONT></FONT></DIV><DIV align=left><FONT COLOR=#99ffff><FONT class="Helvetica16" FACE="Arial, Helvetica, adobe-helvetica, Arial Narrow" SIZE="3">5) Anyone found being dishonest, disrespectful, or counter productive to the guild as a whole or any officer will be asked to leave.&nbsp; If they act this way to others in the guild they will be warned to modify their behavior.</FONT></FONT></DIV></TD>
