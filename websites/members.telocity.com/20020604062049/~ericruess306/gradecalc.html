<HTML><BODY><TITLE>Grade Calculator</TITLE>
<SCRIPT Language=VBScript>
'************************************

Sub btnSubmit_OnClick()

	Dim Grades(5)
	
	Grades(0) = Cint(txtGrade1.Value)
	Grades(1) = Cint(txtGrade2.Value)
	Grades(2) = Cint(txtGrade3.Value)
	Grades(3) = Cint(txtGrade4.Value)
	Grades(4) = Cint(txtGrade5.Value)
	txtOutput.Value = txtStudentName.Value & " scored an average " & (Grades(0) + Grades(1) + Grades(2) + Grades(3) + Grades(4)) / 5 & " for a(n) " & LetterGrade(Cint((Grades(0) + Grades(1) + Grades(2) + Grades(3) + Grades(4)) / 5))

End Sub
'************************************

Function LetterGrade(Score)
		
	If Score >= 90 Then
		LetterGrade = "A"
	ElseIf Score >= 80 Then
		LetterGrade = "B"
	ElseIf Score >= 70 Then
		LetterGrade = "C"
	ElseIf Score >= 60 Then
		LetterGrade = "D"
	Else
		LetterGrade = "F"
	End If

End Function
'************************************	
</SCRIPT>
	<H2 align=center>Grade Calculator</H2>
	<br>
	Student Name: <input name=txtStudentName>
	<br>
	Grade 1: <input name=txtGrade1 size=3>
	<br>
	Grade 2: <input name=txtGrade2 size=3>
	<br>
	Grade 3: <input name=txtGrade3 size=3>
	<br>
	Grade 4: <input name=txtGrade4 size=3>
	<br>
	Grade 5: <input name=txtGrade5 size=3>
	<br>
	<input name=btnSubmit type=button value=Calculate>
	<br>
	<br>
	Result: <input name=txtOutput size=50>
</BODY></HTML>
